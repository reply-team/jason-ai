name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-publish:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore runtime/Jason.slnx

      - name: Build (warnings are errors)
        run: dotnet build runtime/Jason.slnx --configuration Release --no-restore

      - name: Test (offline)
        run: dotnet test --solution runtime/Jason.slnx --configuration Release --no-build

      # Temporary: the runtime test host has been unable to exit on this runner after every test passed.
      # Run it on its own, and when it announces the wait for foreground threads, capture the managed stacks.
      - name: Capture the stacks of a test host that cannot exit
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-stack | Out-Null
          $exe = "runtime/tests/Jason.Runtime.Tests/bin/Release/net10.0/Jason.Runtime.Tests.exe"
          $out = "diag-host.out.log"
          $err = "diag-host.err.log"
          $p = Start-Process $exe -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $deadline = (Get-Date).AddMinutes(8)
          $dumped = $false
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 250
            if (-not $dumped -and (Test-Path $out) -and (Select-String -Path $out -Pattern 'Waiting 10 seconds' -Quiet)) {
              $dumped = $true
              Write-Host "=== the host (pid $($p.Id)) is waiting for foreground threads; managed stacks: ==="
              dotnet-stack report -p $p.Id
              Write-Host "=== native threads ==="
              (Get-Process -Id $p.Id).Threads | Select-Object Id, ThreadState, WaitReason, StartTime | Format-Table | Out-String | Write-Host
            }
          }
          if (-not $p.HasExited) { Write-Host "host still alive after the deadline"; Stop-Process -Id $p.Id -Force }
          Write-Host "=== host exit code: $($p.ExitCode); dumped: $dumped ==="
          Get-Content $out | Select-String -Pattern 'Waiting 10|FATAL|Passed!|Failed!|total:|failed:' | ForEach-Object { $_.Line }
          if (Test-Path $err) { Get-Content $err | Select-Object -Last 10 }
          exit 0

      - name: Publish self-contained single-file executable
        run: dotnet publish runtime/src/Jason.App --configuration Release --runtime ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true --output artifacts/publish/${{ matrix.rid }}

      - name: Smoke-test the published executable
        shell: pwsh
        run: |
          $exe = Join-Path "artifacts/publish/${{ matrix.rid }}" ($IsWindows ? "jason.exe" : "jason")
          $env:JASON_DATA_DIR = Join-Path ([IO.Path]::GetTempPath()) "jason-ci-smoke"

          $elapsed = Measure-Command { & $exe --version | Tee-Object -Variable version }
          if ($LASTEXITCODE -ne 0) { throw "jason --version exited with $LASTEXITCODE" }
          Write-Host "jason --version -> $version ($([int]$elapsed.TotalMilliseconds) ms cold start)"

          $elapsed = Measure-Command { & $exe runtime status | Tee-Object -Variable status }
          $statusExit = $LASTEXITCODE
          Write-Host "jason runtime status -> exit $statusExit in $([int]$elapsed.TotalMilliseconds) ms: $status"
          if ($statusExit -ne 3) { throw "expected exit code 3 without a running runtime, got $statusExit" }
          if ($status -notmatch '"code":"no_descriptor"') { throw "expected a no_descriptor error envelope" }

          # The last command of this step is expected to exit 3, and pwsh would hand that on as the step's
          # own exit code. Everything asserted above passed, so the step succeeded.
          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: jason-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
          if-no-files-found: error
