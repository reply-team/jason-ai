name: CI

# Which checks a run needs is decided once, by the version job, which every other job needs, from the event and the
# branch a change lands on:
# - a draft pull request's push runs the Linux set: the version, linux-x64, install.sh on ubuntu, the update on
#   linux-x64 and the UI; linux-x64 tests the critical tier alone, the tests that carry the Critical trait, and a
#   draft's run keeps no record of the tree it tested;
# - a pull request into a release branch runs the Linux set when it is ready as well, which is all a release branch's
#   ruleset requires, and reports nothing as skipped; its linux-x64 tests the critical tier there too, under its own
#   name once the pull request is ready. The whole suite runs once per release, on the release's pull request into main,
#   and a change under dotnet/ ran it locally before it was marked ready. A pull request into any other branch but main
#   runs the Linux set as well, and tests the whole suite;
# - the release's pull request, from a release branch into main, runs every check, macOS included, when it is marked
#   ready for review and on every push after that; a push after that which changes nothing but documentation since the
#   tree its last run of every check tested runs the Linux set, and reports the rest as skipped;
# - the version pull request, which moves main to the next version after a release - a pull request into main, not from
#   a release branch, that changes nothing but the version prefix's line and the pins the version guards hold to it -
#   runs the version and linux-x64 when it is ready, and linux-x64 tests the critical tier under its own name: for this
#   pull request the tier is the ready run, by rule. Every other check reports as skipped by rule;
# - any other pull request into main runs the Linux set when it is ready, and reports every other check as skipped by
#   rule;
# - every ready run of a pull request into main or into a release branch keeps a record of the tree it tested and of
#   the set it ran, whichever set that is, but for a push to the release's pull request that changes documentation
#   only, and so does a push to main that runs every check; a draft's run keeps none. A record is named by the tree it
#   tested, so a later run finds it by that tree's id, whatever ref the run that kept it ran on; only a run whose head
#   is this repository's is believed, never a run of a fork's pull request;
# - a push to main or to a release branch whose tree a run that passed recorded runs the version alone, and on main the
#   rest report as skipped. Main passes over the record of a pull request into a release branch, whose test was the
#   critical tier, and a run still in progress, cancelled or failed has recorded nothing;
# - a push to main whose tree no run recorded, and whose one commit changes nothing but documentation against its
#   parent, runs the version alone as well, and the rest report as skipped. Any other push to main runs every check,
#   macOS included;
# - any other push to a release branch runs the Linux set and the whole suite. No ruleset reads a push to a release
#   branch, so nothing reports as skipped there;
# - a run started by hand runs every check, macOS included. Nothing runs nightly. A release runs its own checks, macOS
#   among them, in release.yml.
# Every check the main branch's ruleset requires reports on every ready pull request into main and on every push to
# main, as a success where a rule skipped it: a skipped job reports success, and a matrix row that is absent would not
# report at all.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# One run per kind and ref: a push cancels the run an earlier push to the same pull request or branch started, and a run
# started by hand neither cancels a push's run nor is cancelled by it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Neither the .NET SDK nor PowerShell reports telemetry from this workflow: nothing here but the checkout, the
# toolchain and the package restore reaches the network.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  POWERSHELL_TELEMETRY_OPTOUT: '1'

jobs:
  version:
    name: The version this tree carries
    runs-on: ubuntu-latest
    # Deciding which checks a run needs reads earlier runs and their artifacts.
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      sdk: ${{ steps.dotnet.outputs.sdk-version }}
      full: ${{ steps.legs.outputs.full }}
      build: ${{ steps.legs.outputs.build }}
      linux: ${{ steps.legs.outputs.linux }}
      macos: ${{ steps.legs.outputs.macos }}
      tier: ${{ steps.legs.outputs.tier }}
      platforms: ${{ steps.legs.outputs.platforms }}
      updates: ${{ steps.legs.outputs.updates }}
      rids: ${{ steps.legs.outputs.rids }}
      skipping: ${{ steps.legs.outputs.skipping }}
      skipped: ${{ steps.legs.outputs.skipped }}
    steps:
      # A pull request's checkout is its merge with the base branch, and the merge's first parent is the base branch's
      # head: two commits deep, the checkout holds both, and so both sides of what the pull request changes. A push's
      # checkout holds its commit and that commit's parent the same way.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The SDK this whole run builds on: the newest the 10.0 channel has released, resolved here once and handed on as
      # the sdk output, which every other job that sets up .NET passes to the action. So no two jobs of one run build on
      # two SDKs, even when the channel releases one while the run is going.
      - id: dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: latest

      - id: version
        shell: pwsh
        run: |
          # MSBuild's own answer — VersionPrefix and VersionSuffix from Directory.Build.props, a -dev version —
          # so a pull request is stamped with the number the tree already carries rather than with a second copy
          # kept here. Every job below but one is told this value; release.yml decides the same input from the tag.
          $version = (dotnet msbuild dotnet/src/Jason.App/Jason.App.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "MSBuild did not answer with a version." }
          Write-Host "version -> $version"
          "version=$version" >> $env:GITHUB_OUTPUT

          # And the version a release of this tree would carry: VersionPrefix alone, the number its tag would name.
          # The one job that is told it runs the whole suite under it.
          $release = (dotnet msbuild dotnet/src/Jason.App/Jason.App.csproj -getProperty:VersionPrefix).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $release) { throw "MSBuild did not answer with a VersionPrefix." }
          Write-Host "release -> $release"
          "release=$release" >> $env:GITHUB_OUTPUT

      # The tree this run tests, and its listing, which a later run compares with. A pull request's checkout is its merge
      # with the base branch, so its tree is the one a squash of it puts on main. And the listing of the base, the
      # checkout's first parent, which is what the change is read against: for a pull request, the base branch's head;
      # for a push to main of one commit, that commit's parent, which is where main was before the push.
      - id: tree
        name: The tree this run tests
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or -not $tree) { throw "git did not name this checkout's tree" }
          $listing = Join-Path $env:RUNNER_TEMP 'listing.txt'
          git ls-tree -r --full-tree HEAD | Set-Content -LiteralPath $listing
          if ($LASTEXITCODE -ne 0) { throw "git did not list this checkout's tree" }
          "tree=$tree" >> $env:GITHUB_OUTPUT
          "listing=$listing" >> $env:GITHUB_OUTPUT

          # Which base, if any, this run reads its change against. A push to main is read against its commit's parent only
          # where the push is that one commit: a merge's two parents, a commit with none, or a push that moves main by more
          # than one commit or not from the commit's parent has no one parent its whole change is against.
          $listsBase = $env:EVENT -eq 'pull_request'
          if ($env:EVENT -eq 'push' -and $env:TARGET -ceq 'main') {
            $parents = @("$(git rev-list --parents -n 1 HEAD)".Split(' ', [StringSplitOptions]::RemoveEmptyEntries) | Select-Object -Skip 1)
            if ($LASTEXITCODE -ne 0) { Write-Host "git did not name the parents of this push's commit" }
            elseif ($parents.Count -ne 1) { Write-Host "this push's commit has $($parents.Count) parents, so its change is read against none" }
            elseif ($parents[0] -cne $env:BEFORE) { Write-Host "this push moves main from $($env:BEFORE), not from its commit's parent $($parents[0]), so its change is read against none" }
            else { $listsBase = $true }
          }

          # A base that cannot be listed is said and left out: without it no pull request is taken for the version pull
          # request, and no push to main for one of documentation alone, which costs minutes and skips nothing.
          $base = ''
          if ($listsBase) {
            $base = Join-Path $env:RUNNER_TEMP 'base.txt'
            git ls-tree -r --full-tree 'HEAD^1' | Set-Content -LiteralPath $base
            if ($LASTEXITCODE -ne 0) { Write-Host "git did not list the tree of this change's base"; $base = '' }
          }
          "base=$base" >> $env:GITHUB_OUTPUT

      # What an earlier run tested, asked only where the answer can let this run skip a leg: for a push to main or to a
      # release branch, the record of this very tree that the newest run to pass kept, on whatever ref it ran; for a push
      # to the release's pull request once it is ready, the record its own last passing run of every check kept. Either
      # comes only from a run of this repository: a run from a fork is passed over, and said. Whatever
      # goes wrong here - an API error, no such run, a record that cannot be had - is an answer of nothing found, and on
      # nothing found the step after this skips nothing the branch requires.
      - id: earlier
        name: Find what an earlier run tested
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          $runs = "repos/$env:REPOSITORY/actions/workflows/ci.yml/runs"

          function Api([string] $path) {
            $answer = gh api $path
            if ($LASTEXITCODE -ne 0) { throw "the API did not answer $path" }
            ($answer -join "`n") | ConvertFrom-Json
          }

          # A record a run kept, under the name it was kept by, downloaded and read: its file, and what it says.
          function Download([string] $run, [string] $name) {
            $directory = Join-Path $env:RUNNER_TEMP "earlier/$run"
            gh run download $run --repo $env:REPOSITORY --name $name --dir $directory | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "the record run $run kept could not be downloaded" }
            $file = (Get-ChildItem -LiteralPath $directory -Recurse -Filter record.json | Select-Object -First 1).FullName
            if (-not $file) { throw "the record run $run kept holds no record.json" }
            @{ file = $file; record = Get-Content -Raw -LiteralPath $file | ConvertFrom-Json }
          }

          # A record is kept under the name of the tree it tested, and only by a ready pull request's run or a push to main
          # that runs every check, naming the set it ran.
          $named = 'tested-tree-*'

          # A run whose head came from another repository ran that repository's own workflow, which could keep a record
          # claiming any tree under any name: a fork's pull request runs here, and its branch may carry any name. Only a run
          # of this repository is believed; any other is passed over, and said.
          function Elsewhere([string] $id, $run) {
            $from = "$($run.head_repository.full_name)"
            if ($from -ne $env:REPOSITORY) { "run $id ran from $(if ($from) { $from } else { 'a repository that is gone' }), not from this repository" }
          }

          # The newest of these runs that kept a record of the tree it tested for this pull request, downloaded. Only
          # runs that passed are asked about, so a record names a tree that set passed on.
          function Recorded($candidates, [string] $number) {
            $passed = @()
            foreach ($run in @($candidates | Where-Object { $_ })) {
              $other = Elsewhere "$($run.id)" $run
              if ($other) { $passed += $other; continue }
              $kept = @((Api "repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100").artifacts | Where-Object { $_ -and -not $_.expired -and "$($_.name)" -clike $named })
              if ($kept.Count -eq 0) { continue }
              $read = Download "$($run.id)" "$($kept[0].name)"
              if ("$($read.record.pull_request)" -ne $number) { continue }
              return @{ file = $read.file; said = "run $($run.id) of pull request #$number tested tree $($read.record.tree)" }
            }
            @{ file = ''; said = "no passing run of pull request #$number kept a record of its tree$(if ($passed.Count -gt 0) { " ($($passed -join '; '))" })" }
          }

          # The record of this run's tree that the newest run to pass kept, on any ref, downloaded: the artifacts named by
          # this tree, newest first, each asked about the run that kept it, since an artifact is there from the moment its
          # run uploads it. A run still in progress, cancelled or failed is passed over, and on main so is the record of a
          # pull request into a release branch, whose ready run tested the critical tier alone: main takes a tree tested
          # by the whole suite, or by the version pull request, whose tier is its ready run by rule.
          function OfThisTree {
            $passed = @()
            $artifacts = @((Api "repos/$env:REPOSITORY/actions/artifacts?name=tested-tree-$($env:TREE)&per_page=20").artifacts |
              Where-Object { $_ -and -not $_.expired -and $_.workflow_run.id } | Sort-Object -Property created_at -Descending)
            foreach ($artifact in $artifacts) {
              $id = "$($artifact.workflow_run.id)"
              $run = Api "repos/$env:REPOSITORY/actions/runs/$id"
              $other = Elsewhere $id $run
              if ($other) { $passed += $other; continue }
              if ($run.status -cne 'completed') { $passed += "run $id is $($run.status)"; continue }
              if ($run.conclusion -cne 'success') { $passed += "run $id concluded $($run.conclusion)"; continue }
              $read = Download $id "$($artifact.name)"
              if ("$($read.record.tree)" -cne $env:TREE) { $passed += "run $id kept a record of another tree"; continue }
              if ($env:TARGET -ceq 'main' -and "$($read.record.checks)" -ceq 'linux') { $passed += "run $id on $($read.record.ref) tested the critical tier alone, into a release branch"; continue }
              return @{ file = $read.file; said = "run $id on $($read.record.ref) tested tree $($read.record.tree)" }
            }
            @{ file = ''; said = "no run that passed kept a record of tree $($env:TREE)$(if ($passed.Count -gt 0) { " ($($passed -join '; '))" })" }
          }

          $record = ''
          try {
            if ($env:EVENT -eq 'push') {
              $found = OfThisTree
              $record = $found.file; $said = $found.said
            } elseif ($env:EVENT -eq 'pull_request' -and $env:ACTION -eq 'synchronize' -and $env:DRAFT -eq 'false' -and
                $env:TARGET -ceq 'main' -and $env:BRANCH -clike 'release/*') {
              $branch = [uri]::EscapeDataString($env:BRANCH)
              $found = Recorded (Api "$($runs)?event=pull_request&branch=$branch&status=success&per_page=20").workflow_runs $env:PULL_REQUEST
              $record = $found.file; $said = $found.said
            } else {
              $said = 'nothing an earlier run tested changes what this run needs'
            }
          } catch {
            $record = ''
            $said = "nothing was found ($($_.Exception.Message))"
          }

          $said = $said -replace '\s+', ' '
          Write-Host $said
          "record=$record" >> $env:GITHUB_OUTPUT
          "found=$said" >> $env:GITHUB_OUTPUT

      # Which checks this run needs, from the event, the branch a change lands on, the branch a pull request comes from
      # and what the step before found, handed on as a word for each kind of job, the legs each matrix runs and the
      # checks the stand-in reports as skipped by rule. A matrix cannot be cut by its job's own condition, so its legs
      # are decided here, from the whole list. A job only a run of every check needs carries
      # `if: needs.version.outputs.full == 'true'`, one the Linux set needs `linux`, the platform legs, which every set
      # that builds anything needs, `build`, and a job its condition skips reports success to the checks the ruleset
      # requires. A leg is skipped only on what was found: nothing found, or a record that cannot be read, skips nothing
      # the branch requires. A pull request into a release branch tests the critical tier, ready or draft: the whole
      # suite's run per release is the release's pull request's, and a change under dotnet/ ran it locally before it
      # was marked ready.
      - id: legs
        name: Decide which checks this run needs
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          BRANCH: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          TREE: ${{ steps.tree.outputs.tree }}
          LISTING: ${{ steps.tree.outputs.listing }}
          BASE: ${{ steps.tree.outputs.base }}
          RECORD: ${{ steps.earlier.outputs.record }}
          FOUND: ${{ steps.earlier.outputs.found }}
          PLATFORMS: '[{"rid":"linux-x64","os":"ubuntu-latest","name":"linux-x64"},{"rid":"win-x64","os":"windows-latest","name":"win-x64"},{"rid":"osx-arm64","os":"macos-latest","name":"osx-arm64"}]'
          UPDATES: '[{"rid":"linux-x64","os":"ubuntu-latest"},{"rid":"win-x64","os":"windows-latest"}]'
        run: |
          # Documentation is Markdown a build compiles nothing of: outside the C# tree, the workflows and the plugins, a
          # plain file before and after. Read is documentation, run is code: a page a test merely reads (the publication,
          # page-claims and documented-commands tests read every published page) is documentation. Those tests are mostly
          # outside the critical tier, which is all a documentation change on a pull request into a release branch, draft
          # or ready, runs (a ready pull request into main that is not the release's, an unrecorded push to a release
          # branch and a pull request into another branch run the whole suite on linux-x64). So a branch that changes
          # docs/ or skills/ runs the whole suite locally before its pull request opens, and the release's pull request,
          # where the whole suite runs, is the first place CI reads those pages. One page differs in kind and stays code: the
          # wiring check's page, docs/golden-path.md, whose step 3 line, `jason plugin install reply`, a test runs through the
          # program, and whose other commands the wiring check's tests read their arguments from, so a change to it runs the
          # three legs. LICENSE, which every archive the legs package carries, is not Markdown, so it is code already.
          $runAsCode = @('docs/golden-path.md')
          function Documentation([string] $path, $kinds) {
            ($path -cmatch '\.md$') -and ($path -cnotmatch '^(dotnet|\.github|plugins)/') -and ($runAsCode -cnotcontains $path) -and
              (@($kinds | Where-Object { $_ -and $_ -cnotlike '100644 blob *' }).Count -eq 0)
          }

          # A tree as git ls-tree -r lists it, "<mode> <type> <object><tab><path>" a line, as each path's entry.
          function Entries($lines) {
            $entries = [Collections.Generic.Dictionary[string, string]]::new([StringComparer]::Ordinal)
            foreach ($line in @($lines)) {
              $tab = "$line".IndexOf("`t")
              if ($tab -lt 1) { throw "'$line' is not a line of git ls-tree" }
              $entries[$line.Substring($tab + 1)] = $line.Substring(0, $tab)
            }
            if ($entries.Count -eq 0) { throw 'the listing names no file' }
            $entries
          }

          function Kind($entries, [string] $path) { $kind = $null; if ($entries.TryGetValue($path, [ref] $kind)) { $kind } }

          # The paths whose entry differs between two trees' entries, in order.
          function Differing($before, $after) {
            $paths = [Collections.Generic.SortedSet[string]]::new([StringComparer]::Ordinal)
            foreach ($path in $before.Keys) { if ((Kind $after $path) -cne $before[$path]) { [void] $paths.Add($path) } }
            foreach ($path in $after.Keys) { if (-not $before.ContainsKey($path)) { [void] $paths.Add($path) } }
            , @($paths)
          }

          # The paths whose entry differs between the tree the record names and this run's, which are not documentation.
          function NotDocumentation($record) {
            $before = Entries $record.listing
            $after = Entries @(Get-Content -LiteralPath $env:LISTING)
            , @((Differing $before $after) | Where-Object { -not (Documentation $_ @((Kind $before $_), (Kind $after $_))) })
          }

          function Record { Get-Content -Raw -LiteralPath $env:RECORD | ConvertFrom-Json }

          # The set the run that kept a record ran, as the record names it; a record kept before records named it says so.
          function Ran($record) { if ("$($record.checks)") { "the set $($record.checks)" } else { 'a set its record does not name' } }

          # Paths as a reader takes them in: up to twenty by name, and how many more.
          function Some($paths) {
            $all = @($paths)
            if ($all.Count -eq 0) { 'nothing' } elseif ($all.Count -le 20) { $all -join ', ' } else { "$(@($all | Select-Object -First 20) -join ', ') and $($all.Count - 20) more" }
          }

          # The version pull request's paths, named here only: the version prefix's file, whose VersionPrefix line is the
          # version this tree builds, and the four files whose pins of that version the version guards hold to it - the
          # line of the skills pack, the pinned-install examples of the install page and the help of both install scripts.
          # A ready pull request into main, not from a release branch, that changes these paths against its base and no
          # other, and whose change to the props file is its VersionPrefix line alone, is the pull request that moves main
          # to the next version after a release. All five move together, since the guards hold each pin to the prefix; one
          # left behind is not taken for the version pull request, so the whole suite those guards are in finds it.
          $versionPaths = @('dotnet/Directory.Build.props', 'skills/runtime/README.md', 'docs/INSTALL.md', 'install/install.sh', 'install/install.ps1')
          $props = $versionPaths[0]
          $prefixLine = '^\s*<VersionPrefix>[^<]*</VersionPrefix>\s*$'

          # A file's lines as a listing's entry names it, read from the checkout, which holds the merge and both its parents.
          function Lines([string] $kind) {
            $object = "$kind".Split(' ')[-1]
            if ($object -cnotmatch '^[0-9a-f]{40,64}$') { throw "'$kind' names no object" }
            $lines = @(git cat-file blob $object)
            if ($LASTEXITCODE -ne 0) { throw "git did not read the object $object" }
            , $lines
          }

          # Why a pull request whose changes against its base are these is not the version pull request; nothing when it is.
          function NotTheVersion($before, $after, $changed) {
            $others = @($changed | Where-Object { $versionPaths -cnotcontains $_ })
            if ($others.Count -gt 0) { return "it changes $(Some $others) as well" }
            $left = @($versionPaths | Where-Object { $changed -cnotcontains $_ })
            if ($left.Count -gt 0) { return "it leaves $(Some $left) as it was" }
            $was = Kind $before $props
            $is = Kind $after $props
            if ("$was" -cnotlike '100644 blob *' -or "$is" -cnotlike '100644 blob *') { return "$props is not a plain file on both sides" }
            $old = Lines $was
            $new = Lines $is
            if ($old.Count -ne $new.Count) { return "its change to $props adds or removes a line" }
            $moved = 0
            for ($line = 0; $line -lt $old.Count; $line++) {
              if ($old[$line] -ceq $new[$line]) { continue }
              if ($old[$line] -cnotmatch $prefixLine -or $new[$line] -cnotmatch $prefixLine) { return "its change to $props is not the VersionPrefix line alone" }
              $moved++
            }
            if ($moved -ne 1) { return "its change to $props does not move the VersionPrefix line" }
          }

          # The release's pull request is the one from a release branch into main; a release branch is any branch under
          # release/, as the ruleset that guards them reads it.
          $toRelease = $env:TARGET -clike 'release/*'
          $fromRelease = $env:BRANCH -clike 'release/*'

          # The paths a ready pull request into main that is not the release's, or a push to main with no record of its
          # tree, changes against its base, once they are read.
          $seen = $null

          try {
            if ($env:EVENT -eq 'pull_request' -and $env:DRAFT -eq 'true') {
              $set = 'linux'; $why = "a draft pull request's push runs the Linux set"
            } elseif ($env:EVENT -eq 'pull_request' -and $env:TARGET -cne 'main') {
              $set = 'linux'; $why = "a pull request into $($env:TARGET) runs the Linux set, which is all a release branch's ruleset requires"
            } elseif ($env:EVENT -eq 'pull_request' -and -not $fromRelease) {
              # What it changes against its base, read here so that what cannot be read only says so: such a pull request is
              # not taken for the version pull request, and runs the Linux set.
              $not = try {
                if (-not $env:BASE) { throw "the tree step did not list this pull request's base" }
                $before = Entries @(Get-Content -LiteralPath $env:BASE)
                $after = Entries @(Get-Content -LiteralPath $env:LISTING)
                $seen = Differing $before $after
                NotTheVersion $before $after $seen
              } catch { "what it changes against its base could not be read ($($_.Exception.Message))" }
              if (-not $not) {
                $set = 'version-only'; $why = "a pull request into main from $($env:BRANCH) that changes the version prefix's line and the pins the version guards hold to it, and nothing else, is the version pull request: its ready run is linux-x64 testing the critical tier, by rule"
              } else {
                $set = 'not-the-release'; $why = "a pull request into main from $($env:BRANCH) runs the Linux set: only the release's pull request, from a release branch, runs every check, and this is not the version pull request, since $not"
              }
            } elseif ($env:EVENT -eq 'pull_request' -and $env:ACTION -eq 'synchronize' -and $env:RECORD) {
              $others = NotDocumentation (Record)
              if ($others.Count -eq 0) { $set = 'documentation'; $why = "every path this push changes since $($env:FOUND) is documentation" }
              else { $set = 'everything'; $why = "this push changes $($others -join ', ') since $($env:FOUND)" }
            } elseif ($env:EVENT -eq 'pull_request' -and $env:ACTION -eq 'synchronize') {
              $set = 'everything'; $why = "a push to the release's pull request runs every check: $($env:FOUND)"
            } elseif ($env:EVENT -eq 'pull_request') {
              $set = 'everything'; $why = "the release's pull request, ready for review ($($env:ACTION)), runs every check"
            } elseif ($env:EVENT -eq 'push' -and $toRelease -and $env:RECORD) {
              $record = Record
              $tested = "$($record.tree)"
              if ($tested -and $tested -ceq $env:TREE) { $set = 'none'; $why = "$($env:FOUND), which is this commit's tree, and that run ran $(Ran $record)" }
              else { $set = 'linux'; $why = "$($env:FOUND), and this commit's tree is $($env:TREE)" }
            } elseif ($env:EVENT -eq 'push' -and $toRelease) {
              $set = 'linux'; $why = "a push to a release branch runs the Linux set: $($env:FOUND)"
            } elseif ($env:EVENT -eq 'push' -and $env:RECORD) {
              $record = Record
              $tested = "$($record.tree)"
              if ($tested -and $tested -ceq $env:TREE) { $set = 'tested'; $why = "$($env:FOUND), which is this commit's tree, and that run ran $(Ran $record)" }
              else { $set = 'everything'; $why = "$($env:FOUND), and this commit's tree is $($env:TREE)" }
            } elseif ($env:EVENT -eq 'push' -and $env:BASE) {
              # No run recorded this tree, so what the push's one commit changes against its parent decides: documentation
              # alone needs no leg, since the parent's tree is what main held before. A commit that changes nothing is a
              # push made to run the checks again, and runs them.
              $before = Entries @(Get-Content -LiteralPath $env:BASE)
              $after = Entries @(Get-Content -LiteralPath $env:LISTING)
              $seen = Differing $before $after
              $others = @($seen | Where-Object { -not (Documentation $_ @((Kind $before $_), (Kind $after $_))) })
              if ($seen.Count -gt 0 -and $others.Count -eq 0) {
                $set = 'tested'; $why = "every path this push changes against its parent is documentation: $(Some $seen); $($env:FOUND)"
              } elseif ($seen.Count -eq 0) {
                $set = 'everything'; $why = "a push to main runs every check: $($env:FOUND), and its commit changes nothing against its parent"
              } else {
                $set = 'everything'; $why = "a push to main runs every check: $($env:FOUND), and it changes $(Some $others) against its parent, which is not documentation"
              }
            } elseif ($env:EVENT -eq 'push') {
              $set = 'everything'; $why = "a push to main runs every check: $($env:FOUND), and what it changes against its parent was not listed"
            } else {
              $set = 'everything'; $why = 'a run started by hand runs every check'
            }
          } catch {
            $set = if ($env:EVENT -eq 'push' -and $toRelease) { 'linux' } else { 'everything' }
            $why = "what was found could not be read, so nothing is skipped ($($_.Exception.Message))"
          }
          $why = $why -replace '\s+', ' '

          # Every platform when every check runs, Linux alone on the Linux set and on the version pull request, none where
          # the tree was tested already.
          function Runs([string] $rid) {
            switch ($set) {
              'everything' { $true }
              'documentation' { $rid -eq 'linux-x64' }
              'not-the-release' { $rid -eq 'linux-x64' }
              'version-only' { $rid -eq 'linux-x64' }
              'linux' { $rid -eq 'linux-x64' }
              default { $false }
            }
          }

          # An update on every platform that runs, but on the version pull request, which builds and tests alone.
          function Updates([string] $rid) { $set -ne 'version-only' -and (Runs $rid) }

          $platforms = @($env:PLATFORMS | ConvertFrom-Json)
          $updates = @($env:UPDATES | ConvertFrom-Json)
          $kept = @($platforms | Where-Object { Runs $_.rid })
          $keptUpdates = @($updates | Where-Object { Updates $_.rid })

          # What a ready pull request into main or a push to main does not run reports as skipped by rule, under the
          # check's own name, which is the platform's for a platform leg and the update job's for an update. Nothing
          # else does: nothing waits on a draft, and a release branch's ruleset requires only the Linux set.
          $skipped = @()
          if ($set -in 'documentation', 'not-the-release', 'version-only', 'tested') {
            $skipped = @($platforms | Where-Object { -not (Runs $_.rid) } | ForEach-Object { @{ check = $_.rid; why = $why } }) +
              @($updates | Where-Object { -not (Updates $_.rid) } | ForEach-Object { @{ check = "an update on $($_.rid)"; why = $why } })
          }

          # A draft's push tests the critical tier alone, the tests that go red first when a rule the product rests on
          # breaks, and so do a pull request into a release branch and the version pull request when they are ready: for
          # them the tier is the ready run, by rule. The whole suite's run per release is the release's pull request's,
          # and a change under dotnet/ ran the whole suite locally before it was marked ready. Every other run tests the
          # whole suite.
          $draft = $env:EVENT -eq 'pull_request' -and $env:DRAFT -eq 'true'
          $tier = $draft -or $set -eq 'version-only' -or ($env:EVENT -eq 'pull_request' -and $toRelease)

          # A draft's leg is not named as the leg a ruleset requires: a required check is judged by the latest check of its
          # name on the commit, and a draft's tier must not stand in for the ready run in the moments before that run
          # creates its own. A ready leg is, the tier's included where the tier is the ready run.
          $kept = @($kept | ForEach-Object { @{ rid = $_.rid; os = $_.os; name = $(if ($draft) { "$($_.rid) (critical tier)" } else { $_.rid }) } })

          function Word([bool] $yes) { if ($yes) { 'true' } else { 'false' } }
          "set=$set" >> $env:GITHUB_OUTPUT
          "full=$(Word ($set -eq 'everything'))" >> $env:GITHUB_OUTPUT
          "build=$(Word ($set -notin 'tested', 'none'))" >> $env:GITHUB_OUTPUT
          "linux=$(Word ($set -notin 'tested', 'none', 'version-only'))" >> $env:GITHUB_OUTPUT
          "macos=$(Word ($set -eq 'everything'))" >> $env:GITHUB_OUTPUT
          "tier=$(Word $tier)" >> $env:GITHUB_OUTPUT
          "platforms=$(@{ include = $kept } | ConvertTo-Json -Compress -Depth 3)" >> $env:GITHUB_OUTPUT
          "updates=$(@{ include = $keptUpdates } | ConvertTo-Json -Compress -Depth 3)" >> $env:GITHUB_OUTPUT
          "rids=$(@($kept | ForEach-Object { $_.rid }) -join ',')" >> $env:GITHUB_OUTPUT
          "skipping=$(Word ($skipped.Count -gt 0))" >> $env:GITHUB_OUTPUT
          "skipped=$(@{ include = $skipped } | ConvertTo-Json -Compress -Depth 3)" >> $env:GITHUB_OUTPUT

          # Every ready run of a pull request into main or a release branch keeps a record of the tree it tested, of the set
          # it ran and of the ref it ran on, for the runs after it: the release's run of every check, for a push after it
          # that changes documentation only and for the push to main its merge makes; a run of the Linux set into a release
          # branch, for the push to the release branch its merge makes; and the run of any other pull request into main, the
          # version pull request's among them, for the push to main its squash makes. So does a push to main that runs every
          # check, for a release branch that takes main as it is. A draft's run keeps none, and neither does a push to the
          # release's pull request that changes documentation only: the push after it compares with the tree that pull
          # request's last run of every check tested.
          $recorded = ''
          if (($env:EVENT -eq 'pull_request' -and $env:DRAFT -eq 'false' -and
                ($set -in 'everything', 'not-the-release', 'version-only' -or ($set -eq 'linux' -and $toRelease))) -or
              ($env:EVENT -eq 'push' -and -not $toRelease -and $set -eq 'everything')) {
            $recorded = Join-Path $env:RUNNER_TEMP 'tested-tree'
            New-Item -ItemType Directory -Force -Path $recorded | Out-Null
            $number = if ($env:PULL_REQUEST) { [int] $env:PULL_REQUEST } else { $null }
            [ordered] @{ tree = $env:TREE; commit = $env:SHA; ref = $env:REF; pull_request = $number; checks = $set; listing = @(Get-Content -LiteralPath $env:LISTING) } |
              ConvertTo-Json -Compress -Depth 3 | Set-Content -LiteralPath (Join-Path $recorded 'record.json')
          }
          "record=$recorded" >> $env:GITHUB_OUTPUT

          # Which case this run took, and why, in its log and on its summary page, with the paths a pull request into main
          # that is not the release's, or a push to main whose tree no run recorded, changes against its base.
          $legs = "platforms -> $(@($kept | ForEach-Object { $_.rid }) -join ', '); tests -> $(if ($tier) { 'the critical tier' } elseif ($set -in 'tested', 'none') { 'none' } else { 'the whole suite' }); updates -> $(@($keptUpdates | ForEach-Object { $_.rid }) -join ', '); skipped by rule -> $(@($skipped | ForEach-Object { $_.check }) -join ', ')"
          $saw = @(if ($null -ne $seen) { "changed against the base -> $(Some $seen)" })
          Write-Host "set -> ${set}; $why"
          Write-Host $legs
          $saw | ForEach-Object { Write-Host $_ }
          if ($env:GITHUB_STEP_SUMMARY) {
            @('### Which checks this run needs', '', "**$set**: $why", '', $legs) + @($saw | ForEach-Object { '', $_ }) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      # The record, kept fourteen days under the name of the tree it tested: as long as a pull request may wait for its
      # merge. A record that has gone skips nothing.
      - name: Keep the record of the tree this run tested
        if: steps.legs.outputs.record != ''
        uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ steps.legs.outputs.record }}
          retention-days: 14
          if-no-files-found: error

  # A pull request is stamped with -dev after the version and a release with the bare version, and a test can pass
  # under one and fail under the other: three update tests once advertised the release this tree was on its way to
  # as the newer one, which a -dev build is older than and the release is not, so every pull request passed and the
  # release's own test step failed. So the whole suite runs once more, here, stamped as a release of this tree would
  # be. One Linux runner is enough to catch a test tied to a number; every other job keeps the -dev version.
  release-stamp:
    name: The suite under a release's version
    needs: version
    if: needs.version.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Its token reads the repository for the checkout, and nothing more.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.version.outputs.sdk }}

      - name: Restore
        run: dotnet restore dotnet/Jason.slnx

      - name: Build (warnings are errors)
        run: dotnet build dotnet/Jason.slnx --configuration Release --no-restore -p:Version=${{ needs.version.outputs.release }}

      # The tests below prove nothing about a release's version unless the build carries it, so it is read back out
      # of what was built: the assembly the build reports its version from.
      - name: The build carries a release's version
        shell: pwsh
        env:
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          $stamped = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path dotnet/src/Jason.Contracts/bin/Release/net10.0/Jason.Contracts.dll)).ProductVersion
          if (($stamped -split '\+')[0] -ne $env:RELEASE) { throw "the build is stamped '$stamped', and a release of this tree would carry $env:RELEASE" }
          Write-Host "stamped $stamped"

      - name: Test (offline)
        run: dotnet test --solution dotnet/Jason.slnx --configuration Release --no-build -p:Version=${{ needs.version.outputs.release }}

  build-test-publish:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    # Its token reads the repository for the checkout, and nothing more.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # linux-x64, win-x64 and osx-arm64 when every check runs; linux-x64 alone on the Linux set and on the version pull
      # request.
      matrix: ${{ fromJSON(needs.version.outputs.platforms) }}
    steps:
      # The whole history and its tags: the journal's kind documents are compared with the last published release's,
      # read from its tag, and a test that finds no tag under CI fails rather than skip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.version.outputs.sdk }}

      - name: Restore
        run: dotnet restore dotnet/Jason.slnx

      - name: Build (warnings are errors)
        run: dotnet build dotnet/Jason.slnx --configuration Release --no-restore -p:Version=${{ needs.version.outputs.version }}

      # Whether the SDK writes the application manifest into a Windows executable built on another host has not
      # been measured, so the project refuses to build one anywhere but Windows. The target is asked for by name
      # and nothing is restored, so this reaches no network: on Windows it must let a win-x64 build through, and
      # on Linux and macOS refuse it.
      - name: A Windows executable is built on Windows or not at all
        shell: pwsh
        run: |
          $said = dotnet msbuild dotnet/src/Jason.App/Jason.App.csproj -t:RefuseWindowsExecutableElsewhere -p:RuntimeIdentifier=win-x64 -nologo -nodeReuse:false 2>&1 | Out-String
          $refused = $LASTEXITCODE -ne 0
          if ($refused -eq $IsWindows) { throw "on this host a win-x64 build should have been $(if ($IsWindows) { 'let through' } else { 'refused' }): $said" }
          if ($refused -and $said -notmatch 'consoleAllocationPolicy') { throw "it was refused for another reason: $said" }
          Write-Host "win-x64 on this host: $(if ($refused) { 'refused' } else { 'let through' })"
          # A pwsh step ends with the last native command's exit code, which here is the refusal's own.
          exit 0

      # A draft's push, a pull request into a release branch and the version pull request test the critical tier alone, a
      # few minutes where the whole suite takes many; every other run tests the whole suite, the same build under the
      # same version.
      - name: Test (offline)
        if: needs.version.outputs.tier != 'true'
        run: dotnet test --solution dotnet/Jason.slnx --configuration Release --no-build -p:Version=${{ needs.version.outputs.version }}

      - name: Test the critical tier (offline)
        if: needs.version.outputs.tier == 'true'
        run: dotnet test --solution dotnet/Jason.slnx --configuration Release --no-build -p:Version=${{ needs.version.outputs.version }} -- --filter-trait "Category=Critical"

      # The publish, the archive, the checksum and the manifest fragment: the same action release.yml runs on
      # a tag, so the packaging is exercised on every pull request long before a tag exists.
      - name: Package
        id: package
        uses: ./.github/actions/package
        with:
          rid: ${{ matrix.rid }}
          version: ${{ needs.version.outputs.version }}
          # For the jobs of this run and a person looking at a failure; a release keeps its own.
          retention-days: 3

      - name: Smoke-test the published executable
        shell: pwsh
        env:
          JASON_Update__CheckEnabled: 'false'
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $exe = $env:EXECUTABLE
          $env:JASON_DATA_DIR = Join-Path ([IO.Path]::GetTempPath()) "jason-ci-smoke"

          $elapsed = Measure-Command { & $exe --version | Tee-Object -Variable version }
          if ($LASTEXITCODE -ne 0) { throw "jason --version exited with $LASTEXITCODE" }
          Write-Host "jason --version -> $version ($([int]$elapsed.TotalMilliseconds) ms cold start)"

          # What it prints is the stamped version plus build metadata (+<commit>), which SemVer says to ignore.
          if (($version -split '\+')[0] -ne $env:VERSION) { throw "jason --version says '$version', and this build was stamped $env:VERSION" }

          $elapsed = Measure-Command { & $exe runtime status | Tee-Object -Variable status }
          $statusExit = $LASTEXITCODE
          Write-Host "jason runtime status -> exit $statusExit in $([int]$elapsed.TotalMilliseconds) ms: $status"
          if ($statusExit -ne 3) { throw "expected exit code 3 without a running runtime, got $statusExit" }
          if ($status -notmatch '"code":"no_descriptor"') { throw "expected a no_descriptor error envelope" }

          # And it opens the database. Everything above passes on a build that cannot: a single-file publish
          # leaves SQLite's native library beside the executable unless it is told to bundle it, `--version`
          # and a status with no runtime never touch it, and the archive carries the executable alone — so the
          # one build this whole wave exists to deliver would have gone out green. Starting the runtime is what
          # loads it.
          & $exe runtime start | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime start exited with $LASTEXITCODE; the published executable cannot open its database" }

          & $exe runtime status | Tee-Object -Variable running | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime status exited with $LASTEXITCODE while a runtime was running" }
          if ($running -notmatch '"applied_migrations":\["') { throw "runtime status reported no applied migrations: $running" }
          Write-Host "the runtime started, migrated and answered"

          & $exe runtime stop | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime stop exited with $LASTEXITCODE" }

          # The last command of this step is expected to exit 3, and pwsh would hand that on as the step's
          # own exit code. Everything asserted above passed, so the step succeeded.
          exit 0

      # The published executable's own uninstall, run from the file it removes, with no runtime running: the one
      # shape the test suite cannot reach, because the suite runs as a test host and not as a single-file build.
      # Such a build reads each assembly it has not loaded yet out of its own file, by the path it started from;
      # once the verb has moved or deleted that file, the first new assembly fails to load. A published build
      # once removed everything and then answered with one line about a type initializer, because its report was
      # the first JSON it wrote. A copy is uninstalled, so the executable this job packaged stays where it is.
      - name: Uninstall the published executable, from its own image
        shell: pwsh
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
        run: |
          $scratch = Join-Path ([IO.Path]::GetTempPath()) "jason-ci-uninstall"
          $install = Join-Path $scratch 'install'
          $env:JASON_DATA_DIR = Join-Path $scratch 'data'
          New-Item -ItemType Directory -Force $install, $env:JASON_DATA_DIR | Out-Null
          $exe = Join-Path $install (Split-Path $env:EXECUTABLE -Leaf)
          Copy-Item $env:EXECUTABLE $exe
          # And the two notice files an install keeps beside it, which the uninstall takes with it, by name.
          $notices = @('jason-LICENSE', 'jason-THIRD-PARTY-NOTICES') | ForEach-Object { Join-Path $install $_ }
          Copy-Item LICENSE $notices[0]
          Copy-Item THIRD-PARTY-NOTICES $notices[1]
          # Two things Jason keeps in a data directory, and one somebody else put there.
          New-Item -ItemType Directory -Force (Join-Path $env:JASON_DATA_DIR 'config'), (Join-Path $env:JASON_DATA_DIR 'logs') | Out-Null
          Set-Content (Join-Path $env:JASON_DATA_DIR 'config/settings.json') '{}'
          Set-Content (Join-Path $env:JASON_DATA_DIR 'logs/jason.log') '{}'
          Set-Content (Join-Path $env:JASON_DATA_DIR 'marker.txt') 'the operator''s own work'

          # macOS resolves the temporary directory through /private, and the executable's own path comes back
          # resolved; the two name one file.
          function Same([string] $a, [string] $b) { ($a -replace '^/private', '') -eq ($b -replace '^/private', '') }

          $plan = (& $exe uninstall --dry-run | Out-String | ConvertFrom-Json).plan
          if ($LASTEXITCODE -ne 0) { throw "the dry run exited $LASTEXITCODE" }
          if (-not (Same $plan.executable $exe)) { throw "the plan names '$($plan.executable)', not the file it runs as ('$exe')" }
          if (@($plan.notices).Count -ne 2) { throw "the plan names $(@($plan.notices).Count) notice files, not the two beside the executable: $($plan.notices -join ', ')" }
          # The logon registration and the agent harnesses are this account's, not this scratch data directory's,
          # so the uninstall below would take them too. On a fresh runner there are none; anywhere else - a
          # developer rehearsing this step on their own machine - it refuses before anything is removed.
          if ($plan.autostart_registered -or @($plan.roots).Count -gt 0 -or $plan.path_entry.ours) {
              throw "this account has a logon registration, recorded skills or a PATH entry of its own; this step uninstalls a scratch copy only, and refuses here"
          }
          Write-Host "unpacked libraries: $($plan.extracted_libraries)"
          Write-Host "other builds' unpacked libraries: $(@($plan.other_extracted_libraries) -join ', ')"

          $said = & $exe uninstall --purge-data --yes 2>&1
          $exit = $LASTEXITCODE
          Write-Host ($said -join "`n")
          if ($exit -ne 0) { throw "jason uninstall exited $exit" }
          $report = ($said | Where-Object { $_ -is [string] -and $_.StartsWith('{') }) | ConvertFrom-Json
          if (-not $report.completed) { throw "the report says it did not complete" }
          foreach ($gone in @($exe) + $notices + @($install)) { if (Test-Path -LiteralPath $gone) { throw "'$gone' is still there" } }

          # The purge takes what Jason keeps in the data directory and keeps, byte for byte, what somebody else put
          # there - so the directory stays, holding the operator's file and nothing else, and the report names it.
          $left = @(Get-ChildItem -LiteralPath $env:JASON_DATA_DIR -Force | ForEach-Object Name)
          if (($left -join ',') -ne 'marker.txt') { throw "after the purge the data directory holds '$($left -join ', ')'; only the operator's marker.txt should be left" }
          if ((Get-Content (Join-Path $env:JASON_DATA_DIR 'marker.txt') -Raw).Trim() -ne "the operator's own work") { throw "the operator's marker was changed" }
          if (($report.kept -join ' ') -notmatch 'marker\.txt') { throw "the report does not name the file it kept: $($report.kept -join ' | ')" }
          if ($plan.extracted_libraries -and (Test-Path -LiteralPath $plan.extracted_libraries)) { throw "what the build unpacked is still at '$($plan.extracted_libraries)'" }
          # Every other build's goes too; one a running copy holds stays, and the report says so by its path.
          foreach ($other in @($plan.other_extracted_libraries | Where-Object { $_ })) {
              if ((Test-Path -LiteralPath $other) -and -not (($report.kept -join ' ').Contains($other))) { throw "what another build unpacked is still at '$other', and the report does not say why" }
          }

          # On Windows the running image is moved aside rather than deleted, and a cleanup removes the copy
          # once the verb has exited. The report names the cleanup's process and the directory. The cleanup is a
          # Windows PowerShell 5.1 child that waits for the verb and then tries 40 times, 250 ms apart: about ten
          # seconds, counted from when it has started rather than from the verb's exit. So this waits for the
          # cleanup itself, up to 60 seconds - six times its own retries, which only a cleanup that hangs reaches -
          # and then looks for the copy.
          if ($IsWindows) {
            $cleanup = [regex]::Match(($report.kept -join ' '), "a cleanup, process (\d+), removes '([^']+)'")
            if (-not $cleanup.Success) { throw "the report names no cleanup process: $($report.kept -join ' | ')" }
            $cleanupId = [int]$cleanup.Groups[1].Value
            $aside = $cleanup.Groups[2].Value
            # A cleanup that has already ended is not waited for, and neither is a program that took its id since.
            $process = Get-Process -Id $cleanupId -ErrorAction SilentlyContinue | Where-Object ProcessName -eq 'powershell'
            if ($process -and -not $process.WaitForExit(60000)) {
              throw "the cleanup, process $cleanupId, was still running 60 s after the verb exited; its own retries end about ten seconds after it starts"
            }
            if (Test-Path -LiteralPath $aside) { throw "the cleanup, process $cleanupId, ended and left the moved copy at '$aside'" }
          }

          Write-Host "the published executable took itself off this runner and left nothing of its own behind"

  # The manifest declares consoleAllocationPolicy, which Windows 11 24H2 (build 26100) introduced. A loader that
  # rejected a manifest carrying a setting it does not know would not start jason.exe at all, and every other Windows
  # job here runs on 26100 or later. windows-2022 is build 20348: it starts the executable the build packaged.
  older-windows:
    name: jason.exe on a Windows older than 24H2
    needs: [version, build-test-publish]
    if: needs.version.outputs.full == 'true'
    runs-on: windows-2022
    # It checks nothing out, and an artifact of its own run needs no token: its token can do nothing.
    permissions: {}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: jason-win-x64
          path: artifact

      - name: Start the packaged executable on a loader that predates its manifest's setting
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # Nothing here reaches the network: the runtime is told not to ask the release feed, rather than stopped
          # before its first check would have come due.
          JASON_Update__CheckEnabled: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $build = [Environment]::OSVersion.Version.Build
          if ($build -ge 26100) { throw "this runner is build $build, which reads consoleAllocationPolicy: the check needs an older Windows" }

          Expand-Archive -Path artifact/jason-win-x64.zip -DestinationPath jason
          $exe = Join-Path $PWD 'jason\jason.exe'

          $said = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "jason.exe --version exited $LASTEXITCODE on build $build" }
          if (($said -split '\+')[0] -ne $env:VERSION) { throw "jason.exe --version said '$said', expected $env:VERSION" }

          # And a runtime, which is what a logon task starts: detached, on a data directory of its own, on loopback only.
          $env:JASON_DATA_DIR = Join-Path $env:RUNNER_TEMP 'older-windows-data'
          & $exe runtime start | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason.exe could not start a runtime on build $build ($LASTEXITCODE)" }
          # One string, so the match is a yes or a no even if the answer ever spans lines.
          $running = & $exe runtime status | Out-String
          if ($LASTEXITCODE -ne 0 -or $running -notmatch '"applied_migrations":\["') { throw "the runtime on build $build did not migrate: $running" }
          & $exe runtime stop | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason.exe could not stop its runtime on build $build ($LASTEXITCODE)" }

          # runtime start hands the runtime a console with no window, which a Windows that ignores the setting hands it
          # too, and the detached runtime lets go of it: freed_hidden, as on 26100. One start, so exactly one such line.
          $console = @(Get-Content (Join-Path $env:JASON_DATA_DIR 'logs\*.jsonl') | Where-Object { $_ -like '*"@mt":"Console at start: {Console}"*' })
          if ($console.Count -ne 1) { throw "the runtime on build $build wrote $($console.Count) console lines, not one: $($console -join ' | ')" }
          if ($console[0] -notmatch '"Console":"freed_hidden"') { throw "the runtime on build $build did not say freed_hidden: $($console[0])" }
          "build ${build}: $said; the runtime's console line: $($console[0])"
          exit 0

  update-end-to-end:
    name: an update on ${{ matrix.rid }}
    # It waits for the ui job, whose package it serves, and so for that job's smoke as well: the update's last step
    # places the UI, and a package from a job that failed proves nothing about an update. Building the UI here instead
    # would put npm on both platforms of this job for a zip the ui job has already built and tested.
    needs: [version, build-test-publish, ui]
    if: needs.version.outputs.linux == 'true'
    runs-on: ${{ matrix.os }}
    # Its token reads the repository for the checkout, and nothing more.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # linux-x64 and win-x64 when every check runs; linux-x64 alone on the Linux set.
      matrix: ${{ fromJSON(needs.version.outputs.updates) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.version.outputs.sdk }}

      # The version this tree carries, as the platform job already published it. Taking the artifact rather
      # than publishing it again is one whole publish saved per platform, and it is the same bytes a person
      # would have installed.
      - uses: actions/download-artifact@v7
        with:
          name: jason-${{ matrix.rid }}
          path: installed

      - name: Decide the version this update installs
        id: next
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          # Two versions, or this job proves nothing: with the same build on both sides a completed swap and an
          # applier that did nothing look identical to --version, and the health check passes either way.
          $numbers = (($env:VERSION -split '\+')[0] -split '-')[0] -split '\.'
          "next=$($numbers[0]).$($numbers[1]).$([int]$numbers[2] + 1)" >> $env:GITHUB_OUTPUT

          # And built on another .NET runtime than the installed one, on purpose and every run. The executable is a
          # single file that reads the .NET libraries inside it as it first needs them, and the apply below runs
          # from the file it replaces. Built on one runtime, the two files keep every library at the same offset, so an
          # apply that read one out of the new file after the swap found the right bytes there and passed; a release
          # built on another runtime than the installation it updated failed on Linux, at the start of its runtime. A
          # runtime one patch below the installed one moves those offsets. The installed runtime is read out of the
          # file, because running the installed executable before the update would open the database it must leave
          # alone, which is also why its runtime stays stopped until the update below.
          $peek = Join-Path $env:RUNNER_TEMP 'installed-runtime'
          New-Item -ItemType Directory -Force $peek | Out-Null
          if ($env:RID -like 'win-*') {
            Expand-Archive -Path "installed/jason-$env:RID.zip" -DestinationPath $peek -Force
            $exe = Join-Path $peek 'jason.exe'
          } else {
            tar -xzf "installed/jason-$env:RID.tar.gz" -C $peek
            $exe = Join-Path $peek 'jason'
          }
          $installed = ./.github/scripts/Read-RuntimePack.ps1 -Executable $exe
          $runtime = $installed -split '\.'
          $patch = [int]$runtime[2]
          $other = "$($runtime[0]).$($runtime[1]).$(if ($patch -gt 0) { $patch - 1 } else { $patch + 1 })"
          "installed-runtime=$installed" >> $env:GITHUB_OUTPUT
          "runtime=$other" >> $env:GITHUB_OUTPUT
          Write-Host "the installed version runs on .NET $installed; the version it updates to is built on .NET $other"

      # Packaged by the action a release packages with, so what this job installs is an archive of the same
      # shape, with the same licence in it and the same digest written beside it. Only the artifact's name
      # differs: two uploads in one run cannot share one. And it does not begin with `jason-`: the install
      # jobs download `jason-*` and merge what they get into one directory, so an upload named like the
      # platform ones that landed before their download put this version's archive over the real one — the
      # file names inside are the same — beside the other artifact's fragment, and the feed refused itself.
      - name: Package the next version
        id: package
        uses: ./.github/actions/package
        with:
          rid: ${{ matrix.rid }}
          version: ${{ steps.next.outputs.next }}
          runtime-version: ${{ steps.next.outputs.runtime }}
          artifact: next-jason-${{ matrix.rid }}
          retention-days: 3

      - name: Hold the two sides to two .NET runtimes
        shell: pwsh
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          INSTALLED: ${{ steps.next.outputs.installed-runtime }}
          RUNTIME: ${{ steps.next.outputs.runtime }}
        run: |
          # Read out of the file the update will install, so that a publish which quietly kept the SDK's own runtime
          # stops the job here, rather than leaving it to pass on two files that differ only in their version.
          $next = ./.github/scripts/Read-RuntimePack.ps1 -Executable $env:EXECUTABLE
          if ($next -ne $env:RUNTIME) { throw "the next version was built on .NET $next, and this job asked for $env:RUNTIME" }
          if ($next -eq $env:INSTALLED) { throw "both sides of this update are built on .NET $next" }
          Write-Host "installed on .NET $env:INSTALLED, updating to a build on .NET $next"

      # The UI's package as the ui job built it from this tree, so the update's last step has a release's UI to place.
      - uses: actions/download-artifact@v7
        with:
          name: jason-ui
          path: ui-package

      - name: Serve that version from a feed on this machine
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          New-Item -ItemType Directory -Force feed | Out-Null
          Copy-Item artifacts/release/* feed -Force

          # The UI's package beside it, stamped with the version this feed offers. A release builds its own at the tag,
          # and that stamp is the one thing its build would write differently; rewriting it here keeps npm out of a job
          # that has no Node, where the ui job has already built and tested the same tree.
          Copy-Item ui-package/jason-ui.zip feed/jason-ui.zip
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open((Resolve-Path feed/jason-ui.zip).Path, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $entry = $zip.GetEntry('manifest.json')
            $reader = [System.IO.StreamReader]::new($entry.Open())
            $manifest = $reader.ReadToEnd() | ConvertFrom-Json
            $reader.Dispose()
            $entry.Delete()
            $manifest.version = $env:NEXT
            $writer = [System.IO.StreamWriter]::new($zip.CreateEntry('manifest.json').Open())
            $writer.Write(($manifest | ConvertTo-Json -Compress) + "`n")
            $writer.Dispose()
          }
          finally {
            $zip.Dispose()
          }

          ./.github/scripts/Write-Manifest.ps1 -Version $env:NEXT -Directory feed -Require $env:RID -Plugins jason-ui.zip
          Get-Content feed/manifest.json

          # Served from this machine and nowhere else: 127.0.0.1, for the length of this job. UpdateFeed takes
          # https or loopback http and refuses a directory, so a feed has to be served rather than pointed at.
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          $server = Start-Process $python -ArgumentList '-m', 'http.server', '8099', '--bind', '127.0.0.1', '--directory', 'feed' -PassThru
          "server=$($server.Id)" >> $env:GITHUB_ENV
          $ready = $false
          for ($try = 0; $try -lt 50; $try++) {
            try { Invoke-WebRequest -Uri http://127.0.0.1:8099/manifest.json -UseBasicParsing | Out-Null; $ready = $true; break }
            catch { Start-Sleep -Milliseconds 200 }
          }

          # Said here, where it is known, rather than three steps later as an update that could not reach its
          # feed: that failure reads like the update's and it is not.
          if (-not $ready) { throw "the feed on 127.0.0.1:8099 never answered within 10 s" }

      - name: Install the version this tree carries, and leave its runtime stopped
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $exe = if ($env:RID -like 'win-*') { 'jason.exe' } else { 'jason' }
          $asset = if ($env:RID -like 'win-*') { "jason-$env:RID.zip" } else { "jason-$env:RID.tar.gz" }
          New-Item -ItemType Directory -Force install | Out-Null
          if ($env:RID -like 'win-*') {
            Expand-Archive -Path "installed/$asset" -DestinationPath install -Force
          } else {
            tar -xzf "installed/$asset" -C install
            chmod +x "install/$exe"
          }

          # Laid out as the install scripts lay it out: the archive's notices beside the executable, under the names
          # they are kept as there, so the update below has an installation's notices to keep and to replace.
          foreach ($notice in 'LICENSE', 'THIRD-PARTY-NOTICES') {
            Move-Item -LiteralPath "install/$notice" -Destination "install/jason-$notice"
          }

          # Deliberately not asked what version it is: that would be an executable checked without opening a
          # database, and this runtime must stay stopped until the update, or it migrates the prepared database
          # itself and the new version has nothing to back up. What was installed is asserted from the update's
          # own report below, which comes from the program rather than from a second invocation of it.
          "install=$(Resolve-Path "install/$exe")" >> $env:GITHUB_ENV

      - name: Prepare a database one migration behind
        shell: pwsh
        run: |
          # EF's own migrator, not a checked-in file: the triggers and the indexes live in the migrations, so
          # this is a real older database rather than something shaped like one. The connection is given, or
          # the design-time factory writes design-time.db into the working directory and the runtime opens a
          # database nobody prepared.
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool restore exited with $LASTEXITCODE" }

          $migrations = dotnet ef migrations list --project dotnet/src/Jason.Runtime --startup-project dotnet/src/Jason.Runtime --no-connect `
            | Where-Object { $_ -match '^\d{14}_' }
          $previous = ($migrations | Select-Object -Last 2 | Select-Object -First 1).Trim()
          if (-not $previous) { throw "no migration to stop at; got: $migrations" }

          $data = Join-Path $env:RUNNER_TEMP 'update-data'
          New-Item -ItemType Directory -Force (Join-Path $data 'state') | Out-Null
          $database = Join-Path $data 'state/jason.db'
          dotnet ef database update $previous --project dotnet/src/Jason.Runtime --startup-project dotnet/src/Jason.Runtime --connection "Data Source=$database"
          if ($LASTEXITCODE -ne 0) { throw "preparing the older database exited with $LASTEXITCODE" }

          "JASON_DATA_DIR=$data" >> $env:GITHUB_ENV
          "stopped_at=$previous" >> $env:GITHUB_ENV
          Write-Host "prepared a database at $previous"

      - name: Update it, and assert every stage
        shell: pwsh
        env:
          NEXT: ${{ steps.next.outputs.next }}
          VERSION: ${{ needs.version.outputs.version }}
          JASON_Update__CheckEnabled: 'false'
        run: |
          # What the swap has to move, measured before it happens: an update that copied instead of renaming,
          # or did nothing at all, cannot produce these three afterwards.
          $before = (Get-FileHash $env:install -Algorithm SHA256).Hash

          $out = & $env:install update apply --feed http://127.0.0.1:8099/manifest.json --drain-seconds 0
          if ($LASTEXITCODE -ne 0) { throw "jason update apply exited with $LASTEXITCODE`n$out" }
          Write-Host $out

          $applied = $out | ConvertFrom-Json
          if (($applied.from -split '\+')[0] -ne $env:VERSION) { throw "the update ran against $($applied.from), and this job installed $env:VERSION" }
          if ($applied.to -ne $env:NEXT) { throw "the update says it installed $($applied.to), and the feed offered $env:NEXT" }
          foreach ($step in 'staged', 'drained', 'stopped', 'kept', 'swapped', 'started', 'healthy') {
            if (-not ($applied.steps | Where-Object { $_ -like "$step*" })) { throw "the update never said '$step': $($applied.steps -join '; ')" }
          }

          # Its last step placed the UI the feed offered, from the package the ui job built, through the same installer
          # `jason ui install` runs.
          if (-not ($applied.steps -contains "ui: placed $env:NEXT")) { throw "the update did not place the UI the feed offered: $($applied.steps -join '; ')" }

          # What version is installed is asked of the runtime that is now serving rather than of the file, for
          # the reason the applier's own health check does it that way: a file that prints a version proves a
          # file exists, and what matters is which build is running. That assertion is in the step below.
          $update = Join-Path $env:JASON_DATA_DIR 'update'
          $kept = Join-Path $update "previous/$(Split-Path $env:install -Leaf)"
          if ((Get-FileHash $kept -Algorithm SHA256).Hash -ne $before) {
            throw "what was kept is not the executable that was installed before the update"
          }
          if (Get-ChildItem -Path (Join-Path $update 'staged') -File -Recurse -ErrorAction SilentlyContinue) {
            throw "the staged executable is still staged, so what was installed is a copy of it rather than the file itself"
          }

          # The notices travel with the executable: the installed ones were kept with it, and the release's are beside
          # the new one, from its archive, whose LICENSE is this tree's LICENSE.
          $directory = Split-Path $env:install -Parent
          $notices = @{ 'jason-LICENSE' = 'LICENSE'; 'jason-THIRD-PARTY-NOTICES' = 'THIRD-PARTY-NOTICES' }
          foreach ($name in $notices.Keys) {
            if (-not (Test-Path -LiteralPath (Join-Path $update "previous/$name"))) { throw "$name was not kept with the executable it belonged to" }
            if ((Get-FileHash (Join-Path $directory $name)).Hash -ne (Get-FileHash $notices[$name]).Hash) { throw "$name beside the new executable is not its archive's" }
          }

      - name: The new version migrated the database it inherited
        shell: pwsh
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          # The half of the acceptance criterion the applier cannot fake: the database this update inherited was
          # one migration behind, so the new version's first start had to back it up and migrate it.
          $status = & $env:install runtime status | ConvertFrom-Json
          if (($status.runtime_version -split '\+')[0] -ne $env:NEXT) { throw "the runtime serving after the update says it is $($status.runtime_version), and this job installed $env:NEXT" }
          if (-not $status.database.newly_applied) { throw "the new version's first start applied no migrations: $($status | ConvertTo-Json -Depth 5)" }
          if (-not $status.database.backup_file) { throw "the new version migrated and wrote no backup" }
          if (-not (Test-Path $status.database.backup_file)) { throw "the backup it named is not there: $($status.database.backup_file)" }
          Write-Host "migrated $($status.database.newly_applied -join ', ') and kept $($status.database.backup_file)"

          # And the runtime serves the UI the update placed: status reads it from the runtime, not from the files.
          $ui = (& $env:install status | ConvertFrom-Json).checks | Where-Object { $_.name -eq 'ui_module' }
          if ($ui.state -ne 'ok' -or $ui.fact -notlike "Serving default $env:NEXT from *") { throw "status says of the UI: $($ui | ConvertTo-Json)" }

          $ledger = Get-Content (Join-Path $env:JASON_DATA_DIR 'update/ledger.json') | ConvertFrom-Json
          if ($ledger.step -ne 'complete') { throw "the ledger says '$($ledger.step)'" }
          if (-not $ledger.newly_applied) { throw "the ledger did not record what the first start applied" }

          # The runtime is deliberately left running: an update leaves one running, and the rollback below has
          # to be able to ask it whether any work has been recorded since. Stopping it here for tidiness would
          # make the next step assert a refusal instead of a rollback.

          # Remembered for the rollback below, which has to tell the backup this update took from the one the
          # restored version will take when it finds the database a migration behind again.
          "backup=$($status.database.backup_file)" >> $env:GITHUB_ENV

          # `jason status` above exits 1 in this job, which never makes its installation ready (no role skills, no PATH
          # entry), and pwsh would hand that on as the step's exit code. Everything asserted above passed.
          exit 0

      - name: Roll it back, from the executable a person would type
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          JASON_Update__CheckEnabled: 'false'
        run: |
          # The case no unit test in this repository can reach. `jason update rollback` typed from the PATH runs
          # the executable the update installed, so the file the rollback has to replace is the process doing the
          # replacing - and a running image can be renamed but not written over. A fake installation is a file
          # and not a process, so only a machine can prove this one.
          $out = & $env:install update rollback
          if ($LASTEXITCODE -ne 0) { throw "jason update rollback exited with $LASTEXITCODE`n$out" }
          Write-Host $out

          $back = $out | ConvertFrom-Json
          if (($back.to -split '\+')[0] -ne $env:VERSION) { throw "the rollback says it put $($back.to) back, and this job installed $env:VERSION" }

          $status = & $env:install runtime status | ConvertFrom-Json
          if (($status.runtime_version -split '\+')[0] -ne $env:VERSION) { throw "after the rollback the runtime serving says it is $($status.runtime_version)" }

          # What was kept has been consumed, the notices with the executable, and they are beside it again.
          $update = Join-Path $env:JASON_DATA_DIR 'update'
          if (Get-ChildItem -Path (Join-Path $update 'previous') -File -ErrorAction SilentlyContinue) {
            throw "previous/ still holds a file, so the rollback copied rather than moved what was kept"
          }
          foreach ($name in 'jason-LICENSE', 'jason-THIRD-PARTY-NOTICES') {
            if (-not (Test-Path -LiteralPath (Join-Path (Split-Path $env:install -Parent) $name))) { throw "$name was not put back beside the executable" }
          }

          # And on Windows, the image this rollback replaced is still there: it is the process that ran the
          # command, a running program cannot delete itself, and being renamed out of the way rather than
          # written over is the whole of why this worked. On Linux the same delete succeeds, so there is
          # nothing to find.
          if ($IsWindows -and -not (Get-ChildItem -Path (Join-Path $update 'replaced') -File -ErrorAction SilentlyContinue)) {
            throw "replaced/ is empty, so the executable that ran this rollback was never moved aside"
          }
          if (-not $status.database.applied_migrations) { throw "the restored database has no migrations applied" }

          # And the database serving now is the one from before the update, which is asked of what the restored
          # runtime had to do rather than of any file: the rollback ends by starting a runtime, and that runtime
          # opens the database and writes its own write-ahead log at once, so there is no quiet moment to
          # inspect. Nor can a mark be written into the migrated database first - a rollback that finds work
          # recorded since the update refuses to restore a database at all, which is the whole of B1. What is
          # left is evidence that costs no writes: the file put back is a migration behind, so this start had to
          # migrate it again and take a backup of its own. A rollback that left the migrated database where it
          # was would have started a runtime with nothing to do.
          if (-not $status.database.newly_applied) {
            throw "the runtime that came back applied no migrations, so the database it opened was already migrated and nothing was put back"
          }
          if (-not $status.database.backup_file -or $status.database.backup_file -eq $env:backup) {
            throw "the runtime that came back took no backup of its own: $($status.database.backup_file)"
          }

          & $env:install runtime stop | Out-Null

      - name: Stop the feed
        if: always()
        shell: pwsh
        run: |
          if ($env:server) { Stop-Process -Id $env:server -Force -ErrorAction SilentlyContinue }

  # The install scripts, run against the archives this run packaged, served from a local directory that holds
  # what a release would — assembled by the same script that assembles a release — with no network. Each job
  # installs three times: once told to leave the PATH alone, then twice more, so that the idempotent PATH edit
  # and the "already installed" no-op are exercised and not only described.
  install-sh:
    name: install.sh on ubuntu
    needs: [version, build-test-publish]
    if: needs.version.outputs.linux == 'true'
    runs-on: ubuntu-latest
    # Its token reads the repository for the checkout, and nothing more.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: jason-*
          merge-multiple: true
          path: feed

      # Every archive this run packaged: all three when every check runs, the Linux one alone on the Linux set.
      - name: Assemble the feed the way a release is assembled
        shell: pwsh
        run: ./.github/scripts/Write-Manifest.ps1 -Version ${{ needs.version.outputs.version }} -Directory feed -Require ${{ needs.version.outputs.rids }}

      - name: Install, twice over, and once more without touching the PATH
        shell: bash
        env:
          JASON_Update__CheckEnabled: 'false'
          JASON_INSTALL_FEED: ${{ github.workspace }}/feed
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A home of this job's own, so that the profile the script edits is one this job made — and so that
          # ~/.local/bin in it is not on the PATH, which is the case the profile line exists for.
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"

          sh install/install.sh --no-modify-path | tee first.txt
          installed="$("$HOME/.local/bin/jason" --version)"
          [ "${installed%%+*}" = "$VERSION" ] || { echo "installed '$installed', expected $VERSION"; exit 1; }

          # The licence and the third-party notices are kept beside it, by the names it keeps them as: the archive's
          # LICENSE is this tree's LICENSE. And the run ends saying which licence that is, then what to run next.
          cmp LICENSE "$HOME/.local/bin/jason-LICENSE"
          cmp THIRD-PARTY-NOTICES "$HOME/.local/bin/jason-THIRD-PARTY-NOTICES"
          [ "$(tail -n 2 first.txt | head -n 1)" = "Jason $VERSION is licensed under the MIT licence: https://github.com/reply-team/jason-ai/blob/v$VERSION/LICENSE" ] || { tail -n 2 first.txt; exit 1; }
          [ "$(tail -n 1 first.txt)" = 'Next, run `jason status`: it says what this installation still needs, and the command for each.' ] || { tail -n 1 first.txt; exit 1; }

          # What was installed opens its database, which is the half of "it runs" that --version cannot see.
          export JASON_DATA_DIR="$RUNNER_TEMP/installed-data"
          "$HOME/.local/bin/jason" runtime start
          "$HOME/.local/bin/jason" runtime status | grep -q '"applied_migrations":\["'
          "$HOME/.local/bin/jason" runtime stop
          unset JASON_DATA_DIR
          if [ -f "$HOME/.profile" ] && grep -q '# added by jason install' "$HOME/.profile"; then echo "--no-modify-path edited the profile"; exit 1; fi

          # The same version again with a notice missing, as an installation an older jason updated has it: the archive
          # is fetched and checked for the notice alone, the executable is left as it was, and this time the PATH line
          # is written.
          rm "$HOME/.local/bin/jason-THIRD-PARTY-NOTICES"
          executable="$(sha256sum < "$HOME/.local/bin/jason")"
          sh install/install.sh | tee again.txt
          grep -q "already installed" again.txt
          grep -q "its licence files were missing and are written beside it now" again.txt
          cmp THIRD-PARTY-NOTICES "$HOME/.local/bin/jason-THIRD-PARTY-NOTICES"
          [ "$(sha256sum < "$HOME/.local/bin/jason")" = "$executable" ]
          [ "$(grep -c '# added by jason install' "$HOME/.profile")" = "1" ]

          # A third run downloads nothing and adds no second line.
          sh install/install.sh | tee third.txt
          grep -q "nothing to download" third.txt
          [ "$(grep -c '# added by jason install' "$HOME/.profile")" = "1" ]

          # A login shell reads the line the script wrote and finds jason by name.
          sh -l -c 'jason --version'

      # The fixture names all three archives, which only a run that builds macOS packages.
      - name: Install from the schema-1 fixture, the feed layout 0.1.0 published
        if: needs.version.outputs.macos == 'true'
        shell: bash
        env:
          JASON_Update__CheckEnabled: 'false'
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A published tag can point today's script at a feed in the layout it was published with. The fixture is
          # 0.1.0's two files with the values taken out; filled over this run's archives, it is a feed in that layout.
          feed="$RUNNER_TEMP/schema-1-feed"
          pwsh -NoProfile -File ./.github/scripts/Fill-FeedFixture.ps1 -Fixture install/feeds/schema-1 -Archives feed -Version "$VERSION" -Out "$feed"

          export HOME="$RUNNER_TEMP/home-schema-1"
          mkdir -p "$HOME"
          sh install/install.sh --feed "$feed" --version "$VERSION" --install-dir "$RUNNER_TEMP/schema-1-bin" --no-modify-path
          installed="$("$RUNNER_TEMP/schema-1-bin/jason" --version)"
          [ "${installed%%+*}" = "$VERSION" ] || { echo "installed '$installed' from the schema-1 fixture, expected $VERSION"; exit 1; }

          # And what it installed opens its database, the half of "it runs" that --version cannot see.
          export JASON_DATA_DIR="$RUNNER_TEMP/schema-1-data"
          "$RUNNER_TEMP/schema-1-bin/jason" runtime start
          "$RUNNER_TEMP/schema-1-bin/jason" runtime status | grep -q '"applied_migrations":\["'
          "$RUNNER_TEMP/schema-1-bin/jason" runtime stop

      - name: Install into the profile bash reads, and take it back out
        shell: bash
        env:
          JASON_INSTALL_FEED: ${{ github.workspace }}/feed
        run: |
          # bash never reads ~/.profile once ~/.bash_profile exists, which is every Fedora, RHEL and Arch
          # account's skeleton. The installer, `jason status` and the uninstall all have to mean that file.
          export HOME="$RUNNER_TEMP/home-bash"
          export SHELL=/bin/bash
          mkdir -p "$HOME"
          printf '# mine\n' > "$HOME/.bash_profile"

          sh install/install.sh
          [ "$(grep -c '# added by jason install' "$HOME/.bash_profile")" = "1" ]
          if [ -f "$HOME/.profile" ]; then echo "the line went to ~/.profile, which this bash never reads"; exit 1; fi
          [ "$(bash -l -c 'command -v jason')" = "$HOME/.local/bin/jason" ]

          # A terminal a desktop opens is no login shell and reads ~/.bashrc alone, so the line is there too, once,
          # and the uninstall takes it back out of both files.
          [ "$(grep -c '# added by jason install' "$HOME/.bashrc")" = "1" ]
          [ "$(bash -i -c 'command -v jason' 2>/dev/null)" = "$HOME/.local/bin/jason" ]

          # This shell predates the line, and a new login shell reads it: the path check says ok, and says where.
          export JASON_DATA_DIR="$HOME/.jason"
          "$HOME/.local/bin/jason" status > status.json || true
          grep -q '"name":"path","required":true,"state":"ok"' status.json || { cat status.json; exit 1; }
          grep -q '.bash_profile' status.json

          # And the uninstall takes back exactly what the installer appended, and not one other byte, with the
          # executable and its two notice files.
          "$HOME/.local/bin/jason" uninstall
          printf '# mine\n' | cmp - "$HOME/.bash_profile"
          if grep -q '# added by jason install' "$HOME/.bashrc"; then echo "the uninstall left the line in ~/.bashrc"; exit 1; fi
          [ ! -e "$HOME/.local/bin/jason" ]
          [ ! -e "$HOME/.local/bin/jason-LICENSE" ]
          [ ! -e "$HOME/.local/bin/jason-THIRD-PARTY-NOTICES" ]

      - name: Install beside another tool with no SHELL set, and leave the line it is found through
        shell: bash
        env:
          JASON_INSTALL_FEED: ${{ github.workspace }}/feed
        run: |
          # ~/.local/bin is where other tools install too, and once the installer's line is there they are found
          # through it; the uninstall takes the line back only where the directory holds nothing but jason. And no
          # SHELL at all, as in a container's build step: the installer runs under set -eu and still writes the
          # profile every other shell reads.
          export HOME="$RUNNER_TEMP/home-shared"
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\necho another tool\n' > "$HOME/.local/bin/another-tool"
          chmod 755 "$HOME/.local/bin/another-tool"
          printf 'another tool licence\n' > "$HOME/.local/bin/LICENSE"

          env -u SHELL sh install/install.sh
          [ "$(grep -c '# added by jason install' "$HOME/.profile")" = "1" ]

          export JASON_DATA_DIR="$HOME/.jason"
          "$HOME/.local/bin/jason" uninstall > uninstall.json || { cat uninstall.json; exit 1; }
          [ ! -e "$HOME/.local/bin/jason" ]
          [ ! -e "$HOME/.local/bin/jason-LICENSE" ]
          [ ! -e "$HOME/.local/bin/jason-THIRD-PARTY-NOTICES" ]
          [ "$("$HOME/.local/bin/another-tool")" = "another tool" ]
          printf 'another tool licence\n' | cmp - "$HOME/.local/bin/LICENSE" || { echo "the uninstall touched another tool's LICENSE"; exit 1; }
          [ "$(grep -c '# added by jason install' "$HOME/.profile")" = "1" ] || { echo "the uninstall took away the line another tool is found through"; exit 1; }
          grep -q 'holds more than this installer writes there' uninstall.json || { cat uninstall.json; exit 1; }

  install-ps1:
    name: install.ps1 on windows
    needs: [version, build-test-publish]
    if: needs.version.outputs.full == 'true'
    runs-on: windows-latest
    # Its token reads the repository for the checkout, and nothing more.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: jason-*
          merge-multiple: true
          path: feed

      - name: Assemble the feed the way a release is assembled
        shell: pwsh
        run: ./.github/scripts/Write-Manifest.ps1 -Version ${{ needs.version.outputs.version }} -Directory feed -Require ${{ needs.version.outputs.rids }}

      # Windows PowerShell 5.1 rather than pwsh: it is what a fresh Windows has, and what the one-liner is typed into.
      - name: Install, twice over, and once more without touching the PATH
        shell: powershell
        env:
          JASON_Update__CheckEnabled: 'false'
          JASON_INSTALL_FEED: ${{ github.workspace }}\feed
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\jason'
          $exe = Join-Path $dir 'jason.exe'
          function UserPathEntries { @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd('\') -ieq $dir }) }

          ./install/install.ps1 -NoModifyPath
          $installed = & $exe --version
          if (($installed -split '\+')[0] -ne $env:VERSION) { throw "installed '$installed', expected $env:VERSION" }

          # The licence and the third-party notices are kept beside it, by the names it keeps them as: the archive's
          # LICENSE is this tree's LICENSE.
          $notices = @{ 'jason-LICENSE' = 'LICENSE'; 'jason-THIRD-PARTY-NOTICES' = 'THIRD-PARTY-NOTICES' }
          foreach ($name in $notices.Keys) {
            if ((Get-FileHash (Join-Path $dir $name)).Hash -ne (Get-FileHash $notices[$name]).Hash) { throw "$name beside the executable is not the archive's" }
          }

          # What was installed opens its database, which is the half of "it runs" that --version cannot see.
          $env:JASON_DATA_DIR = Join-Path $env:RUNNER_TEMP 'installed-data'
          & $exe runtime start | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the installed jason could not start a runtime ($LASTEXITCODE)" }
          $running = & $exe runtime status
          if ($LASTEXITCODE -ne 0 -or $running -notmatch '"applied_migrations":\["') { throw "the installed jason did not migrate: $running" }
          & $exe runtime stop | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the installed jason could not stop its runtime ($LASTEXITCODE)" }
          Remove-Item Env:\JASON_DATA_DIR
          if ((UserPathEntries).Count -ne 0) { throw "-NoModifyPath edited the user PATH" }

          # The account's Path as an ordinary account has it: REG_EXPAND_SZ, with an entry spelled through a variable.
          # Through [Environment]'s pair the script expanded every such entry and wrote the whole value back as
          # REG_SZ, which a fresh account's install turned out to do. This runner's own value is whatever the image
          # left, so the job gives it the shape to be kept rather than hoping for one; everything already in it stays.
          $key = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          $kept = '%USERPROFILE%\jason-ci-kept'
          $storedBefore = ((@(([string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')) -split ';' | Where-Object { $_ })) + $kept) -join ';'
          $key.SetValue('Path', $storedBefore, [Microsoft.Win32.RegistryValueKind]::ExpandString)
          $key.Dispose()

          # The same version again with a notice missing, as an installation an older jason updated has it: the archive
          # is fetched and checked for the notice alone, the executable is left as it was, and this time the PATH gains
          # the directory.
          # 6>&1 because the script talks to the person in front of it with Write-Host, which goes to the
          # information stream: an assignment on its own captures nothing, and the check below would be reading
          # an empty string while the words it is looking for scrolled past in the log.
          Remove-Item (Join-Path $dir 'jason-THIRD-PARTY-NOTICES')
          $executable = (Get-FileHash $exe).Hash
          $again = ./install/install.ps1 6>&1 | Out-String
          Write-Host $again
          if ($again -notmatch 'already installed') { throw "the second run did not say the version was already installed" }
          # Read with its white space taken out, and the sentences looked for likewise: Windows PowerShell wraps what
          # Write-Host said at the console's width once it is captured, wherever the width falls, inside a word as well.
          $said = $again -replace '\s+', ''
          function Said([string] $sentence) { $said.Contains(($sentence -replace '\s+', '')) }
          if (-not (Said 'its licence files were missing and are written beside it now')) { throw "the second run did not write the missing notice" }
          if ((Get-FileHash (Join-Path $dir 'jason-THIRD-PARTY-NOTICES')).Hash -ne (Get-FileHash THIRD-PARTY-NOTICES).Hash) { throw "the notice written again is not the archive's" }
          if ((Get-FileHash $exe).Hash -ne $executable) { throw "writing the missing notice changed the executable" }
          if (-not (Said "is licensed under the MIT licence: https://github.com/reply-team/jason-ai/blob/v$env:VERSION/LICENSE")) { throw "the second run did not say the licence" }
          if ((UserPathEntries).Count -ne 1) { throw "the user PATH does not hold the directory exactly once" }

          # And it kept the value's kind and every entry as it was written, variables unexpanded.
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $kindAfter = $key.GetValueKind('Path')
          $storedAfter = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $key.Dispose()
          Write-Host "user Path before: ExpandString  $storedBefore"
          Write-Host "user Path after:  $kindAfter  $storedAfter"
          if ($kindAfter -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) { throw "the install turned the user Path from ExpandString into $kindAfter" }
          foreach ($entry in @($storedBefore -split ';')) { if (@($storedAfter -split ';') -cnotcontains $entry) { throw "the install rewrote the user Path entry '$entry'" } }

          # A third run adds no second entry.
          ./install/install.ps1
          if ((UserPathEntries).Count -ne 1) { throw "the user PATH does not hold the directory exactly once after a third run" }

          # And a fourth, in the shape the one-liner really uses: `irm ... | iex` runs the text in the session
          # that typed it, so anything the script defines is still defined there when it is done. The three runs
          # above cannot see that - a script run as a file gets a scope of its own.
          Invoke-Expression (Get-Content ./install/install.ps1 -Raw)
          if (Get-Command Install-Jason -ErrorAction SilentlyContinue) { throw "install.ps1 left Install-Jason defined in the session that ran it" }

      # The fixture names all three archives, which only a run that builds macOS packages.
      - name: Install from the schema-1 fixture, the feed layout 0.1.0 published
        if: needs.version.outputs.macos == 'true'
        shell: powershell
        env:
          JASON_Update__CheckEnabled: 'false'
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A published tag can point today's script at a feed in the layout it was published with. The fixture is
          # 0.1.0's two files with the values taken out; filled over this run's archives, it is a feed in that layout.
          $ErrorActionPreference = 'Stop'
          $feed = Join-Path $env:RUNNER_TEMP 'schema-1-feed'
          pwsh -NoProfile -File ./.github/scripts/Fill-FeedFixture.ps1 -Fixture install/feeds/schema-1 -Archives feed -Version $env:VERSION -Out $feed
          if ($LASTEXITCODE -ne 0) { throw "filling the schema-1 fixture exited with $LASTEXITCODE" }

          $dir = Join-Path $env:RUNNER_TEMP 'schema-1-bin'
          ./install/install.ps1 -Feed $feed -Version $env:VERSION -InstallDir $dir -NoModifyPath
          $installed = & (Join-Path $dir 'jason.exe') --version
          if (($installed -split '\+')[0] -ne $env:VERSION) { throw "installed '$installed' from the schema-1 fixture, expected $env:VERSION" }

          # And what it installed opens its database, the half of "it runs" that --version cannot see.
          $env:JASON_DATA_DIR = Join-Path $env:RUNNER_TEMP 'schema-1-data'
          & (Join-Path $dir 'jason.exe') runtime start | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the jason installed from the schema-1 fixture could not start a runtime ($LASTEXITCODE)" }
          $running = & (Join-Path $dir 'jason.exe') runtime status
          if ($LASTEXITCODE -ne 0 -or $running -notmatch '"applied_migrations":\["') { throw "the jason installed from the schema-1 fixture did not migrate: $running" }
          & (Join-Path $dir 'jason.exe') runtime stop | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the jason installed from the schema-1 fixture could not stop its runtime ($LASTEXITCODE)" }
          Remove-Item Env:\JASON_DATA_DIR

  # The UI's checks, tests, build and smoke, on the one runner with Node: typecheck, lint, the unit and screen tests
  # against the exchanges the runtime's tests recorded, the build, the asset zip uploaded for a person to try, and the
  # browser smoke against a runtime built here; and, with the same Node, every plugin package's JavaScript parsed. Linux
  # only, and on every run of the Linux set, a draft's pushes included: the browser engine is the same everywhere, and
  # what differs by OS is runtime code the platform jobs run.
  ui:
    name: The UI on ubuntu
    needs: version
    if: needs.version.outputs.linux == 'true'
    runs-on: ubuntu-latest
    # Its token reads the repository for the checkout, and nothing more.
    permissions:
      contents: read
    env:
      JASON_Update__CheckEnabled: 'false'
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Every file of every package under plugins/, found rather than listed, so a new package is parsed without an
      # edit here. node --check reads one file at a time. Before the runtime's build, so a syntax error is reported in
      # seconds rather than after it.
      - name: Every plugin's JavaScript parses
        working-directory: .
        shell: bash
        run: find plugins/*/ -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.version.outputs.sdk }}

      - name: Build the runtime the smoke drives
        working-directory: .
        run: dotnet build dotnet/src/Jason.App --configuration Release -p:Version=${{ needs.version.outputs.version }}

      - name: Install
        run: npm ci

      - name: Check (types, lint, format)
        run: npm run check

      - name: Unit and screen tests
        run: npm test

      - name: Build and package
        env:
          JASON_VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm run build
          npm run package

      # The zip a person unzips into ~/.jason/ui/custom/ to try this build with jason ui open. Kept fourteen days where
      # CI's other uploads keep three: those exist for the jobs of the same run, this one for a person trying the build
      # at their own pace.
      - uses: actions/upload-artifact@v7
        with:
          name: jason-ui
          path: ui/artifacts/jason-ui.zip
          retention-days: 14

      # The browser the smoke drives, kept between runs under the Playwright version the lockfile pins. Its system
      # libraries are the runner's, not the cache's: they are installed either way.
      - uses: actions/cache@v6
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser's system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser smoke
        env:
          JASON_EXE: ${{ github.workspace }}/dotnet/src/Jason.App/bin/Release/net10.0/jason
        run: npm run e2e

  # A check main's ruleset requires whose leg this run does not need, reported under the leg's own name as a success
  # whose one step says why: win-x64, osx-arm64 and the update on win-x64 on a ready pull request into main that is not
  # the release's, and on a push to the release's pull request that changes documentation only; win-x64, osx-arm64 and
  # both updates on the version pull request; every platform and update on a push to main whose tree was tested
  # already, or whose one commit changes documentation alone. A matrix row that is absent would never report, and a
  # merge would wait for it, so the version job hands the legs it leaves out to this job. A job without a matrix reports
  # under its own name when its condition skips it, so every other check the ruleset requires reports without a
  # stand-in.
  skipped-by-rule:
    name: ${{ matrix.check }}
    needs: version
    if: needs.version.outputs.skipping == 'true'
    runs-on: ubuntu-latest
    # It checks nothing out and reads nothing: its token can do nothing.
    permissions: {}
    strategy:
      matrix: ${{ fromJSON(needs.version.outputs.skipped) }}
    steps:
      - name: Skipped by rule
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
          WHY: ${{ matrix.why }}
        run: |
          echo "$CHECK is skipped by rule: $WHY"
          echo "$CHECK is skipped by rule: $WHY" >> "$GITHUB_STEP_SUMMARY"
