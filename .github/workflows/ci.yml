name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: The version this tree carries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - id: version
        shell: pwsh
        run: |
          # MSBuild's own answer — VersionPrefix and VersionSuffix from Directory.Build.props, 0.1.0-dev today —
          # so a pull request is stamped with the number the tree already carries rather than with a second copy
          # kept here. Every job below is told this one value; release.yml decides the same input from the tag.
          $version = (dotnet msbuild runtime/src/Jason.App/Jason.App.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "MSBuild did not answer with a version." }
          Write-Host "version -> $version"
          "version=$version" >> $env:GITHUB_OUTPUT

  build-test-publish:
    name: ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore runtime/Jason.slnx

      - name: Build (warnings are errors)
        run: dotnet build runtime/Jason.slnx --configuration Release --no-restore -p:Version=${{ needs.version.outputs.version }}

      - name: Test (offline)
        run: dotnet test --solution runtime/Jason.slnx --configuration Release --no-build -p:Version=${{ needs.version.outputs.version }}

      # The publish, the archive, the checksum and the manifest fragment: the same action release.yml runs on
      # a tag, so the packaging is exercised on every pull request long before a tag exists.
      - name: Package
        id: package
        uses: ./.github/actions/package
        with:
          rid: ${{ matrix.rid }}
          version: ${{ needs.version.outputs.version }}

      - name: Smoke-test the published executable
        shell: pwsh
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $exe = $env:EXECUTABLE
          $env:JASON_DATA_DIR = Join-Path ([IO.Path]::GetTempPath()) "jason-ci-smoke"

          $elapsed = Measure-Command { & $exe --version | Tee-Object -Variable version }
          if ($LASTEXITCODE -ne 0) { throw "jason --version exited with $LASTEXITCODE" }
          Write-Host "jason --version -> $version ($([int]$elapsed.TotalMilliseconds) ms cold start)"

          # What it prints is the stamped version plus build metadata (+<commit>), which SemVer says to ignore.
          if (($version -split '\+')[0] -ne $env:VERSION) { throw "jason --version says '$version', and this build was stamped $env:VERSION" }

          $elapsed = Measure-Command { & $exe runtime status | Tee-Object -Variable status }
          $statusExit = $LASTEXITCODE
          Write-Host "jason runtime status -> exit $statusExit in $([int]$elapsed.TotalMilliseconds) ms: $status"
          if ($statusExit -ne 3) { throw "expected exit code 3 without a running runtime, got $statusExit" }
          if ($status -notmatch '"code":"no_descriptor"') { throw "expected a no_descriptor error envelope" }

          # And it opens the database. Everything above passes on a build that cannot: a single-file publish
          # leaves SQLite's native library beside the executable unless it is told to bundle it, `--version`
          # and a status with no runtime never touch it, and the archive carries the executable alone — so the
          # one build this whole wave exists to deliver would have gone out green. Starting the runtime is what
          # loads it.
          & $exe runtime start | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime start exited with $LASTEXITCODE; the published executable cannot open its database" }

          & $exe runtime status | Tee-Object -Variable running | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime status exited with $LASTEXITCODE while a runtime was running" }
          if ($running -notmatch '"applied_migrations":\["') { throw "runtime status reported no applied migrations: $running" }
          Write-Host "the runtime started, migrated and answered"

          & $exe runtime stop | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime stop exited with $LASTEXITCODE" }

          # The last command of this step is expected to exit 3, and pwsh would hand that on as the step's
          # own exit code. Everything asserted above passed, so the step succeeded.
          exit 0

  # The install scripts, run against the archives this run packaged, served from a local directory that holds
  # what a release would — assembled by the same script that assembles a release — with no network. Each job
  # installs three times: once told to leave the PATH alone, then twice more, so that the idempotent PATH edit
  # and the "already installed" no-op are exercised and not only described.
  update-end-to-end:
    name: an update on ${{ matrix.rid }}
    needs: [version, build-test-publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The version this tree carries, as the platform job already published it. Taking the artifact rather
      # than publishing it again is one whole publish saved per platform, and it is the same bytes a person
      # would have installed.
      - uses: actions/download-artifact@v7
        with:
          name: jason-${{ matrix.rid }}
          path: installed

      - name: Decide the version this update installs
        id: next
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Two versions, or this job proves nothing: with the same build on both sides a completed swap and an
          # applier that did nothing look identical to --version, and the health check passes either way.
          $numbers = (($env:VERSION -split '\+')[0] -split '-')[0] -split '\.'
          "next=$($numbers[0]).$($numbers[1]).$([int]$numbers[2] + 1)" >> $env:GITHUB_OUTPUT

      # Packaged by the action a release packages with, so what this job installs is an archive of the same
      # shape, with the same licence in it and the same digest written beside it. Only the artifact's name
      # differs: two uploads in one run cannot share one.
      - name: Package the next version
        id: package
        uses: ./.github/actions/package
        with:
          rid: ${{ matrix.rid }}
          version: ${{ steps.next.outputs.next }}
          artifact: jason-${{ matrix.rid }}-next

      - name: Serve that version from a feed on this machine
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          New-Item -ItemType Directory -Force feed | Out-Null
          Copy-Item artifacts/release/* feed -Force
          ./.github/scripts/Write-Manifest.ps1 -Version $env:NEXT -Directory feed -Require $env:RID
          Get-Content feed/manifest.json

          # Served from this machine and nowhere else: 127.0.0.1, for the length of this job. UpdateFeed takes
          # https or loopback http and refuses a directory, so a feed has to be served rather than pointed at.
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          $server = Start-Process $python -ArgumentList '-m', 'http.server', '8099', '--bind', '127.0.0.1', '--directory', 'feed' -PassThru
          "server=$($server.Id)" >> $env:GITHUB_ENV
          for ($try = 0; $try -lt 50; $try++) {
            try { Invoke-WebRequest -Uri http://127.0.0.1:8099/manifest.json -UseBasicParsing | Out-Null; break }
            catch { Start-Sleep -Milliseconds 200 }
          }

      - name: Install the version this tree carries, and leave its runtime stopped
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $exe = if ($env:RID -like 'win-*') { 'jason.exe' } else { 'jason' }
          $asset = if ($env:RID -like 'win-*') { "jason-$env:RID.zip" } else { "jason-$env:RID.tar.gz" }
          New-Item -ItemType Directory -Force install | Out-Null
          if ($env:RID -like 'win-*') {
            Expand-Archive -Path "installed/$asset" -DestinationPath install -Force
          } else {
            tar -xzf "installed/$asset" -C install
            chmod +x "install/$exe"
          }

          # Deliberately not asked what version it is: that would be an executable checked without opening a
          # database, and this runtime must stay stopped until the update, or it migrates the prepared database
          # itself and the new version has nothing to back up. What was installed is asserted from the update's
          # own report below, which comes from the program rather than from a second invocation of it.
          "install=$(Resolve-Path "install/$exe")" >> $env:GITHUB_ENV

      - name: Prepare a database one migration behind
        shell: pwsh
        run: |
          # EF's own migrator, not a checked-in file: the triggers and the indexes live in the migrations, so
          # this is a real older database rather than something shaped like one. The connection is given, or
          # the design-time factory writes design-time.db into the working directory and the runtime opens a
          # database nobody prepared.
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool restore exited with $LASTEXITCODE" }

          $migrations = dotnet ef migrations list --project runtime/src/Jason.Runtime --startup-project runtime/src/Jason.Runtime --no-connect `
            | Where-Object { $_ -match '^\d{14}_' }
          $previous = ($migrations | Select-Object -Last 2 | Select-Object -First 1).Trim()
          if (-not $previous) { throw "no migration to stop at; got: $migrations" }

          $data = Join-Path $env:RUNNER_TEMP 'update-data'
          New-Item -ItemType Directory -Force (Join-Path $data 'state') | Out-Null
          $database = Join-Path $data 'state/jason.db'
          dotnet ef database update $previous --project runtime/src/Jason.Runtime --startup-project runtime/src/Jason.Runtime --connection "Data Source=$database"
          if ($LASTEXITCODE -ne 0) { throw "preparing the older database exited with $LASTEXITCODE" }

          "JASON_DATA_DIR=$data" >> $env:GITHUB_ENV
          "stopped_at=$previous" >> $env:GITHUB_ENV
          Write-Host "prepared a database at $previous"

      - name: Update it, and assert every stage
        shell: pwsh
        env:
          NEXT: ${{ steps.next.outputs.next }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # What the swap has to move, measured before it happens: an update that copied instead of renaming,
          # or did nothing at all, cannot produce these three afterwards.
          $before = (Get-FileHash $env:install -Algorithm SHA256).Hash

          $out = & $env:install update apply --feed http://127.0.0.1:8099/manifest.json --drain-seconds 0
          if ($LASTEXITCODE -ne 0) { throw "jason update apply exited with $LASTEXITCODE`n$out" }
          Write-Host $out

          $applied = $out | ConvertFrom-Json
          if (($applied.from -split '\+')[0] -ne $env:VERSION) { throw "the update ran against $($applied.from), and this job installed $env:VERSION" }
          if ($applied.to -ne $env:NEXT) { throw "the update says it installed $($applied.to), and the feed offered $env:NEXT" }
          foreach ($step in 'staged', 'drained', 'stopped', 'kept', 'swapped', 'started', 'healthy') {
            if (-not ($applied.steps | Where-Object { $_ -like "$step*" })) { throw "the update never said '$step': $($applied.steps -join '; ')" }
          }

          # What version is installed is asked of the runtime that is now serving rather than of the file, for
          # the reason the applier's own health check does it that way: a file that prints a version proves a
          # file exists, and what matters is which build is running. That assertion is in the step below.
          $update = Join-Path $env:JASON_DATA_DIR 'update'
          $previous = Get-ChildItem -Path (Join-Path $update 'previous') -File
          if ((Get-FileHash $previous[0].FullName -Algorithm SHA256).Hash -ne $before) {
            throw "what was kept is not the executable that was installed before the update"
          }
          if (Get-ChildItem -Path (Join-Path $update 'staged') -File -Recurse -ErrorAction SilentlyContinue) {
            throw "the staged executable is still staged, so what was installed is a copy of it rather than the file itself"
          }

      - name: The new version migrated the database it inherited
        shell: pwsh
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          # The half of the acceptance criterion the applier cannot fake: the database this update inherited was
          # one migration behind, so the new version's first start had to back it up and migrate it.
          $status = & $env:install runtime status | ConvertFrom-Json
          if (($status.runtime_version -split '\+')[0] -ne $env:NEXT) { throw "the runtime serving after the update says it is $($status.runtime_version), and this job installed $env:NEXT" }
          if (-not $status.database.newly_applied) { throw "the new version's first start applied no migrations: $($status | ConvertTo-Json -Depth 5)" }
          if (-not $status.database.backup_file) { throw "the new version migrated and wrote no backup" }
          if (-not (Test-Path $status.database.backup_file)) { throw "the backup it named is not there: $($status.database.backup_file)" }
          Write-Host "migrated $($status.database.newly_applied -join ', ') and kept $($status.database.backup_file)"

          $ledger = Get-Content (Join-Path $env:JASON_DATA_DIR 'update/ledger.json') | ConvertFrom-Json
          if ($ledger.step -ne 'complete') { throw "the ledger says '$($ledger.step)'" }
          if (-not $ledger.newly_applied) { throw "the ledger did not record what the first start applied" }

          & $env:install runtime stop | Out-Null

      - name: Stop the feed
        if: always()
        shell: pwsh
        run: |
          if ($env:server) { Stop-Process -Id $env:server -Force -ErrorAction SilentlyContinue }

  install-sh:
    name: install.sh on ubuntu
    needs: [version, build-test-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: jason-*
          merge-multiple: true
          path: feed

      - name: Assemble the feed the way a release is assembled
        shell: pwsh
        run: ./.github/scripts/Write-Manifest.ps1 -Version ${{ needs.version.outputs.version }} -Directory feed -Require win-x64,linux-x64,osx-arm64

      - name: Install, twice over, and once more without touching the PATH
        shell: bash
        env:
          JASON_INSTALL_FEED: ${{ github.workspace }}/feed
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A home of this job's own, so that the profile the script edits is one this job made — and so that
          # ~/.local/bin in it is not on the PATH, which is the case the profile line exists for.
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"

          sh install/install.sh --no-modify-path
          installed="$("$HOME/.local/bin/jason" --version)"
          [ "${installed%%+*}" = "$VERSION" ] || { echo "installed '$installed', expected $VERSION"; exit 1; }

          # What was installed opens its database, which is the half of "it runs" that --version cannot see.
          export JASON_DATA_DIR="$RUNNER_TEMP/installed-data"
          "$HOME/.local/bin/jason" runtime start
          "$HOME/.local/bin/jason" runtime status | grep -q '"applied_migrations":\["'
          "$HOME/.local/bin/jason" runtime stop
          unset JASON_DATA_DIR
          if [ -f "$HOME/.profile" ] && grep -q '# added by jason install' "$HOME/.profile"; then echo "--no-modify-path edited the profile"; exit 1; fi

          # The same version again: nothing is downloaded, the script says so, and this time the PATH line is written.
          sh install/install.sh | tee again.txt
          grep -q "already installed" again.txt
          [ "$(grep -c '# added by jason install' "$HOME/.profile")" = "1" ]

          # A third run adds no second line.
          sh install/install.sh
          [ "$(grep -c '# added by jason install' "$HOME/.profile")" = "1" ]

          # A login shell reads the line the script wrote and finds jason by name.
          sh -l -c 'jason --version'

  install-ps1:
    name: install.ps1 on windows
    needs: [version, build-test-publish]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: jason-*
          merge-multiple: true
          path: feed

      - name: Assemble the feed the way a release is assembled
        shell: pwsh
        run: ./.github/scripts/Write-Manifest.ps1 -Version ${{ needs.version.outputs.version }} -Directory feed -Require win-x64,linux-x64,osx-arm64

      # Windows PowerShell 5.1 rather than pwsh: it is what a fresh Windows has, and what the one-liner is typed into.
      - name: Install, twice over, and once more without touching the PATH
        shell: powershell
        env:
          JASON_INSTALL_FEED: ${{ github.workspace }}\feed
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\jason'
          $exe = Join-Path $dir 'jason.exe'
          function UserPathEntries { @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd('\') -ieq $dir }) }

          ./install/install.ps1 -NoModifyPath
          $installed = & $exe --version
          if (($installed -split '\+')[0] -ne $env:VERSION) { throw "installed '$installed', expected $env:VERSION" }

          # What was installed opens its database, which is the half of "it runs" that --version cannot see.
          $env:JASON_DATA_DIR = Join-Path $env:RUNNER_TEMP 'installed-data'
          & $exe runtime start | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the installed jason could not start a runtime ($LASTEXITCODE)" }
          $running = & $exe runtime status
          if ($LASTEXITCODE -ne 0 -or $running -notmatch '"applied_migrations":\["') { throw "the installed jason did not migrate: $running" }
          & $exe runtime stop | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the installed jason could not stop its runtime ($LASTEXITCODE)" }
          Remove-Item Env:\JASON_DATA_DIR
          if ((UserPathEntries).Count -ne 0) { throw "-NoModifyPath edited the user PATH" }

          # The same version again: nothing is downloaded, the script says so, and this time the PATH gains the directory.
          # 6>&1 because the script talks to the person in front of it with Write-Host, which goes to the
          # information stream: an assignment on its own captures nothing, and the check below would be reading
          # an empty string while the words it is looking for scrolled past in the log.
          $again = ./install/install.ps1 6>&1 | Out-String
          Write-Host $again
          if ($again -notmatch 'already installed') { throw "the second run did not say the version was already installed" }
          if ((UserPathEntries).Count -ne 1) { throw "the user PATH does not hold the directory exactly once" }

          # A third run adds no second entry.
          ./install/install.ps1
          if ((UserPathEntries).Count -ne 1) { throw "the user PATH does not hold the directory exactly once after a third run" }
