          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Needs 'Install this build over the previous release''s Jason Desktop, as its updater runs an installer=${{ steps.over-previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
