          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step FromPrevious -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Previous $env:PREVIOUS
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromTerminal -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-previous-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-previous-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The previous release's command-line Jason, a runtime running and its logon start registered, one campaign made,
      # then this build's unpinned line run over it as an agent runs it, while that runtime runs: the old runtime stopped
      # before the install is retired, a runtime again from the carried jason, the Path, a new shell, the campaigns the same
      # by id; then taken off from a new terminal, and the listing held to the machine before.
      - name: Run this build's line over the previous release's command-line Jason while its runtime runs
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: pwsh
        env:
          LEG: "Run this build's line over the previous release's command-line Jason while its runtime runs"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
