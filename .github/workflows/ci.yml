name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: The version this tree carries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - id: version
        shell: pwsh
        run: |
          # MSBuild's own answer — VersionPrefix and VersionSuffix from Directory.Build.props, 0.1.0-dev today —
          # so a pull request is stamped with the number the tree already carries rather than with a second copy
          # kept here. Every job below is told this one value; release.yml decides the same input from the tag.
          $version = (dotnet msbuild runtime/src/Jason.App/Jason.App.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "MSBuild did not answer with a version." }
          Write-Host "version -> $version"
          "version=$version" >> $env:GITHUB_OUTPUT

  build-test-publish:
    name: ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore runtime/Jason.slnx

      - name: Build (warnings are errors)
        run: dotnet build runtime/Jason.slnx --configuration Release --no-restore -p:Version=${{ needs.version.outputs.version }}

      - name: Test (offline)
        run: dotnet test --solution runtime/Jason.slnx --configuration Release --no-build -p:Version=${{ needs.version.outputs.version }}

      # The publish, the archive, the checksum and the manifest fragment: the same action release.yml runs on
      # a tag, so the packaging is exercised on every pull request long before a tag exists.
      - name: Package
        id: package
        uses: ./.github/actions/package
        with:
          rid: ${{ matrix.rid }}
          version: ${{ needs.version.outputs.version }}

      - name: Smoke-test the published executable
        shell: pwsh
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $exe = $env:EXECUTABLE
          $env:JASON_DATA_DIR = Join-Path ([IO.Path]::GetTempPath()) "jason-ci-smoke"

          $elapsed = Measure-Command { & $exe --version | Tee-Object -Variable version }
          if ($LASTEXITCODE -ne 0) { throw "jason --version exited with $LASTEXITCODE" }
          Write-Host "jason --version -> $version ($([int]$elapsed.TotalMilliseconds) ms cold start)"

          # What it prints is the stamped version plus build metadata (+<commit>), which SemVer says to ignore.
          if (($version -split '\+')[0] -ne $env:VERSION) { throw "jason --version says '$version', and this build was stamped $env:VERSION" }

          $elapsed = Measure-Command { & $exe runtime status | Tee-Object -Variable status }
          $statusExit = $LASTEXITCODE
          Write-Host "jason runtime status -> exit $statusExit in $([int]$elapsed.TotalMilliseconds) ms: $status"
          if ($statusExit -ne 3) { throw "expected exit code 3 without a running runtime, got $statusExit" }
          if ($status -notmatch '"code":"no_descriptor"') { throw "expected a no_descriptor error envelope" }

          # The last command of this step is expected to exit 3, and pwsh would hand that on as the step's
          # own exit code. Everything asserted above passed, so the step succeeded.
          exit 0
