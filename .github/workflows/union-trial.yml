# A throwaway workflow on a throwaway branch: the macOS proof job of ci.yml, copied unchanged, run on a push to this
# branch alone, so that it can be tried without running every check. It is never merged.
name: Union trial

on:
  push:
    branches: ['REPLY-54706-ci-proof-trial']

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  # The one switch of the going-back legs of both union jobs: what the page's going back says of the person's own
  # quick-start, moved out of the skills folder before step 3 - put back after step 3 (put-back), or kept out while the
  # previous release is installed (keep-out).
  JASON_PROOF_OWN_SKILL_GOING_BACK: put-back

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      sdk: ${{ steps.dotnet.outputs.sdk-version }}
      full: 'true'
    steps:
      - uses: actions/checkout@v7
      - id: dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: latest
      - id: version
        shell: pwsh
        run: |
          $release = (dotnet msbuild dotnet/src/Jason.App/Jason.App.csproj -getProperty:VersionPrefix).Trim()
          "release=$release" >> $env:GITHUB_OUTPUT

  union-macos:
    name: install.sh on macos
    needs: version
    if: needs.version.outputs.full == 'true'
    runs-on: macos-latest
    # A step that waits on a program that never ends is stopped here, not at the six hours a job may otherwise run. 180 for
    # this rehearsal, which adds the legs over the previous release's Jason Desktop; set again after the first run that
    # runs every leg, to that run's time and half again.
    timeout-minutes: 180
    # Its token reads the repository for the checkout, and nothing more: the previous release is read from its public downloads.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.release }}-ci.${{ github.run_number }}
      OUT: ${{ github.workspace }}/installation
      FEED: ${{ github.workspace }}/feed
      PREVIOUS: ${{ github.workspace }}/previous
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.version.outputs.sdk }}

      # The requirement install.sh holds an application to, read from the script, against the application the latest
      # release published, from its public downloads checked against its checksums.txt: every row elsewhere compares the
      # line as a string, and only a real signature shows that it admits Jason's and refuses another team's.
      - name: Hold install.sh's requirement against the latest published application
        timeout-minutes: 20
        shell: bash
        run: |
          tag="$(curl -sS --max-time 60 -o /dev/null -w '%{redirect_url}' https://github.com/reply-team/jason-ai/releases/latest | sed 's|.*/releases/tag/||')"
          printf '%s\n' "$tag" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::the latest published release could not be read: '$tag'"; exit 1; }
          mkdir -p "$RUNNER_TEMP/published"
          for name in checksums.txt jason-desktop-macos-arm64.zip; do
            curl -fsSL --max-time 600 -o "$RUNNER_TEMP/published/$name" "https://github.com/reply-team/jason-ai/releases/download/$tag/$name"
          done
          (cd "$RUNNER_TEMP/published" && grep -E '  jason-desktop-macos-arm64\.zip$' checksums.txt | shasum -a 256 -c -)
          bash .github/scripts/test-installation-macos.sh requirement "$RUNNER_TEMP/published/jason-desktop-macos-arm64.zip"
          echo "- install.sh's requirement admits the application $tag published, and refuses it named for another team" >> "$GITHUB_STEP_SUMMARY"

      # A test build (JasonTestBuild, read by MSBuild from the environment): it says so on --version's standard error and
      # in the runtime's report, and its move into the application takes the requirement this job names (the ad hoc
      # signature's), as no released build can.
      - name: Package jason for osx-arm64 as a pull request does, as a test build
        timeout-minutes: 20
        id: package
        uses: ./.github/actions/package
        env:
          JasonTestBuild: 'true'
        with:
          rid: osx-arm64
          version: ${{ env.VERSION }}
          artifact: ci-union-osx-arm64
          retention-days: 3

      # The id of the folder this build's jason extracts its native libraries to under ~/.net/jason, read with the host's base
      # pointed elsewhere, so that the compares tell this build's extraction folder from the previous release's.
      - name: Read the folder this build's jason extracts its native libraries to
        id: extracted
        timeout-minutes: 20
        shell: bash
        run: bash .github/scripts/test-installation-macos.sh extracted "$GITHUB_WORKSPACE/${{ steps.package.outputs.executable }}"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # CSC_FOR_PULL_REQUEST: electron-builder skips every signature on a pull request's build, the ad hoc one included,
      # and an arm64 Mac runs no program without one. CSC_IDENTITY_AUTO_DISCOVERY: no identity of this runner is looked for.
      - name: Build Jason Desktop around it as a test build
        id: desktop-build
        timeout-minutes: 20
        shell: pwsh
        working-directory: desktop
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          JASON_DESKTOP_TEST_BUILD: '1'
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ../.github/scripts/Build-DesktopTestBuild.ps1 -Rid osx-arm64 -Version $env:VERSION -Executable (Join-Path $env:GITHUB_WORKSPACE $env:EXECUTABLE)

      - name: Assemble the feed the way a release is assembled
        id: feed
        timeout-minutes: 20
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:FEED | Out-Null
          Copy-Item artifacts/release/* $env:FEED
          Copy-Item desktop/dist/jason-desktop-macos-arm64.zip, desktop/dist/jason-desktop-macos-arm64.zip.blockmap, desktop/dist/latest-mac.yml $env:FEED
          ./.github/scripts/Write-SkillsArchive.ps1 -Tree . -Archive (Join-Path $env:FEED 'jason-skills.zip') -Repository https://github.com/reply-team/jason-ai -Ref ("v" + ($env:VERSION -replace '-.*$', '')) -Commit "${{ github.sha }}"
          ./.github/scripts/Write-Manifest.ps1 -Version $env:VERSION -Directory $env:FEED -Require osx-arm64 -Plugins jason-skills.zip,jason-desktop-macos-arm64.zip,jason-desktop-macos-arm64.zip.blockmap,latest-mac.yml
          Get-Content (Join-Path $env:FEED 'manifest.json')

      # The released script, unchanged, holds the test build to the release's team and refuses it, every run. The copy the
      # next steps run differs from it by the one line naming what a signature must satisfy, counted; it names this
      # build's own ad hoc signature, and lives in the runner's temporary directory, never uploaded.
      - name: The released install.sh refuses the ad hoc test build, and a copy names its signature
        timeout-minutes: 20
        id: stand-in
        shell: bash
        run: |
          status=0
          JASON_INSTALL_FEED="$FEED" sh install/install.sh > "$RUNNER_TEMP/refused.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/refused.txt"
          [ "$status" -ne 0 ] || { echo "::error::the released install.sh installed an ad hoc signed application"; exit 1; }
          grep -qi 'sign' "$RUNNER_TEMP/refused.txt" || { echo "::error::the released install.sh failed for another reason than the signature"; exit 1; }
          [ ! -e /Applications/Jason.app ] && [ ! -e "$HOME/Applications/Jason.app" ] || { echo "::error::the refused install left an application"; exit 1; }
          bash .github/scripts/test-installation-macos.sh stand-in desktop/dist/mac-arm64/Jason.app "$RUNNER_TEMP/install-stand-in-signer.sh"
          echo "script=$RUNNER_TEMP/install-stand-in-signer.sh" >> "$GITHUB_OUTPUT"

      - name: The machine before anything is installed
        id: before
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: |
          mkdir -p "$HOME/.claude" "$HOME/.codex" "$HOME/.agents/skills/quick-start"
          printf "a person's own skill" > "$HOME/.agents/skills/quick-start/SKILL.md"
          bash .github/scripts/test-installation-macos.sh listing before

      # From here on no leg's failure stops the legs after it: each runs unless the job was cancelled, begins from the
      # machine before (one an earlier failed leg left is taken off by the product's own uninstalls, and said so) or says
      # it was not run and which step it needed, and the job fails at its end, in the last step, with the list.
      - name: Install as an agent does, with install.sh
        id: install
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "Install as an agent does, with install.sh"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The released install.sh refuses the ad hoc test build, and a copy names its signature=${{ steps.stand-in.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh install "$FEED" "$VERSION" "${{ steps.stand-in.outputs.script }}"
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      - name: Uninstall from a new terminal, refused first while the application runs
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "Uninstall from a new terminal, refused first while the application runs"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" "Install as an agent does, with install.sh=${{ steps.install.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh refuse-while-open
          bash .github/scripts/test-installation-macos.sh uninstall-terminal
          bash .github/scripts/test-installation-macos.sh listing after-terminal-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-terminal-uninstall before
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      - name: Install again, and uninstall from the application's Uninstall Jason item
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "Install again, and uninstall from the application's Uninstall Jason item"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The released install.sh refuses the ad hoc test build, and a copy names its signature=${{ steps.stand-in.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh install "$FEED" "$VERSION" "${{ steps.stand-in.outputs.script }}"
          bash .github/scripts/test-installation-macos.sh uninstall-menu
          bash .github/scripts/test-installation-macos.sh listing after-menu-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-menu-uninstall before
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # The pinned line, on a machine the legs before brought back to its listing: a pin naming another version refused,
      # then --version naming this one, asserted as the unpinned install is; whether autostart enable starts a runtime at
      # once, said; and the installation taken off from a new terminal.
      - name: Install by the pinned line, see whether autostart enable starts a runtime, and uninstall from a new terminal
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "Install by the pinned line, see whether autostart enable starts a runtime, and uninstall from a new terminal"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The released install.sh refuses the ad hoc test build, and a copy names its signature=${{ steps.stand-in.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh install "$FEED" "$VERSION" "${{ steps.stand-in.outputs.script }}" pinned
          bash .github/scripts/test-installation-macos.sh enable-starts-now
          bash .github/scripts/test-installation-macos.sh uninstall-terminal
          bash .github/scripts/test-installation-macos.sh listing after-pinned-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-pinned-uninstall before
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # This build's application put in Applications by hand on a clean machine, as a person drags it there, and opened as
      # a person opens it, with no script before it: its first start's set-up ran and completed, a new login shell finds
      # jason, this build's, the profile line is there, the skills are recorded, and the set-up's report says a new
      # terminal finds this jason; then the installation taken off from a new terminal and the listing held to the machine
      # before.
      - name: This build's application, put in Applications by hand on a clean machine and opened, puts jason in a new terminal
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "This build's application, put in Applications by hand on a clean machine and opened, puts jason in a new terminal"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh by-hand desktop/dist/mac-arm64/Jason.app "$VERSION"
          bash .github/scripts/test-installation-macos.sh uninstall-terminal account-shell
          bash .github/scripts/test-installation-macos.sh listing after-by-hand-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-by-hand-uninstall before
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # The previous release, named: these legs begin in the world before one installation, and v0.48.5 is the last release
      # of that world, whose install puts a command-line Jason of its own where every leg that starts from a previous
      # release expects one. Never the latest published release: once 0.49.0 is published that is a release that installs
      # Jason Desktop alone, and every such leg would fail on it. Its files come from its public downloads. No token: the
      # repository's releases are public.
      - name: Fetch the previous release
        id: previous
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          PREVIOUS_RELEASE: v0.48.5
        run: |
          release="v${VERSION%%-*}"
          tag="$PREVIOUS_RELEASE"
          [ "$tag" != "$release" ] || { echo "::error::the previous release named, $tag, is the one this tree builds: there is no previous release to update from here"; exit 1; }
          mkdir -p "$PREVIOUS"
          # Every file fetched is in one of two lists, by name. The verified ones are held to checksums.txt: a file with no
          # line there, or a digest that differs, fails. checksums.txt names the release's archives and packages alone, so
          # the others are used as downloaded, each said unverified; one checksums.txt comes to list fails until it is moved.
          verified="jason-osx-arm64.tar.gz jason-desktop-macos-arm64.zip"
          unverifiable="install.sh manifest.json"
          for name in checksums.txt $verified $unverifiable; do
            curl -fsSL --max-time 600 -o "$PREVIOUS/$name" "https://github.com/reply-team/jason-ai/releases/download/$tag/$name"
          done
          listed() { awk -v n="$1" 'index($0, "  ") > 0 && substr($0, index($0, "  ") + 2) == n' "$PREVIOUS/checksums.txt"; }
          for name in $verified; do
            line="$(listed "$name")"
            [ -n "$line" ] || { echo "::error::$name has no line in $tag's checksums.txt"; exit 1; }
            (cd "$PREVIOUS" && printf '%s\n' "$line" | shasum -a 256 -c - > /dev/null) || { echo "::error::$name does not match $tag's checksums.txt"; exit 1; }
            echo "$name matches $tag's checksums.txt"
          done
          for name in $unverifiable; do
            [ -z "$(listed "$name")" ] || { echo "::error::$name is now listed in $tag's checksums.txt: it belongs with the verified files"; exit 1; }
            said="$name is not listed in $tag's checksums.txt, which names the release's archives and packages alone, so it is used as downloaded, unverified."
            echo "$said"
            echo "- $said" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "the previous release is $tag"
          echo "- the previous release is $tag" >> "$GITHUB_STEP_SUMMARY"

      # Over the previous release's Jason Desktop: its own download placed and opened as a person does; this build's
      # install.sh, as an agent runs it, refuses an application before 0.49.0 and changes nothing (docs/INSTALL.md); the
      # person then takes the old application out as to the Trash, and the line run again installs; then taken off from a
      # new terminal.
      - name: This build's install.sh refuses the previous release's Jason Desktop, then installs once it is moved out
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        shell: bash
        env:
          LEG: "This build's install.sh refuses the previous release's Jason Desktop, then installs once it is moved out"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The released install.sh refuses the ad hoc test build, and a copy names its signature=${{ steps.stand-in.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}" "Fetch the previous release=${{ steps.previous.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh over-previous-desktop "$PREVIOUS" "$FEED" "$VERSION" "${{ steps.stand-in.outputs.script }}"
          bash .github/scripts/test-installation-macos.sh uninstall-terminal
          bash .github/scripts/test-installation-macos.sh listing after-over-previous-uninstall
          # The previous release's Desktop's first start ran its own jason install, which wrote the ~/.local/bin lines into a
          # profile it keeps no record of creating; docs/release-and-update.md §9 ("in place of the PATH entry and the
          # executable") says such a file stays: "a file the person had, one they have written into since, and one with no
          # record (an install before 0.49) stay". previous-profiles excuses that file only when empty, and that release's
          # enabled launchd record by name, each said.
          bash .github/scripts/test-installation-macos.sh compare after-over-previous-uninstall before previous-profiles
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # The path every command-line user takes: the previous release's own install, its own jason update apply pinned to
      # this version, and the move into Jason Desktop asserted in full; then the moved installation taken off from a new
      # terminal. JASON_TEST_BUILD_REQUIREMENT is this build's own ad hoc signature, which its move holds the application to.
      - name: Update the previous release's command-line Jason with its own update apply, and move it into Jason Desktop
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        env:
          LEG: "Update the previous release's command-line Jason with its own update apply, and move it into Jason Desktop"
          JASON_PROOF_BUILD: test
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The released install.sh refuses the ad hoc test build, and a copy names its signature=${{ steps.stand-in.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}" "Fetch the previous release=${{ steps.previous.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          export JASON_TEST_BUILD_REQUIREMENT="$(cat "${{ steps.stand-in.outputs.script }}.requirement")"
          bash .github/scripts/test-installation-macos.sh from-previous "$PREVIOUS" "$FEED" "$VERSION"
          bash .github/scripts/test-installation-macos.sh uninstall-terminal
          bash .github/scripts/test-installation-macos.sh listing after-previous-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-previous-uninstall before previous-profiles
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # The one line over a running command-line install of the previous release: its own install, a runtime running, its
      # login start and one campaign; then this build's install.sh as an agent runs it; then taken off from a new terminal.
      - name: Install this build by install.sh over the previous release's running command-line Jason
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        shell: bash
        env:
          LEG: "Install this build by install.sh over the previous release's running command-line Jason"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The released install.sh refuses the ad hoc test build, and a copy names its signature=${{ steps.stand-in.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}" "Fetch the previous release=${{ steps.previous.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh over-running-cli "$PREVIOUS" "$FEED" "$VERSION" "${{ steps.stand-in.outputs.script }}"
          bash .github/scripts/test-installation-macos.sh uninstall-terminal
          bash .github/scripts/test-installation-macos.sh listing after-over-running-cli-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-over-running-cli-uninstall before previous-profiles
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # The previous release's Jason Desktop as its own updater leaves it: its bundle replaced by this build's at the same
      # place, the swap the leg's own (no updater of the old application runs), then this build started; its first start's
      # set-up held by name; then taken off from a new terminal.
      - name: The previous release's Jason Desktop, its bundle replaced by this build's as its updater replaces it, sets the machine up at its first start
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        env:
          LEG: "The previous release's Jason Desktop, its bundle replaced by this build's as its updater replaces it, sets the machine up at its first start"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}" "Fetch the previous release=${{ steps.previous.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh bundle-swap "$PREVIOUS" desktop/dist/mac-arm64/Jason.app "$VERSION"
          bash .github/scripts/test-installation-macos.sh uninstall-terminal account-shell
          bash .github/scripts/test-installation-macos.sh listing after-bundle-swap-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-bundle-swap-uninstall before previous-profiles
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # The same, over a command-line install of the previous release whose runtime runs before the swap: the runtime from
      # the carried jason after the first start, the note of an owed start gone, the old executable the wrapper, the
      # campaigns the same; then taken off from a new terminal.
      - name: The previous release's Jason Desktop and its running command-line Jason, the bundle replaced by this build's as its updater replaces it, set up at its first start
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        env:
          LEG: "The previous release's Jason Desktop and its running command-line Jason, the bundle replaced by this build's as its updater replaces it, set up at its first start"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}" "Fetch the previous release=${{ steps.previous.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh bundle-swap "$PREVIOUS" desktop/dist/mac-arm64/Jason.app "$VERSION" running-cli
          bash .github/scripts/test-installation-macos.sh uninstall-terminal account-shell
          bash .github/scripts/test-installation-macos.sh listing after-bundle-swap-cli-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-bundle-swap-cli-uninstall before previous-profiles
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # Opened from its disk image: this build's application in a read-only image, its jason install refused with
      # install_vanishing_place, the application opened from the image and quit, the image ejected; nothing set up, and the
      # listing held to the machine before, with the two things an application that ran leaves named as expected: its
      # preferences file and what its jason unpacked. The leg's own end removes those two, on every way out of it once it
      # ran, logged and never a proof.
      - name: Open this build from its disk image, then eject it
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "Open this build from its disk image, then eject it"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          trap 'bash .github/scripts/test-installation-macos.sh ran-from-image-end' EXIT
          bash .github/scripts/test-installation-macos.sh vanishing-place desktop/dist/mac-arm64/Jason.app
          bash .github/scripts/test-installation-macos.sh listing after-vanishing-place
          bash .github/scripts/test-installation-macos.sh compare after-vanishing-place before ran-from-image
          bash .github/scripts/test-installation-macos.sh ran-from-image-end
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # The previous release's own uninstall, for what it leaves in launchd's records: said, and its listing kept.
      - name: Say what the previous release's own uninstall leaves in launchd
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "Say what the previous release's own uninstall leaves in launchd"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "The machine before anything is installed=${{ steps.before.outcome }}" "Fetch the previous release=${{ steps.previous.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh previous-removal "$PREVIOUS"
          bash .github/scripts/test-installation-macos.sh listing after-previous-own-removal
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # Among the last before the held step, so that whatever going back does to the machine takes no leg but the one that
      # goes back and moves again, which follows it.
      # Going back from 0.49 (docs/release-and-update.md, "Going back from 0.49"): the previous release installed, one
      # campaign made, moved by its own update; then jason uninstall with no --purge-data and the previous release by its
      # pinned line from the real release page. The campaigns as many, the journal held by id, its version and its ready
      # status; then its own uninstall, and the listing held to the machine before, that release's own launchd records
      # named. The leg above keeps 0.49's own --purge-data uninstall of a moved Mac.
      - name: Move again from the previous release, then go back to it as the update page says
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        env:
          LEG: "Move again from the previous release, then go back to it as the update page says"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The released install.sh refuses the ad hoc test build, and a copy names its signature=${{ steps.stand-in.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}" "Fetch the previous release=${{ steps.previous.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          export JASON_TEST_BUILD_REQUIREMENT="$(cat "${{ steps.stand-in.outputs.script }}.requirement")"
          bash .github/scripts/test-installation-macos.sh way-back "$PREVIOUS" "$FEED" "$VERSION"
          bash .github/scripts/test-installation-macos.sh listing after-way-back-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-way-back-uninstall before previous-own
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # Going back, then moving again: after going back to the previous release as the page says, its own jason update
      # apply moves the install into Jason Desktop again, the wrapper naming no data directory, the campaigns as many; the
      # moved install's own uninstall ends it, and the listing is held to the machine before, the previous release's empty
      # profiles and enabled launchd record aside.
      - name: Go back to the previous release, then move again with its own update
        if: ${{ !cancelled() }}
        timeout-minutes: 35
        shell: bash
        env:
          LEG: "Go back to the previous release, then move again with its own update"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Package jason for osx-arm64 as a pull request does, as a test build=${{ steps.package.outcome }}" "Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}" "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The released install.sh refuses the ad hoc test build, and a copy names its signature=${{ steps.stand-in.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}" "Fetch the previous release=${{ steps.previous.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          export JASON_TEST_BUILD_REQUIREMENT="$(cat "${{ steps.stand-in.outputs.script }}.requirement")"
          bash .github/scripts/test-installation-macos.sh way-back "$PREVIOUS" "$FEED" "$VERSION" again
          bash .github/scripts/test-installation-macos.sh listing after-way-back-again-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-way-back-again-uninstall before previous-profiles
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # Each leg's listing is compared with the machine before as it ends, and a divergence is recorded there; each leg that
      # failed or was not run is recorded by its name. All of it is read here, last, and fails the job with the list.
      - name: The machine after every uninstall is the machine before
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: bash .github/scripts/test-installation-macos.sh held

      - name: Say what this job does not prove
        timeout-minutes: 20
        if: always()
        shell: bash
        run: |
          {
            echo '### What this job does not prove'
            echo "- The release's signature and Gatekeeper: the application here is signed ad hoc, and install.sh is run as a copy naming that signature. The release's proof job runs the released script on the signed, notarized packages, with a quarantined variant."
            echo "- The updater: Squirrel takes only an update signed by the running application's own team, which an ad hoc build has none of. The release's proof job makes no next build either, so a signed build updating to a signed next one is proven by no job."
            echo "- App Management and a person's Terminal: this runner's System Integrity Protection is off and its shell is granted, so a rename or delete of Jason.app passing here says nothing about a person's Mac."
            echo "- The previous release's own Desktop updater reaching this version: it reads only the published releases."
            echo "- The old application's own updater replacing its bundle: its download, its signature check and its swap. The two legs that replace the previous release's bundle make the swap themselves, by ditto and a rename."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the listings
        timeout-minutes: 20
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-union-macos-listings
          path: installation
          if-no-files-found: ignore
          retention-days: 3

