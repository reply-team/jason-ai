# A throwaway workflow on a throwaway branch: the Windows proof job of ci.yml, copied unchanged, run on a push to this
# branch alone, so that it can be tried without running every check. It is never merged.
name: Union trial

on:
  push:
    branches: ['REPLY-54706-ci-proof-trial']

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  # The one switch of the going-back legs of both union jobs: what the page's going back says of the person's own
  # quick-start, moved out of the skills folder before step 3 - put back after step 3 (put-back), or kept out while the
  # previous release is installed (keep-out).
  JASON_PROOF_OWN_SKILL_GOING_BACK: put-back

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      sdk: ${{ steps.dotnet.outputs.sdk-version }}
      full: 'true'
    steps:
      - uses: actions/checkout@v7
      - id: dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: latest
      - id: version
        shell: pwsh
        run: |
          $release = (dotnet msbuild dotnet/src/Jason.App/Jason.App.csproj -getProperty:VersionPrefix).Trim()
          "release=$release" >> $env:GITHUB_OUTPUT

  union-windows:
    name: install.ps1 on windows
    needs: version
    if: needs.version.outputs.full == 'true'
    runs-on: windows-latest
    # A step that waits on a program that never ends is stopped here, not at the six hours a job may otherwise run.
    timeout-minutes: 150
    # Its token reads the repository for the checkout, and nothing more: the previous release is read from its public downloads.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.release }}-ci.${{ github.run_number }}
      OUT: ${{ github.workspace }}\installation
      FEED: ${{ github.workspace }}\feed
      PREVIOUS: ${{ github.workspace }}\previous
    steps:
      - uses: actions/checkout@v7

      # One temporary folder for the whole job: the one a new shell of this account has, where a terminal the legs open,
      # and every program it starts, unpacks and renames aside. A step otherwise reads the runner's own TEMP, which can be
      # another (a per-session folder), and its listings would look where no leg's program wrote. Every listing fails
      # where its step's and a new shell's differ.
      - name: Give the job's steps the temporary folder a new shell of this account has
        timeout-minutes: 5
        shell: pwsh
        run: ./.github/scripts/Test-InstallationWindows.ps1 -Step OneTemporary -Out $env:OUT

      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.version.outputs.sdk }}

      # A package is built at a release's or a candidate's version and never at the -dev one the tree carries, so this
      # job's carries the release this tree is on the way to with a ci word and the run's number, as the desktop job's
      # does. Its upload is named for this job, outside jason-*, so no download of a release's files takes it.
      # A test build (JasonTestBuild, read by MSBuild from the environment): it says so on --version's standard error and
      # in the runtime's report, and its move into the application takes the signer this job names (the stand-in's), as no
      # released build can. Packaged as a release packages it otherwise.
      - name: Package jason for win-x64 as a release does, as a test build
        timeout-minutes: 20
        id: package
        uses: ./.github/actions/package
        env:
          JasonTestBuild: 'true'
        with:
          rid: win-x64
          version: ${{ env.VERSION }}
          artifact: ci-union-win-x64
          retention-days: 3

      # The id of the folder this build's jason extracts its native libraries to under %TEMP%\.net\jason, read with the host's
      # base pointed elsewhere, so that the compares tell this build's extraction folder from the previous release's.
      - name: Read the folder this build's jason extracts its native libraries to
        id: extracted
        timeout-minutes: 20
        shell: pwsh
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
        run: ./.github/scripts/Test-InstallationWindows.ps1 -Step Extracted -Out $env:OUT -Executable (Join-Path $env:GITHUB_WORKSPACE $env:EXECUTABLE)

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build Jason Desktop around it as a test build
        id: desktop-build
        timeout-minutes: 20
        shell: pwsh
        working-directory: desktop
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          JASON_DESKTOP_TEST_BUILD: '1'
        run: ../.github/scripts/Build-DesktopTestBuild.ps1 -Rid win-x64 -Version $env:VERSION -Executable (Join-Path $env:GITHUB_WORKSPACE $env:EXECUTABLE)

      # The feed a release would carry for this platform: the archive and its fragment, the skills' package, the installer,
      # its block map and its update feed, with the manifest and the checksums written over them as a release writes them.
      - name: Assemble the feed the way a release is assembled
        id: feed
        timeout-minutes: 20
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:FEED | Out-Null
          Copy-Item artifacts/release/* $env:FEED
          Copy-Item desktop/dist/jason-desktop-windows-x64-setup.exe, desktop/dist/jason-desktop-windows-x64-setup.exe.blockmap, desktop/dist/latest.yml $env:FEED
          ./.github/scripts/Write-SkillsArchive.ps1 -Tree . -Archive (Join-Path $env:FEED 'jason-skills.zip') -Repository https://github.com/reply-team/jason-ai -Ref ("v" + ($env:VERSION -replace '-.*$', '')) -Commit "${{ github.sha }}"
          ./.github/scripts/Write-Manifest.ps1 -Version $env:VERSION -Directory $env:FEED -Require win-x64 -Plugins jason-skills.zip,jason-desktop-windows-x64-setup.exe,jason-desktop-windows-x64-setup.exe.blockmap,latest.yml
          Get-Content (Join-Path $env:FEED 'manifest.json')

      # The released script, unchanged, holds the test build to the release's signer and refuses it, every run: the
      # check the rest of this job steps past is live.
      - name: The released install.ps1 refuses the unsigned test build
        timeout-minutes: 20
        shell: pwsh
        env:
          JASON_Update__CheckEnabled: 'false'
        run: |
          $said = (& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "`$env:JASON_INSTALL_FEED = '$env:FEED'; & ./install/install.ps1" 2>&1 | ForEach-Object { "$_" }) -join "`n"
          $code = $LASTEXITCODE
          Write-Host $said
          if ($code -eq 0) { throw "the released install.ps1 installed an unsigned setup" }
          if (-not ($said -replace '\s+', '').Contains('doesnotcarryavalidsignature')) { throw "the released install.ps1 failed for another reason than the signature" }
          if (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'Programs\jason-desktop')) { throw "the refused install left the application's folder" }
          # The script's own exit code, 1, was the pass; the step says how it ended itself.
          exit 0

      # The stand-in for the release's signer, on this runner alone: a code-signing certificate made here, its key never
      # leaving this runner, trusted in this machine's root store, signs the test build's setup, so the script's own check -
      # a valid signature, by the signer it names - runs as it runs on a release. The released script refuses that signer
      # too; the copy the next steps run differs from it by the one line naming the signer, counted, and lives in the
      # runner's temporary directory, never uploaded. Nothing of this runs anywhere but a GitHub-hosted runner.
      - name: Sign the test build with this runner's own certificate, and copy install.ps1 to name it
        timeout-minutes: 20
        id: stand-in
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "This step trusts a certificate in the machine's root store, and runs on a GitHub-hosted runner alone." }
          $standIn = 'Jason CI test build'
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=$standIn" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          $public = Join-Path $env:RUNNER_TEMP 'stand-in.cer'
          Export-Certificate -Cert $certificate -FilePath $public | Out-Null
          Import-Certificate -FilePath $public -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $setup = Join-Path $env:FEED 'jason-desktop-windows-x64-setup.exe'
          $signed = Set-AuthenticodeSignature -FilePath $setup -Certificate $certificate -HashAlgorithm SHA256
          if ($signed.Status -ne 'Valid') { throw "the stand-in signature is $($signed.Status)" }
          ./.github/scripts/Write-Manifest.ps1 -Version $env:VERSION -Directory $env:FEED -Require win-x64 -Plugins jason-skills.zip,jason-desktop-windows-x64-setup.exe,jason-desktop-windows-x64-setup.exe.blockmap,latest.yml

          # The released script refuses the stand-in's signature by its signer's name.
          $said = (& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "`$env:JASON_INSTALL_FEED = '$env:FEED'; & ./install/install.ps1" 2>&1 | ForEach-Object { "$_" }) -join "`n"
          $code = $LASTEXITCODE
          Write-Host $said
          if ($code -eq 0 -or -not ($said -replace '\s+', '').Contains(("is signed by '$standIn', not by ReplyApp Inc." -replace '\s+', ''))) { throw "the released install.ps1 did not refuse the stand-in signer by name" }

          # The copy: the one line naming the signer, and nothing else.
          $released = @(Get-Content -LiteralPath install/install.ps1)
          $line = "        `$signer = 'ReplyApp Inc.'"
          if (@($released | Where-Object { $_ -ceq $line }).Count -ne 1) { throw "install.ps1 does not name its signer in exactly one line '$line'" }
          $copy = @($released | ForEach-Object { if ($_ -ceq $line) { "        `$signer = '$standIn'" } else { $_ } })
          $changed = @(for ($at = 0; $at -lt $released.Count; $at++) { if ($released[$at] -cne $copy[$at]) { $at } })
          if ($copy.Count -ne $released.Count -or $changed.Count -ne 1) { throw "the copy differs from install.ps1 in $($changed.Count) line(s), not one" }
          $script = Join-Path $env:RUNNER_TEMP 'install-stand-in-signer.ps1'
          Set-Content -LiteralPath $script -Value $copy -Encoding ascii
          "script=$script" >> $env:GITHUB_OUTPUT
          "signer=$standIn" >> $env:GITHUB_OUTPUT
          exit 0

      # The account's Path as an ordinary account has it: ExpandString, with an entry spelled through a variable. Every
      # install after it holds both by name: the kind after is the kind before, and the entry is still unexpanded.
      - name: Give the account's Path the shape an ordinary account has, ExpandString with an entry spelled through a variable
        id: path-shape
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/scripts/Test-InstallationWindows.ps1 -Step PathShape -Out $env:OUT

      # A person's machine as an agent finds it: both agent hosts present, and a skill of the person's own under a name
      # Jason ships. Then the listing everything after is compared with, and every leg starts from.
      - name: The machine before anything is installed
        id: before
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE '.claude'), (Join-Path $env:USERPROFILE '.codex'), (Join-Path $env:USERPROFILE '.agents\skills\quick-start') | Out-Null
          [IO.File]::WriteAllText((Join-Path $env:USERPROFILE '.agents\skills\quick-start\SKILL.md'), "a person's own skill`n")
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name before

      # From here on no leg's failure stops the legs after it: each runs unless the job was cancelled, begins from the
      # machine before (one an earlier failed leg left is taken off by the product's own uninstalls, and said so) or says
      # it was not run and which step it needed, and the job fails at its end, in the last step, with the list.
      - name: Install as an agent does, with install.ps1
        id: install
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Install as an agent does, with install.ps1"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Install -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Script "${{ steps.stand-in.outputs.script }}"
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      - name: Uninstall from a new terminal
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Uninstall from a new terminal"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Needs 'Install as an agent does, with install.ps1=${{ steps.install.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromTerminal -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-terminal-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-terminal-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # jason uninstall from a terminal, with the window opened once the verb is past its own check: the waiter's silent
      # uninstaller finds the application and ends 3, and the waiter runs it once more without /S, which asks the person.
      # That run is seen and ended unanswered; Installed apps then takes the application off.
      - name: Uninstall from a terminal while the window opens, so the waiter asks
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Uninstall from a terminal while the window opens, so the waiter asks"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallWaiterShown -Out $env:OUT -Feed $env:FEED -Script "${{ steps.stand-in.outputs.script }}"
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromInstalledApps -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-waiter-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-waiter-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The line every real install takes reads its feed over the web, in Windows PowerShell 5.1: the same feed served on
      # this machine, and install.ps1 given its address. The role skills come from the skills beside the application's
      # jason whatever the feed, and a runtime over them says role_skills is ok.
      - name: Install from a feed served on this machine, over the web in Windows PowerShell 5.1, and uninstall from a new terminal
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Install from a feed served on this machine, over the web in Windows PowerShell 5.1, and uninstall from a new terminal"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step ServedFeed -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Script "${{ steps.stand-in.outputs.script }}"
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromTerminal -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-served-feed-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-served-feed-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The pinned line: a pin naming another version refused, then -Version naming this one, asserted as the unpinned
      # install is, and taken off from a new terminal.
      - name: Install by the pinned line, and uninstall from a new terminal
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Install by the pinned line, and uninstall from a new terminal"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Install -Pinned -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Script "${{ steps.stand-in.outputs.script }}"
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromTerminal -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-pinned-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-pinned-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The previous release, named: these legs begin in the world before one installation, and v0.48.5 is the last release
      # of that world, whose install puts a command-line Jason of its own where every leg that starts from a previous
      # release expects one. Never the latest published release: once 0.49.0 is published that is a release that installs
      # Jason Desktop alone, and every such leg would fail on it. Its files come from its public downloads. No token: the
      # repository's releases are public.
      - name: Fetch the previous release
        id: previous
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          PREVIOUS_RELEASE: v0.48.5
        run: |
          $release = "v$($env:VERSION -replace '-.*$', '')"
          $tag = $env:PREVIOUS_RELEASE
          if ($tag -ceq $release) { throw "the previous release named, $tag, is the one this tree builds: there is no previous release to update from here" }
          New-Item -ItemType Directory -Force -Path $env:PREVIOUS | Out-Null
          # Every file fetched is in one of two lists, by name. The verified ones are held to checksums.txt: a file with no
          # line there, or a digest that differs, fails. checksums.txt names the release's archives and packages alone, so
          # the others are used as downloaded, each said unverified; one checksums.txt comes to list fails until it is moved.
          $verified = @('jason-win-x64.zip', 'jason-desktop-windows-x64-setup.exe')
          $unverifiable = @('install.ps1', 'manifest.json')
          foreach ($name in @('checksums.txt') + $verified + $unverifiable) {
            Invoke-WebRequest -Uri "https://github.com/reply-team/jason-ai/releases/download/$tag/$name" -OutFile (Join-Path $env:PREVIOUS $name) -UseBasicParsing -TimeoutSec 600
          }
          $listed = @{}
          foreach ($line in Get-Content (Join-Path $env:PREVIOUS 'checksums.txt')) {
            $hash, $name = $line -split '  ', 2
            if ($name) { $listed[$name] = $hash }
          }
          foreach ($name in $verified) {
            if (-not $listed.ContainsKey($name)) { throw "$name has no line in $tag's checksums.txt" }
            if ((Get-FileHash -LiteralPath (Join-Path $env:PREVIOUS $name) -Algorithm SHA256).Hash -ne $listed[$name]) { throw "$name does not match $tag's checksums.txt" }
            Write-Host "$name matches $tag's checksums.txt"
          }
          foreach ($name in $unverifiable) {
            if ($listed.ContainsKey($name)) { throw "$name is now listed in $tag's checksums.txt: it belongs with the verified files" }
            $said = "$name is not listed in $tag's checksums.txt, which names the release's archives and packages alone, so it is used as downloaded, unverified."
            Write-Host $said
            "- $said" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          Write-Host "the previous release is $tag"
          "- the previous release is $tag" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Install this build over the previous release's Jason Desktop, as its updater runs an installer
        id: over-previous
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Install this build over the previous release's Jason Desktop, as its updater runs an installer"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step InstallOverPrevious -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Previous $env:PREVIOUS
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      - name: Uninstall from Installed apps
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Uninstall from Installed apps"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Needs 'Install this build over the previous release''s Jason Desktop, as its updater runs an installer=${{ steps.over-previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromInstalledApps -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-installed-apps-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-installed-apps-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The path every command-line user takes: the previous release's own install, its own jason update apply pinned to
      # this version, and the move into Jason Desktop asserted in full; then the moved installation taken off from a new
      # terminal. JASON_TEST_BUILD_SIGNER is the stand-in's name, which this test build's move holds the setup to.
      - name: Update the previous release's command-line Jason with its own update apply, and move it into Jason Desktop
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: pwsh
        env:
          LEG: "Update the previous release's command-line Jason with its own update apply, and move it into Jason Desktop"
          JASON_Update__CheckEnabled: 'false'
          JASON_PROOF_BUILD: test
          JASON_TEST_BUILD_SIGNER: ${{ steps.stand-in.outputs.signer }}
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step FromPrevious -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Previous $env:PREVIOUS
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromTerminal -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-previous-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-previous-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The previous release's command-line Jason, a runtime running and its logon start registered, one campaign made,
      # then this build's unpinned line run over it as an agent runs it, while that runtime runs: the old runtime stopped
      # before the install is retired, a runtime again from the carried jason, the Path, a new shell, the campaigns the same
      # by id; then taken off from a new terminal, and the listing held to the machine before.
      - name: Run this build's line over the previous release's command-line Jason while its runtime runs
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: pwsh
        env:
          LEG: "Run this build's line over the previous release's command-line Jason while its runtime runs"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step InstallOverCommandLine -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Previous $env:PREVIOUS -Script "${{ steps.stand-in.outputs.script }}"
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromTerminal -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-line-over-command-line-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-line-over-command-line-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The previous release's Jason Desktop by its own setup and its command-line Jason by its own install.ps1, side by side
      # and both on the Path; then this build's setup run as an update runs it: one installation, the command-line one
      # retired into the application, the Path naming the bundle folder once, a new shell finding the carried jason; then
      # taken off by the uninstall Installed apps runs, and the listing held to the machine before.
      - name: Install this build as an update over the previous release's Jason Desktop and its command-line Jason side by side
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: pwsh
        env:
          LEG: "Install this build as an update over the previous release's Jason Desktop and its command-line Jason side by side"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step OverBothPrevious -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Previous $env:PREVIOUS
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromInstalledApps -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-over-both-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-over-both-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The next version, packaged and built as a test build the same way at this version and one: its own jason, its
      # setup, its update feed and a manifest naming it, in a folder of its own that the update below reads.
      - name: Package jason at the next version
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        id: next
        uses: ./.github/actions/package
        with:
          rid: win-x64
          version: ${{ env.VERSION }}.1
          artifact: ci-union-win-x64-next
          retention-days: 3

      - name: Build the next version as a test build
        id: next-build
        if: ${{ !cancelled() && steps.next.outcome == 'success' }}
        timeout-minutes: 20
        shell: pwsh
        working-directory: desktop
        env:
          EXECUTABLE: ${{ steps.next.outputs.executable }}
          NEXT: ${{ env.VERSION }}.1
          JASON_DESKTOP_TEST_BUILD: '1'
        run: |
          ../.github/scripts/Build-DesktopTestBuild.ps1 -Rid win-x64 -Version $env:NEXT -Executable (Join-Path $env:GITHUB_WORKSPACE $env:EXECUTABLE)
          ../.github/scripts/Test-InstallationWindows.ps1 -Step Extracted -Out $env:OUT -Executable (Join-Path $env:GITHUB_WORKSPACE $env:EXECUTABLE)
          $next = Join-Path $env:GITHUB_WORKSPACE 'next'
          New-Item -ItemType Directory -Force -Path $next | Out-Null
          Copy-Item ../artifacts/release/jason-win-x64.zip, ../artifacts/release/jason-win-x64.zip.sha256, ../artifacts/release/jason-win-x64.fragment.json $next
          Copy-Item dist/jason-desktop-windows-x64-setup.exe, dist/jason-desktop-windows-x64-setup.exe.blockmap, dist/latest.yml $next
          Copy-Item (Join-Path $env:FEED 'jason-skills.zip') $next
          ../.github/scripts/Write-Manifest.ps1 -Version $env:NEXT -Directory $next -Require win-x64 -Plugins jason-skills.zip,jason-desktop-windows-x64-setup.exe,jason-desktop-windows-x64-setup.exe.blockmap,latest.yml
          Get-Content (Join-Path $next 'manifest.json')

      # This build's silent setups over the previous release (desktop/installer/uninstall.nsh): over a window that never
      # quits, 3 at the include's bound and the next setup not blocked; plain /S over a window and over the tray, 3; the old
      # application quitting 20 s late, 0; the old uninstaller refusing, 2. None may show a window, and each sub-leg runs
      # whatever the one before it did. Then this build is put back over the previous release by its own silent setup, so
      # Installed apps takes this build off again, and the listing is held to the machine before.
      - name: Install this build silently over the previous release
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        shell: pwsh
        env:
          LEG: "Install this build silently over the previous release"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step SilentUpdateLegs -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Previous $env:PREVIOUS
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromInstalledApps -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-silent-setups-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-silent-setups-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      - name: Read the module path Windows PowerShell rebuilds from an empty one
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Read the module path Windows PowerShell rebuilds from an empty one"
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Reading
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step ModulePath -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The carried jason update apply on a real install of this test build: first refused by an open window, which takes
      # no request naming a feed; then to the next one with no window open, handed to Jason Desktop and finished by the new
      # jason, not refused as elevated on this runner. A second reader holds the request's file as the Desktop writes it.
      # The test build's updater checks no publisher.
      - name: Update the test build from a terminal with jason update apply
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Update the test build from a terminal with jason update apply"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Package jason at the next version=${{ steps.next.outcome }}', 'Build the next version as a test build=${{ steps.next-build.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UpdateApply -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Script "${{ steps.stand-in.outputs.script }}" -Next (Join-Path $env:GITHUB_WORKSPACE 'next')
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-update-apply-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-update-apply-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # Among the last before the held step, so that whatever going back does to the machine takes no leg but the one that
      # goes back and moves again, which follows it.
      # Going back from 0.49 (docs/release-and-update.md, "Going back from 0.49"): the previous release installed, one
      # campaign made, moved by its own update; then jason uninstall with no --purge-data and the previous release by its
      # pinned line from the real release page. The campaigns as many, the journal held by id, its version and its ready
      # status; then its own uninstall, and the listing held to the machine before. The leg above keeps 0.49's own
      # --purge-data uninstall of a moved machine.
      - name: Move again from the previous release, then go back to it as the update page says
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: pwsh
        env:
          LEG: "Move again from the previous release, then go back to it as the update page says"
          JASON_Update__CheckEnabled: 'false'
          JASON_TEST_BUILD_SIGNER: ${{ steps.stand-in.outputs.signer }}
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step WayBack -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Previous $env:PREVIOUS
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-way-back-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-way-back-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # Going back, then moving again: after going back to the previous release as the page says, its own jason update
      # apply moves the install into Jason Desktop again, the Path naming the bundle folder once, the campaigns as many; the
      # moved install's own uninstall ends it, and the listing is held to the machine before.
      - name: Go back to the previous release, then move again with its own update
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        shell: pwsh
        env:
          LEG: "Go back to the previous release, then move again with its own update"
          JASON_Update__CheckEnabled: 'false'
          JASON_TEST_BUILD_SIGNER: ${{ steps.stand-in.outputs.signer }}
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Package jason for win-x64 as a release does, as a test build=${{ steps.package.outcome }}', 'Build Jason Desktop around it as a test build=${{ steps.desktop-build.outcome }}', 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'Sign the test build with this runner''s own certificate, and copy install.ps1 to name it=${{ steps.stand-in.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step WayBack -Again -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Previous $env:PREVIOUS
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-way-back-again-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-way-back-again-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # Each leg's listing is compared with the machine before as it ends, and a divergence is recorded there; each leg that
      # failed or was not run is recorded by its name. All of it is read here, last, and fails the job with the list.
      - name: The machine after every uninstall is the machine before
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/scripts/Test-InstallationWindows.ps1 -Step Held -Out $env:OUT

      - name: Say what this job does not prove
        timeout-minutes: 20
        if: always()
        shell: pwsh
        run: |
          @(
            '### What this job does not prove',
            '- The release''s signer: the setup here is signed by a certificate made on this runner, and install.ps1 is run as a copy naming it. The release''s proof job runs the released script on the signed packages.',
            '- The updater''s publisher check, and window_open: this build''s updater checks no publisher, and with a window open only the refusal of a request naming a feed is seen.',
            '- SmartScreen and the mark of the web on a setup a browser downloaded, and a standard account: the runner''s user is an administrator whose downloads carry no mark.',
            '- The previous release''s own Desktop updater reaching this version: it reads only the published releases; this job runs its installer as that updater would.',
            '- The start --force-run makes after the update over both previous installs: that leg runs the setup without --force-run and starts the application itself; the install over the previous release''s Jason Desktop is the leg that runs the setup with --force-run.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Keep the listings
        timeout-minutes: 20
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-union-windows-listings
          path: installation
          if-no-files-found: ignore
          retention-days: 3

