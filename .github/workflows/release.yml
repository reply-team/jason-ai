# A tag named v<version> builds the release: three native runners, each packaging one platform through the same action
# ci.yml runs on every pull request, and smoke-testing what it published, the Linux one first running the critical tier
# at the tag, and one job that archives the Reply plugin's package from the tag's tree; then one job — the only one that
# holds the publication token — assembles the manifest and the checksums, creates the release as a draft in
# reply-team/jason-ai, and opens the pull request that brings that repository to this version. Merging that pull request
# is what tags the release there and publishes it.
#
# The button (workflow_dispatch) builds the same draft, the button's draft, and stops there: nothing is tagged and no
# pull request is opened, so it leaves nothing behind once its draft is deleted. With dry_run it does not make the draft
# either: every job runs, the release is assembled and the pull request's body written, and both are handed back as an
# artifact of the run, while the publishing job holds this run's own read-only token in place of the publication token.
#
# A release's own notes are RELEASE-NOTES.md at the root, written for the release they name. The version job reads
# the file before anything is built: a tag whose file is missing, untitled or names another version stops there, and
# the button's run then carries the template alone.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to build, without the v (0.2.0, 1.0.0-rc.1). Nothing is tagged and no pull request is opened; the result is a draft in reply-team/jason-ai unless dry_run is set.'
        required: true
        type: string
      dry_run:
        description: 'Build and assemble everything, make no draft, and hand the assembled release and the pull request''s body back as an artifact of this run.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  version:
    name: The version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      sdk: ${{ steps.dotnet.outputs.sdk-version }}
    steps:
      - id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          # The one place the version is decided; every job below is told it. A tag is `v` and a version, the
          # button gives the version itself, and anything else — v1.2, v01.2.3, a tag carrying build metadata —
          # stops the workflow here, before a runner has built anything. The build stamps its own metadata.
          $given = if ($env:EVENT -eq 'workflow_dispatch') { $env:REQUESTED } else { $env:TAG }
          $version = if ($env:EVENT -eq 'workflow_dispatch') { $given } elseif ($given -clike 'v*') { $given.Substring(1) } else { '' }

          $identifier = '(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)'
          if ($version -cnotmatch "^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-$identifier(?:\.$identifier)*)?$") {
            throw "'$given' is not a version this workflow builds: v0.2.0 or v1.0.0-rc.1 as a tag, 0.2.0 from the button."
          }

          Write-Host "version -> $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # And the SDK every platform builds on: the newest the 10.0 channel has released, resolved here once and handed on
      # as the sdk output, so the three platforms of one release build on one SDK. The repository's action is the one
      # place that says what the newest is, and it resolves the SDK by installing it, so this job checks the tree out and
      # installs .NET, which it builds nothing with.
      - uses: actions/checkout@v7

      - id: notes
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A release's own notes, read before anything is built. The file opens with a comment to whoever writes it,
          # then `# Jason <version>`. The version after a release leaves it naming the release it was written for, so
          # a tag whose file is missing, untitled or names another version stops here: a stale file can never ship.
          # The button's run carries the template alone instead and says why. The notes output tells the publishing
          # job whether to put the file into the body. Get-Content gives nothing at all for an empty file, not even
          # a string, so `?? ''` makes it the empty text it is.
          $why = $null
          if (-not (Test-Path -LiteralPath RELEASE-NOTES.md)) {
            $why = 'There is no RELEASE-NOTES.md'
          } else {
            $text = [regex]::Replace(((Get-Content -LiteralPath RELEASE-NOTES.md -Raw) ?? '').ReplaceLineEndings("`n"), '(?s)^\s*<!--.*?-->', '').TrimStart()
            $title = $text.Split("`n")[0]
            if ($title -cmatch '^# Jason (\S+)$') {
              if ($Matches[1] -cne $env:VERSION) { $why = "RELEASE-NOTES.md names $($Matches[1])" }
            } else {
              $why = "RELEASE-NOTES.md does not open with '# Jason <version>'"
            }
          }

          if ($null -eq $why) {
            Write-Host "RELEASE-NOTES.md names ${env:VERSION}: the release carries its own notes."
            "notes=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($env:EVENT -eq 'push') { throw "$why; this tag is v$env:VERSION, and a tag ships its own notes." }

          Write-Host "::warning title=Release notes::$why; this run is v$env:VERSION, so it carries the template alone."
          "notes=false" >> $env:GITHUB_OUTPUT

      - id: dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: latest

  build:
    name: ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.version.outputs.sdk }}

      # Restore, build and the critical tier below run on Linux alone; the package action restores and builds what it
      # publishes on every platform by itself.
      - name: Restore
        if: matrix.rid == 'linux-x64'
        run: dotnet restore runtime/Jason.slnx

      # One version through build, test and publish, so that the Linux tier runs under the version every archive carries.
      - name: Build (warnings are errors)
        if: matrix.rid == 'linux-x64'
        run: dotnet build runtime/Jason.slnx --configuration Release --no-restore -p:Version=${{ needs.version.outputs.version }}

      # The whole suite ran on this tree, on every platform, on the release's pull request into main, and again under the
      # bare version on Linux; the tag is that merge, so its tree is the one those runs passed, and the version the tag
      # stamps differs from what the platform legs built. The SDK is resolved again at the tag, by the version job above,
      # so a channel release between the pull request's run and the tag is a second difference: an SDK, and the runtime
      # patch the executable carries, that the whole suite never ran on. What runs here, before anything is published, is
      # the critical tier on Linux, stamped with the version the tag names, and it is the run on that SDK: a release is a
      # build of a tree the suite passed, whose tier passes under its own version, on the SDK it is built with. The same
      # tier on Windows and macOS would repeat a run this tree already passed there, on the dearest runners, so those two
      # legs go straight to packaging.
      - name: Test the critical tier (offline)
        if: matrix.rid == 'linux-x64'
        run: dotnet test --solution runtime/Jason.slnx --configuration Release --no-build -p:Version=${{ needs.version.outputs.version }} -- --filter-trait "Category=Critical"

      - name: Package
        id: package
        uses: ./.github/actions/package
        with:
          rid: ${{ matrix.rid }}
          version: ${{ needs.version.outputs.version }}

      - name: Smoke-test the published executable
        shell: pwsh
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          VERSION: ${{ needs.version.outputs.version }}
          JASON_Update__CheckEnabled: 'false'
        run: |
          $exe = $env:EXECUTABLE
          $env:JASON_DATA_DIR = Join-Path ([IO.Path]::GetTempPath()) "jason-release-smoke"

          $elapsed = Measure-Command { & $exe --version | Tee-Object -Variable version }
          if ($LASTEXITCODE -ne 0) { throw "jason --version exited with $LASTEXITCODE" }
          Write-Host "jason --version -> $version ($([int]$elapsed.TotalMilliseconds) ms cold start)"

          # What it prints is the tag's version plus build metadata (+<commit>), which SemVer says to ignore.
          if (($version -split '\+')[0] -ne $env:VERSION) { throw "jason --version says '$version', and the tag says $env:VERSION" }

          $elapsed = Measure-Command { & $exe runtime status | Tee-Object -Variable status }
          $statusExit = $LASTEXITCODE
          Write-Host "jason runtime status -> exit $statusExit in $([int]$elapsed.TotalMilliseconds) ms: $status"
          if ($statusExit -ne 3) { throw "expected exit code 3 without a running runtime, got $statusExit" }
          if ($status -notmatch '"code":"no_descriptor"') { throw "expected a no_descriptor error envelope" }

          # And it opens the database. Everything above passes on a build that cannot: a single-file publish
          # leaves SQLite's native library beside the executable unless it is told to bundle it, `--version`
          # and a status with no runtime never touch it, and the archive carries the executable alone — so the
          # one build this whole wave exists to deliver would have gone out green. Starting the runtime is what
          # loads it.
          & $exe runtime start | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime start exited with $LASTEXITCODE; the published executable cannot open its database" }

          & $exe runtime status | Tee-Object -Variable running | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime status exited with $LASTEXITCODE while a runtime was running" }
          if ($running -notmatch '"applied_migrations":\["') { throw "runtime status reported no applied migrations: $running" }
          Write-Host "the runtime started, migrated and answered"

          & $exe runtime stop | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime stop exited with $LASTEXITCODE" }

          # The last command of this step is expected to exit 3, and pwsh would hand that on as the step's
          # own exit code. Everything asserted above passed, so the step succeeded.
          exit 0

  plugin:
    name: The Reply plugin's package
    needs: version
    runs-on: ubuntu-latest
    # Once per release, not once per platform: the package is JavaScript, the same on every machine. Archived from the
    # tag's own checkout, whose line endings .gitattributes fixes, so the archive unpacks to the content digest of the
    # package at the tag; the release's pull request ran the test that holds the script to that digest on this tree, on every
    # platform.
    steps:
      - uses: actions/checkout@v7

      - name: Archive plugins/reply
        shell: pwsh
        run: ./.github/scripts/Write-PluginArchive.ps1 -Package plugins/reply -Archive artifacts/release/jason-plugin-reply.zip

      # Named so that the publishing job's download of jason-* brings it beside the archives, where the checksums are
      # written.
      - uses: actions/upload-artifact@v7
        with:
          name: jason-plugin-reply
          path: artifacts/release/jason-plugin-reply.zip
          if-no-files-found: error

  ui:
    name: The UI's package
    needs: version
    runs-on: ubuntu-latest
    # Once per release, like the plugin's package, and built here rather than taken from CI: CI's zip carries the -dev
    # version and is kept fourteen days, and `jason status` compares the default UI's version with the runtime's. The
    # page's checks and tests run on the tag's tree before it is packaged, as the runtime's do before it is archived.
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Check (types, lint, format)
        run: npm run check

      - name: Unit and screen tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package with the release's version
        env:
          JASON_VERSION: ${{ needs.version.outputs.version }}
        run: npm run package

      # Named so that the publishing job's download of jason-* brings it beside the archives, where the checksums are
      # written.
      - uses: actions/upload-artifact@v7
        with:
          name: jason-ui
          path: ui/artifacts/jason-ui.zip
          if-no-files-found: error

  release:
    name: Assemble and publish
    needs: [version, build, plugin, ui]
    runs-on: ubuntu-latest
    # The only job that holds the publication token, which reaches the public repository and nothing else. It builds
    # and runs nothing that was built, so a test on a matrix runner cannot publish anything, and nothing is published
    # when a matrix leg or the plugin's job failed. It writes nothing here but a dry run's artifact: the draft release,
    # the branch and the pull request are all in reply-team/jason-ai. Under a dry run it holds this run's own read-only
    # token in place of the publication token: the job's token and the public checkout's are this run's own, which
    # reads reply-team/jason-ai because that repository is public and can write nothing there, so a step that forgot
    # its condition still could not publish.
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ inputs.dry_run && github.token || secrets.PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: jason-*
          merge-multiple: true
          path: artifacts/release

      - name: Write the manifest and the checksums
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The three fragments become manifest.json — what a running Jason reads to learn this release exists —
          # and checksums.txt, which lists the plugin's and the UI's packages after the archives; the manifest names the
          # plugin's under its plugins. A platform or a package missing from the download, or an archive that no
          # longer hashes to what its fragment says, stops the release here. The notes are read where the release is
          # published, which is the public repository whichever repository built it. Every release from 0.20.0 names
          # 0.19.0 as the oldest version that updates to it in one apply: 0.19.0 is the first applier that loads what it
          # needs and hands over to the new executable, so an older build goes through it first. The floor moves only
          # when an applier change raises it. The plugin's entry is the tag's digest list, whose last line is the package
          # this release publishes, so nothing is built or hashed here to say which package that is.
          ./.github/scripts/Write-Manifest.ps1 -Version $env:VERSION -Directory artifacts/release -Require win-x64,linux-x64,osx-arm64 -Plugins jason-plugin-reply.zip,jason-ui.zip -ReleaseNotesUrl "https://jasonharness.ai/releases/tag/v$env:VERSION" -MinUpgradeFrom 0.19.0 -PluginDigests plugins/reply.digests
          Get-Content artifacts/release/manifest.json
          Get-Content artifacts/release/checksums.txt

      - name: Write the notes
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          # The template opens with a comment addressed to whoever edits the template. Markdown hides an HTML
          # comment when a page is rendered, but a release body is read raw as well - by the API, by
          # `gh release view`, in the notification mail - so what ships carries none of them.
          $notes = (Get-Content .github/release-notes-template.md -Raw).ReplaceLineEndings("`n").Replace('{{version}}', $env:VERSION)
          $notes = [regex]::Replace($notes, '(?s)<!--.*?-->', '').TrimStart()

          # The release's own notes stand where the template says {{notes}}, after its opening paragraph, without their
          # comments and without their first line, `# Jason <version>`, which the release's title says already, and
          # with {{version}} filled in as the template's is. The version job decided whether they are this version's;
          # when they are not, the template stands alone.
          $own = ''
          if ($env:NOTES -eq 'true') {
            $own = [regex]::Replace(((Get-Content -LiteralPath RELEASE-NOTES.md -Raw) ?? '').ReplaceLineEndings("`n"), '(?s)<!--.*?-->', '').TrimStart()
            $own = ($own -replace '^[^\n]*\n?', '').Trim().Replace('{{version}}', $env:VERSION)
          }
          $notes = if ($own) { $notes.Replace('{{notes}}', $own) } else { [regex]::Replace($notes, '\{\{notes\}\}\n+', '') }
          Set-Content artifacts/release/notes.md -Value $notes -NoNewline

      - name: Check out the public repository
        uses: actions/checkout@v7
        with:
          repository: reply-team/jason-ai
          path: public
          token: ${{ inputs.dry_run && github.token || secrets.PUBLISH_TOKEN }}

      - name: Make it what this release publishes
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The public tree becomes the open set at this tag, LICENSE's MIT block, VERSION and the public repository's
          # own files - a function of the tag, whatever its main held before. Staged and not committed: the button
          # stops at the draft, and only a tag commits it, in the pull request's step.
          ./.github/scripts/Publish-OpenSet.ps1 -Source . -Target public -Version $env:VERSION
          git -C public add -A
          if ($LASTEXITCODE -ne 0) { throw "git add exited with $LASTEXITCODE" }

      - name: Write the pull request's body
        id: body
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Printed on every run, the button's included, so that a dry run shows the pull request a tag would open.
          ./.github/scripts/Write-PublishBody.ps1 -Target public -Version $env:VERSION -Body artifacts/publish/body.md
          Get-Content artifacts/publish/body.md

      # What a dry run hands back to read: the archives, the packages, the manifest, the checksums and the notes as the
      # draft would have carried them, and the pull request's body a tag would have opened. Kept for a week: the
      # archives and packages are this run's other artifacts as well.
      - name: Keep what a dry run assembled
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-v${{ needs.version.outputs.version }}
          path: |
            artifacts/release
            artifacts/publish/body.md
          if-no-files-found: error
          retention-days: 7

      - name: Create the draft release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The release is created in the public repository, as a draft, before the pull request that announces it:
          # merging that pull request is what tags the release there and publishes it. A tag and the button make the
          # same draft. Never --latest here: which release is latest is decided when one is published, by the public
          # repository's own workflow.
          #
          # [string[]] and not a bare assignment: PowerShell unrolls a one-element array assigned from an `if`
          # into a scalar string, and `+=` on a string concatenates rather than appends.
          $repository = 'reply-team/jason-ai'
          [string[]] $how = '--draft', '--target', 'main'

          # A version carrying a pre-release part is published as one, so that it never becomes the latest release:
          # `latest` is what the default update feed advertises and what both install one-liners download. The rule
          # is the version's, not the event's: a candidate is a candidate however it arrived.
          if ($env:VERSION -clike '*-*') { $how += '--prerelease' }

          # A draft this version left behind - an earlier button's draft of the same number, inspected and pressed
          # again - holds the name that is about to be created, so it is deleted first, and only if it really is
          # a draft. A published release of this version is somebody's installed software: the job stops before it
          # creates anything. No --cleanup-tag; a draft has no tag to clean up.
          $existing = $null
          try {
            $existing = gh release view "v$env:VERSION" -R $repository --json isDraft --jq '.isDraft' 2>$null
            if ($LASTEXITCODE -ne 0) { $existing = $null }
          } catch {
            $existing = $null
          }
          if ($null -ne $existing -and $existing -ne 'true') {
            throw "v$env:VERSION is already published in $repository. A published release is somebody's installed software, and this job replaces only a draft."
          }
          if ($existing -eq 'true') {
            Write-Host "Deleting the draft of v$env:VERSION that an earlier run left behind."
            gh release delete "v$env:VERSION" -R $repository --yes
            if ($LASTEXITCODE -ne 0) { throw "gh release delete exited with $LASTEXITCODE" }
          }

          # gh names an asset by its file name. The archives, the feed and the two packages were assembled under
          # artifacts/release; the install scripts are the tag's own, so a one-liner pinned to this release runs the
          # script it was published with.
          $assets = @('artifacts/release/jason-win-x64.zip', 'artifacts/release/jason-linux-x64.tar.gz', 'artifacts/release/jason-osx-arm64.tar.gz', 'artifacts/release/manifest.json', 'artifacts/release/checksums.txt') + @('install/install.sh', 'install/install.ps1') + @('artifacts/release/jason-plugin-reply.zip', 'artifacts/release/jason-ui.zip')
          gh release create "v$env:VERSION" -R $repository @how --title "Jason $env:VERSION" --notes-file artifacts/release/notes.md @assets
          if ($LASTEXITCODE -ne 0) { throw "gh release create exited with $LASTEXITCODE" }

      - name: Open the pull request
        if: github.event_name == 'push'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LABEL: ${{ steps.body.outputs.label }}
        run: |
          # Only a tag opens the pull request; the button makes its draft at most and leaves the public repository's
          # branches alone. The commit holds what the projection staged, and the branch is this version's alone,
          # replaced whole when the job runs again.
          $repository = 'reply-team/jason-ai'
          $branch = "release/v$env:VERSION"

          git -C public diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The public repository already holds v$env:VERSION's tree: there is nothing to commit, and no pull request is opened."
            exit 0
          }

          git -C public -c user.name='Artem Kosolap' -c user.email='art@reply.io' commit --quiet -m "Jason $env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "git commit exited with $LASTEXITCODE" }
          git -C public push --force origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw "git push exited with $LASTEXITCODE" }

          # One release's pull request at a time. Merging one tags its version, so two open at once would be tagged
          # in whatever order a person merged them. Asked after the draft and the push, so running the job again once
          # the other is merged or closed has only this step left to do.
          $open = @(gh pr list -R $repository --state open --json number,headRefName | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "gh pr list exited with $LASTEXITCODE" }
          $other = @($open | Where-Object { $_.headRefName -clike 'release/v*' -and $_.headRefName -cne $branch })
          if ($other.Count -gt 0) { throw "$($other[0].headRefName)'s pull request is open; merge or close it, then re-run this job." }

          $mine = @($open | Where-Object { $_.headRefName -ceq $branch })
          if ($mine.Count -gt 0) {
            gh pr edit $mine[0].number -R $repository --body-file artifacts/publish/body.md
            if ($LASTEXITCODE -ne 0) { throw "gh pr edit exited with $LASTEXITCODE" }
            exit 0
          }

          [string[]] $label = @()
          if ($env:LABEL -eq 'contracts') { $label = '--label', 'contracts' }
          gh pr create -R $repository --base main --head $branch --title "Jason $env:VERSION" --body-file artifacts/publish/body.md @label
          if ($LASTEXITCODE -ne 0) { throw "gh pr create exited with $LASTEXITCODE" }
