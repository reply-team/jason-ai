# A tag named v<version> builds the release and, in reply-team/jason-ai, publishes it there: three native runners,
# each packaging one platform through the same action ci.yml runs on every pull request, and smoke-testing what it
# published, the Linux one first running the critical tier at the tag and then building the desktop's Linux packages,
# the macOS one, in a job of its own that runs no test, signing and notarizing its executable, and the Windows one, in a
# job of its own that runs no test either, signing its executable through Artifact Signing, and one job that archives
# the plugins' packages from the tag's tree; three proof jobs that install, update and uninstall the signed packages on
# Windows, an Apple silicon Mac and an Intel Mac; then the release job — the only one that may write to this repository — assembles the manifest and the
# checksums and publishes the release at once, with its notes and its assets. The job after it, which asked the Homebrew
# tap to bump its formula, is switched off. The release pull request into main, and its run on every platform, come
# before the tag: the tag is that pull request's head, the release is published from it, and the pull request is merged
# into main only once the publication is checked, so main, whose README and pages GitHub shows, never describes a
# release that is not out, and a release run that fails leaves main as it was. A hotfix's tag is its merge into main
# instead, as DEVELOPMENT.md says.
#
# A release is published from reply-team/jason-ai alone. The same tag pushed anywhere else that holds this workflow —
# a fork, a copy — builds what it can and publishes nothing: without the signing secrets its macOS and Windows jobs
# stop and nothing is assembled, and a copy that holds them assembles the release and says in one line that it
# publishes nothing there. Either way the tap is asked nothing.
#
# Every job that holds a secret or may write runs in the environment `signing`, which admits only release tags and
# release branches: the macOS and Windows jobs, which sign, the release job, which publishes, and the tap's job, which
# holds the tap's token. Every job declares the least permissions it needs, and the workflow's default stays read:
# contents: read for every job that checks the tree out, an OIDC token for the Windows job alone, contents: write for
# the release job alone, and nothing at all for the tap's job.
#
# The button (workflow_dispatch) makes a draft of the release in reply-team/jason-ai and stops there: nothing is
# tagged, nothing is published and the tap is not asked. The draft is for reading and is deleted afterwards, so the
# button leaves nothing behind: a release is published only by its tag, never by publishing a draft. With
# dry_run it does not make the draft either: every job runs, and the assembled release is handed back as an artifact of
# the run.
#
# A release's own notes are RELEASE-NOTES.md at the root, written for the release they name. The version job reads
# the file before anything is built: a tag whose file is missing, untitled or names another version stops there, and
# the button's run then carries the template alone.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to build, without the v (0.2.0, 1.0.0-rc.1). Nothing is tagged and nothing is published: the result is a draft release in reply-team/jason-ai, and nothing anywhere else, unless dry_run is set.'
        required: true
        type: string
      dry_run:
        description: 'Build and assemble everything and publish nothing: no draft, no release, no request to the tap. The assembled release comes back as an artifact of this run.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  version:
    name: The version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      sdk: ${{ steps.dotnet.outputs.sdk-version }}
    steps:
      - id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          # The one place the version is decided; every job below is told it. A tag is `v` and a version, the
          # button gives the version itself, and anything else — v1.2, v01.2.3, a tag carrying build metadata —
          # stops the workflow here, before a runner has built anything. The build stamps its own metadata.
          $given = if ($env:EVENT -eq 'workflow_dispatch') { $env:REQUESTED } else { $env:TAG }
          $version = if ($env:EVENT -eq 'workflow_dispatch') { $given } elseif ($given -clike 'v*') { $given.Substring(1) } else { '' }

          $identifier = '(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)'
          if ($version -cnotmatch "^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-$identifier(?:\.$identifier)*)?$") {
            throw "'$given' is not a version this workflow builds: v0.2.0 or v1.0.0-rc.1 as a tag, 0.2.0 from the button."
          }

          Write-Host "version -> $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # And the SDK every platform builds on: the newest the 10.0 channel has released, resolved here once and handed on
      # as the sdk output, so the three platforms of one release build on one SDK. The repository's action is the one
      # place that says what the newest is, and it resolves the SDK by installing it, so this job checks the tree out and
      # installs .NET, which it builds nothing with.
      - uses: actions/checkout@v7

      - id: notes
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A release's own notes, read before anything is built. The file opens with a comment to whoever writes it,
          # then `# Jason <version>`. The version after a release leaves it naming the release it was written for, so
          # a tag whose file is missing, untitled or names another version stops here: a stale file can never ship.
          # The button's run carries the template alone instead and says why. The notes output tells the publishing
          # job whether to put the file into the body. Get-Content gives nothing at all for an empty file, not even
          # a string, so `?? ''` makes it the empty text it is.
          $why = $null
          if (-not (Test-Path -LiteralPath RELEASE-NOTES.md)) {
            $why = 'There is no RELEASE-NOTES.md'
          } else {
            $text = [regex]::Replace(((Get-Content -LiteralPath RELEASE-NOTES.md -Raw) ?? '').ReplaceLineEndings("`n"), '(?s)^\s*<!--.*?-->', '').TrimStart()
            $title = $text.Split("`n")[0]
            if ($title -cmatch '^# Jason (\S+)$') {
              if ($Matches[1] -cne $env:VERSION) { $why = "RELEASE-NOTES.md names $($Matches[1])" }
            } else {
              $why = "RELEASE-NOTES.md does not open with '# Jason <version>'"
            }
          }

          if ($null -eq $why) {
            Write-Host "RELEASE-NOTES.md names ${env:VERSION}: the release carries its own notes."
            "notes=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($env:EVENT -eq 'push') { throw "$why; this tag is v$env:VERSION, and a tag ships its own notes." }

          Write-Host "::warning title=Release notes::$why; this run is v$env:VERSION, so it carries the template alone."
          "notes=false" >> $env:GITHUB_OUTPUT

      - id: dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: latest

  build:
    name: ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
    # macOS and Windows are not legs here: their jobs, below, hold the Apple identity and the Azure sign-in, and a runner
    # is handed every secret its job names, so the job that runs the tests names none.
    steps:
      # The whole history and its tags, as the suite's checkout in ci.yml has them: the journal's kind documents are
      # compared with the last published release's, read from its tag, and at a release's tag that is the one before it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.version.outputs.sdk }}

      # Restore, build and the critical tier below run on Linux alone; the package action restores and builds what it
      # publishes on every platform by itself.
      - name: Restore
        if: matrix.rid == 'linux-x64'
        run: dotnet restore dotnet/Jason.slnx

      # One version through build, test and publish, so that the Linux tier runs under the version every archive carries.
      - name: Build (warnings are errors)
        if: matrix.rid == 'linux-x64'
        run: dotnet build dotnet/Jason.slnx --configuration Release --no-restore -p:Version=${{ needs.version.outputs.version }}

      # The whole suite ran on this tree, on every platform, on the release's pull request into main, and again under the
      # bare version on Linux; the tag is that pull request's head, so its tree is the one those runs passed, and the
      # version the tag stamps differs from what the platform legs built. The SDK is resolved again at the tag, by the
      # version job above,
      # so a channel release between the pull request's run and the tag is a second difference: an SDK, and the runtime
      # patch the executable carries, that the whole suite never ran on. What runs here, before anything is published, is
      # the critical tier on Linux, stamped with the version the tag names, and it is the run on that SDK: a release is a
      # build of a tree the suite passed, whose tier passes under its own version, on the SDK it is built with. The same
      # tier on Windows and macOS would repeat a run this tree already passed there, on the dearest runners, so the
      # Windows and macOS jobs go straight to packaging.
      - name: Test the critical tier (offline)
        if: matrix.rid == 'linux-x64'
        run: dotnet test --solution dotnet/Jason.slnx --configuration Release --no-build -p:Version=${{ needs.version.outputs.version }} -- --filter-trait "Category=Critical"

      # And the desktop's Linux packages, an AppImage and a deb, which nothing signs: built around the executable this
      # call publishes, read back, and started once each under a virtual display, before anything is published.
      - name: Package
        id: package
        uses: ./.github/actions/package
        with:
          rid: ${{ matrix.rid }}
          version: ${{ needs.version.outputs.version }}
          desktop: true

      - name: Smoke-test the published executable
        shell: pwsh
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          VERSION: ${{ needs.version.outputs.version }}
          JASON_Update__CheckEnabled: 'false'
        run: |
          $exe = $env:EXECUTABLE
          $env:JASON_DATA_DIR = Join-Path ([IO.Path]::GetTempPath()) "jason-release-smoke"

          $versionError = Join-Path ([IO.Path]::GetTempPath()) "jason-release-smoke-version.err"
          $elapsed = Measure-Command { & $exe --version 2> $versionError | Tee-Object -Variable version }
          if ($LASTEXITCODE -ne 0) { throw "jason --version exited with $LASTEXITCODE" }
          Write-Host "jason --version -> $version ($([int]$elapsed.TotalMilliseconds) ms cold start)"

          # Not a test build: a test build says so on --version's standard error, and as test_build in the runtime's
          # report below; the build a release publishes says neither.
          $said = if (Test-Path -LiteralPath $versionError) { Get-Content -LiteralPath $versionError -Raw } else { '' }
          if ("$said".Contains('a test build, not a release')) { throw "jason --version says on standard error that it is a test build: $said" }

          # What it prints is the tag's version plus build metadata (+<commit>), which SemVer says to ignore.
          if (($version -split '\+')[0] -ne $env:VERSION) { throw "jason --version says '$version', and the tag says $env:VERSION" }

          $elapsed = Measure-Command { & $exe runtime status | Tee-Object -Variable status }
          $statusExit = $LASTEXITCODE
          Write-Host "jason runtime status -> exit $statusExit in $([int]$elapsed.TotalMilliseconds) ms: $status"
          if ($statusExit -ne 3) { throw "expected exit code 3 without a running runtime, got $statusExit" }
          if ($status -notmatch '"code":"no_descriptor"') { throw "expected a no_descriptor error envelope" }

          # And it opens the database. Everything above passes on a build that cannot: a single-file publish
          # leaves SQLite's native library beside the executable unless it is told to bundle it, `--version`
          # and a status with no runtime never touch it, and the archive carries the executable alone — so the
          # one build a release exists to deliver would have gone out green. Starting the runtime is what
          # loads it.
          & $exe runtime start | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime start exited with $LASTEXITCODE; the published executable cannot open its database" }

          & $exe runtime status | Tee-Object -Variable running | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime status exited with $LASTEXITCODE while a runtime was running" }
          if ($running -notmatch '"applied_migrations":\["') { throw "runtime status reported no applied migrations: $running" }
          if ("$running".Contains('"test_build"')) { throw "the runtime's report says it is a test build: $running" }
          Write-Host "the runtime started, migrated and answered"

          & $exe runtime stop | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime stop exited with $LASTEXITCODE" }

          # The last command of this step is expected to exit 3, and pwsh would hand that on as the step's
          # own exit code. Everything asserted above passed, so the step succeeded.
          exit 0

  macos:
    name: osx-arm64
    needs: version
    runs-on: macos-latest
    permissions:
      contents: read
    # The one job that holds the Apple identity. It builds this platform, and the package action signs and notarizes
    # its executable; then the osx-x64 executable and the desktop's Mac packages, which carry the two. It runs no test,
    # so no test code and no test-only package shares a runner with the identity: the desktop's build tooling does,
    # pinned by desktop/package-lock.json and installed by npm ci without a package's scripts, and none of it is a
    # test. The tier at the tag is the Linux leg's, above; this job publishes on its own, as the Windows job does. It
    # runs in the signing environment, which only release tags and release branches may run in, as every job that
    # holds a secret does.
    environment: signing
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.version.outputs.sdk }}

      - name: Package
        id: package
        uses: ./.github/actions/package
        with:
          rid: osx-arm64
          version: ${{ needs.version.outputs.version }}
          # A release signs the macOS executable with Reply's Developer ID and has it notarized. ci.yml passes none of
          # these, so a pull request's build keeps the SDK's ad hoc signature.
          sign-macos: true
          apple-developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-notary-key-p8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          apple-notary-key-id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple-notary-issuer-id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      # The archive is what a person downloads, so its executable is the one whose signature counts: unpacked here and
      # read, rather than trusted to be the file the action signed. The Developer ID authority is required, not only a
      # valid signature, which the SDK's ad hoc one would be.
      - name: Read the signature of the archived macOS executable
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          unpacked="$RUNNER_TEMP/archived"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          tar -xzf "$ARCHIVE" -C "$unpacked"
          ls -l "$unpacked"
          codesign --verify --strict --verbose=2 "$unpacked/jason"
          codesign --display --verbose=4 "$unpacked/jason"
          signature="$(codesign --display --verbose=2 "$unpacked/jason" 2>&1)"
          if ! grep -q '^Authority=Developer ID Application: ' <<< "$signature"; then
            echo "::error title=Signature::The archived executable does not carry a Developer ID Application signature."
            exit 1
          fi

      - name: Smoke-test the published executable
        shell: pwsh
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          VERSION: ${{ needs.version.outputs.version }}
          JASON_Update__CheckEnabled: 'false'
        run: |
          $exe = $env:EXECUTABLE
          $env:JASON_DATA_DIR = Join-Path ([IO.Path]::GetTempPath()) "jason-release-smoke"

          $versionError = Join-Path ([IO.Path]::GetTempPath()) "jason-release-smoke-version.err"
          $elapsed = Measure-Command { & $exe --version 2> $versionError | Tee-Object -Variable version }
          if ($LASTEXITCODE -ne 0) { throw "jason --version exited with $LASTEXITCODE" }
          Write-Host "jason --version -> $version ($([int]$elapsed.TotalMilliseconds) ms cold start)"

          # Not a test build: a test build says so on --version's standard error, and as test_build in the runtime's
          # report below; the build a release publishes says neither.
          $said = if (Test-Path -LiteralPath $versionError) { Get-Content -LiteralPath $versionError -Raw } else { '' }
          if ("$said".Contains('a test build, not a release')) { throw "jason --version says on standard error that it is a test build: $said" }

          # What it prints is the tag's version plus build metadata (+<commit>), which SemVer says to ignore.
          if (($version -split '\+')[0] -ne $env:VERSION) { throw "jason --version says '$version', and the tag says $env:VERSION" }

          $elapsed = Measure-Command { & $exe runtime status | Tee-Object -Variable status }
          $statusExit = $LASTEXITCODE
          Write-Host "jason runtime status -> exit $statusExit in $([int]$elapsed.TotalMilliseconds) ms: $status"
          if ($statusExit -ne 3) { throw "expected exit code 3 without a running runtime, got $statusExit" }
          if ($status -notmatch '"code":"no_descriptor"') { throw "expected a no_descriptor error envelope" }

          # And it opens the database. Everything above passes on a build that cannot: a single-file publish
          # leaves SQLite's native library beside the executable unless it is told to bundle it, `--version`
          # and a status with no runtime never touch it, and the archive carries the executable alone — so the
          # one build a release exists to deliver would have gone out green. Starting the runtime is what
          # loads it.
          & $exe runtime start | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime start exited with $LASTEXITCODE; the published executable cannot open its database" }

          & $exe runtime status | Tee-Object -Variable running | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime status exited with $LASTEXITCODE while a runtime was running" }
          if ($running -notmatch '"applied_migrations":\["') { throw "runtime status reported no applied migrations: $running" }
          if ("$running".Contains('"test_build"')) { throw "the runtime's report says it is a test build: $running" }
          Write-Host "the runtime started, migrated and answered"

          & $exe runtime stop | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime stop exited with $LASTEXITCODE" }

          # The last command of this step is expected to exit 3, and pwsh would hand that on as the step's
          # own exit code. Everything asserted above passed, so the step succeeded.
          exit 0

      # Who signed each native library the bundle unpacked on its first run, in the smoke test above: our team, since the
      # package action signs them before it bundles them, and the smoke test passing says library validation loaded
      # them. A reading, so it never fails the job.
      - name: Read who signed each native library the bundle unpacked
        shell: pwsh
        run: |
          try {
            $unpacked = Join-Path $HOME '.net/jason'
            $libraries = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter '*.dylib' -ErrorAction Stop)
            Write-Host "$($libraries.Count) native libraries unpacked under $unpacked"
            foreach ($library in $libraries) {
              Write-Host "--- $($library.FullName)"
              & codesign -dv --verbose=2 $library.FullName 2>&1 | ForEach-Object { Write-Host "$_" }
            }
          } catch {
            Write-Host "::warning title=Native libraries::The unpacked native libraries could not be read: $($_.Exception.Message)"
          }

          # codesign exits 1 for a library that carries no signature, and pwsh would hand that on as the step's own.
          exit 0

      # What a person who fetched the archive with a browser starts: its executable unpacked and marked with the
      # quarantine attribute, as the browser marks what it downloads, then run as the smoke test runs it. Gatekeeper
      # assesses a quarantined file the first time it runs, asking Apple online for the notarization, and a refusal can
      # wait on a dialog nobody here answers, so every run is bounded. A reading of the notes' sentence that such a copy
      # starts, so it never fails the job: what happened is printed, with a warning when the copy did not start, say the
      # tag's version, open its database and stop, and when nothing shows that Gatekeeper assessed it.
      - name: Start a quarantined copy of the archived executable
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ needs.version.outputs.version }}
          TIMEOUT_SECONDS: '60'
          JASON_Update__CheckEnabled: 'false'
        run: |
          # The quarantined copy run with the given arguments under the bound: what it printed, or a throw when it exited
          # with anything but 0 or had not finished within the bound, when it is stopped.
          function Invoke-Quarantined {
            $start = [System.Diagnostics.ProcessStartInfo]::new($exe)
            foreach ($argument in $args) { $start.ArgumentList.Add($argument) }
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $process = [System.Diagnostics.Process]::Start($start)
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            $bound = [int]$env:TIMEOUT_SECONDS * 1000
            if (-not $process.WaitForExit($bound) -or -not [System.Threading.Tasks.Task]::WaitAll(@($stdout, $stderr), $bound)) {
              try { $process.Kill($true) } catch { }
              throw "jason $args had not finished after $env:TIMEOUT_SECONDS seconds, and was stopped."
            }

            $said = $stdout.Result.Trim()
            Write-Host "jason $args -> exit $($process.ExitCode): $said"
            if ($stderr.Result.Trim()) { Write-Host "on stderr: $($stderr.Result.Trim())" }
            if ($process.ExitCode -ne 0) { throw "jason $args exited with $($process.ExitCode)." }
            $said
          }

          $started = $false
          $ran = $false
          # Whether this start reads what Gatekeeper does to a download: assessments are on, and the first run moved the
          # quarantine flags, which is the trace an assessment leaves in them.
          $assessed = $true
          try {
            $assessing = "$(& spctl --status 2>&1)".Trim()
            Write-Host "spctl --status: $assessing"
            if ($assessing -ne 'assessments enabled') {
              $assessed = $false
              Write-Host "::warning title=Quarantined start::spctl says '$assessing': Gatekeeper assesses nothing on this runner, so this start reads nothing of what a downloaded copy meets."
            }
            $unpacked = Join-Path $env:RUNNER_TEMP 'quarantined'
            Remove-Item -LiteralPath $unpacked -Recurse -Force -ErrorAction Ignore
            New-Item -ItemType Directory -Path $unpacked | Out-Null
            & tar -xzf $env:ARCHIVE -C $unpacked
            if ($LASTEXITCODE -ne 0) { throw "tar exited with $LASTEXITCODE unpacking $env:ARCHIVE." }
            $exe = Join-Path $unpacked 'jason'

            # The attribute's value as a browser writes it: its flags, the moment in hexadecimal seconds since 1970, the
            # agent that downloaded the file and an id of the download. The flags say the file was downloaded (0x0001) and
            # not that a person approved it (0x0040), which would spare it the assessment.
            $value = '0081;{0:x8};Safari;{1}' -f [DateTimeOffset]::UtcNow.ToUnixTimeSeconds(), [Guid]::NewGuid().ToString().ToUpperInvariant()
            & xattr -w com.apple.quarantine $value $exe
            if ($LASTEXITCODE -ne 0) { throw "xattr exited with $LASTEXITCODE marking $exe as quarantined." }
            $before = "$(& xattr -p com.apple.quarantine $exe)".Trim()
            Write-Host "com.apple.quarantine before the first run: $before"

            $env:JASON_DATA_DIR = Join-Path $env:RUNNER_TEMP 'jason-quarantined'
            # The copy unpacks its native libraries itself, as a download's first run does. Left to the default it would
            # find the smoke test's: the same build unpacks under the same directory of the user's, and the host only looks
            # whether that is there. The runtime the copy starts inherits the variable, and loads its library from here.
            $extracted = Join-Path $env:RUNNER_TEMP 'jason-quarantined-extract'
            Remove-Item -LiteralPath $extracted -Recurse -Force -ErrorAction Ignore
            $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = $extracted
            $ran = $true
            try {
              $version = Invoke-Quarantined --version
            } finally {
              # Read however the first run ended: a refusal leaves its trace in the flags as well.
              $after = "$(& xattr -p com.apple.quarantine $exe 2>&1)".Trim()
              Write-Host "com.apple.quarantine after the first run: $after"
              $flags = ($before -split ';')[0]
              if (($after -split ';')[0] -eq $flags) {
                $assessed = $false
                Write-Host "::warning title=Quarantined start::The quarantine flags read $flags before the first run and after it: nothing shows that Gatekeeper assessed the copy."
              }
            }
            if (($version -split '\+')[0] -ne $env:VERSION) { throw "The quarantined copy says '$version', and the tag says $env:VERSION." }

            # And it opens its database, as the smoke test's copy does: what Gatekeeper lets start is the program, not
            # only its answer to --version.
            # Set before the start is asked for: a start that fails or runs out of time may still have left a runtime.
            $started = $true
            Invoke-Quarantined runtime start | Out-Null
            $running = Invoke-Quarantined runtime status
            if ($running -notmatch '"applied_migrations":\["') { throw "The quarantined copy's runtime reported no applied migrations: $running" }
            if ($assessed) {
              Write-Host "The quarantined copy was assessed, started, said $env:VERSION and opened its database."
            } else {
              Write-Host "The quarantined copy started, said $env:VERSION and opened its database, and nothing above shows that Gatekeeper assessed it."
            }
          } catch {
            Write-Host "::warning title=Quarantined start::$($_.Exception.Message)"
          } finally {
            # A runtime the copy was asked to start is stopped, whatever happened after it was asked.
            if ($started) {
              try { Invoke-Quarantined runtime stop | Out-Null } catch { Write-Host "::warning title=Quarantined start::$($_.Exception.Message)" }
            }

            # What the copy unpacked, as the system now sees it: any attribute a library carries, and who signed it.
            if ($ran) {
              try {
                $libraries = @(Get-ChildItem -LiteralPath $extracted -Recurse -File -Filter '*.dylib' -ErrorAction Ignore)
                if ($libraries.Count -eq 0) { Write-Host "::warning title=Quarantined start::The quarantined copy unpacked no native library under $extracted." }
                foreach ($library in $libraries) {
                  Write-Host "--- $($library.FullName)"
                  $attributes = @(& xattr -l $library.FullName)
                  Write-Host "xattr -l: $(if ($attributes.Count -gt 0) { $attributes -join '; ' } else { 'none' })"
                  # codesign writes what a signature says on standard error; both streams are read, as one.
                  & codesign --display --verbose=2 $library.FullName 2>&1 | ForEach-Object { Write-Host "$_" }
                }
              } catch {
                Write-Host "::warning title=Quarantined start::$($_.Exception.Message)"
              }
            }
          }

          # A reading: what happened is printed above, and the job goes on whatever it was.
          exit 0

      # The desktop's Mac packages carry an executable for each architecture, so the action runs a second time for
      # osx-x64: published, signed, notarized and assessed as the osx-arm64 one was, then the desktop built around the
      # two and verified. That executable is never published on its own: its upload is named outside jason-*, which the
      # release job downloads, and the manifest names no osx-x64.
      - name: Package the osx-x64 executable and the desktop's Mac packages
        id: desktop
        uses: ./.github/actions/package
        with:
          rid: osx-x64
          version: ${{ needs.version.outputs.version }}
          artifact: desktop-osx-x64-executable
          desktop: true
          sign-macos: true
          apple-developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-notary-key-p8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          apple-notary-key-id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple-notary-issuer-id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      # The osx-x64 executable started once, under Rosetta, where the runner has it: it says the release's version, and
      # the runtime it starts opens its database, answers and stops, as the smoke test's does. A runner without Rosetta
      # cannot start it, and that is said rather than passed over: the notes say the osx-x64 executable is built and
      # signed, never that the suite ran it.
      - name: Start the osx-x64 executable once under Rosetta
        shell: bash
        env:
          EXECUTABLE: ${{ steps.desktop.outputs.executable }}
          VERSION: ${{ needs.version.outputs.version }}
          JASON_Update__CheckEnabled: 'false'
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2> /dev/null; then
            echo "::notice title=osx-x64::This runner has no Rosetta, so the osx-x64 executable was never started here."
            exit 0
          fi
          export JASON_DATA_DIR="$RUNNER_TEMP/jason-osx-x64"
          said="$(/usr/bin/arch -x86_64 "$EXECUTABLE" --version)"
          echo "jason --version under Rosetta -> $said"
          [ "${said%%+*}" = "$VERSION" ] || { echo "::error title=osx-x64::The osx-x64 executable says '$said', and the tag says $VERSION."; exit 1; }

          /usr/bin/arch -x86_64 "$EXECUTABLE" runtime start > /dev/null
          answered=0
          /usr/bin/arch -x86_64 "$EXECUTABLE" runtime status > "$RUNNER_TEMP/osx-x64-status.json" || answered=$?
          /usr/bin/arch -x86_64 "$EXECUTABLE" runtime stop > /dev/null
          running="$(cat "$RUNNER_TEMP/osx-x64-status.json")"
          [ "$answered" = 0 ] || { echo "::error title=osx-x64::jason runtime status exited with $answered under Rosetta: $running"; exit 1; }
          case "$running" in
            *'"applied_migrations":["'*) echo "The osx-x64 runtime started under Rosetta, migrated, answered and stopped." ;;
            *) echo "::error title=osx-x64::The osx-x64 runtime reported no applied migrations: $running"; exit 1 ;;
          esac

  windows:
    name: win-x64
    needs: version
    runs-on: windows-latest
    # The one job that may ask for an OIDC token, which the federated credential trades for the Azure sign-in that
    # signs; the workflow grants none, so no other job can. It builds this platform, and the package action signs its
    # executable and then the desktop's installer around it. It runs no test, so no test code and no test-only package
    # shares a runner with the sign-in: the desktop's build tooling does, pinned by desktop/package-lock.json and
    # installed by npm ci without a package's scripts, and none of it is a test. The tier
    # at the tag is the Linux leg's, above; this job publishes on its own, as the macOS job does. It runs in the signing
    # environment, which only release tags and release branches may run in, and the federated credential accepts a
    # token from that environment alone.
    environment: signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.version.outputs.sdk }}

      - name: Package
        id: package
        uses: ./.github/actions/package
        with:
          rid: win-x64
          version: ${{ needs.version.outputs.version }}
          # A release signs the Windows executable through Artifact Signing. ci.yml passes none of these, so a pull
          # request's build stays unsigned. None is a credential: the sign-in is this job's OIDC token.
          sign-windows: true
          # And the desktop's Windows installer, built and signed while the sign-in holds.
          desktop: true
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-signing-account: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          azure-signing-endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          azure-signing-profile: ${{ secrets.AZURE_SIGNING_PROFILE }}

      # The archive is what a person downloads, so its executable is the one whose signature counts: unpacked here and
      # verified by the same script, rather than trusted to be the file the action signed.
      - name: Verify the signature of the archived Windows executable
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'archived'
          if (Test-Path -LiteralPath $unpacked) { Remove-Item -LiteralPath $unpacked -Recurse -Force }
          Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath $unpacked
          Get-ChildItem -LiteralPath $unpacked | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }
          ./.github/scripts/Assert-WindowsSignature.ps1 -Executable (Join-Path $unpacked 'jason.exe') -Publisher 'ReplyApp Inc.'

      - name: Smoke-test the published executable
        shell: pwsh
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          VERSION: ${{ needs.version.outputs.version }}
          JASON_Update__CheckEnabled: 'false'
        run: |
          $exe = $env:EXECUTABLE
          $env:JASON_DATA_DIR = Join-Path ([IO.Path]::GetTempPath()) "jason-release-smoke"

          $versionError = Join-Path ([IO.Path]::GetTempPath()) "jason-release-smoke-version.err"
          $elapsed = Measure-Command { & $exe --version 2> $versionError | Tee-Object -Variable version }
          if ($LASTEXITCODE -ne 0) { throw "jason --version exited with $LASTEXITCODE" }
          Write-Host "jason --version -> $version ($([int]$elapsed.TotalMilliseconds) ms cold start)"

          # Not a test build: a test build says so on --version's standard error, and as test_build in the runtime's
          # report below; the build a release publishes says neither.
          $said = if (Test-Path -LiteralPath $versionError) { Get-Content -LiteralPath $versionError -Raw } else { '' }
          if ("$said".Contains('a test build, not a release')) { throw "jason --version says on standard error that it is a test build: $said" }

          # What it prints is the tag's version plus build metadata (+<commit>), which SemVer says to ignore.
          if (($version -split '\+')[0] -ne $env:VERSION) { throw "jason --version says '$version', and the tag says $env:VERSION" }

          $elapsed = Measure-Command { & $exe runtime status | Tee-Object -Variable status }
          $statusExit = $LASTEXITCODE
          Write-Host "jason runtime status -> exit $statusExit in $([int]$elapsed.TotalMilliseconds) ms: $status"
          if ($statusExit -ne 3) { throw "expected exit code 3 without a running runtime, got $statusExit" }
          if ($status -notmatch '"code":"no_descriptor"') { throw "expected a no_descriptor error envelope" }

          # And it opens the database. Everything above passes on a build that cannot: a single-file publish
          # leaves SQLite's native library beside the executable unless it is told to bundle it, `--version`
          # and a status with no runtime never touch it, and the archive carries the executable alone — so the
          # one build a release exists to deliver would have gone out green. Starting the runtime is what
          # loads it.
          & $exe runtime start | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime start exited with $LASTEXITCODE; the published executable cannot open its database" }

          & $exe runtime status | Tee-Object -Variable running | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime status exited with $LASTEXITCODE while a runtime was running" }
          if ($running -notmatch '"applied_migrations":\["') { throw "runtime status reported no applied migrations: $running" }
          if ("$running".Contains('"test_build"')) { throw "the runtime's report says it is a test build: $running" }
          Write-Host "the runtime started, migrated and answered"

          & $exe runtime stop | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jason runtime stop exited with $LASTEXITCODE" }

          # The last command of this step is expected to exit 3, and pwsh would hand that on as the step's
          # own exit code. Everything asserted above passed, so the step succeeded.
          exit 0

      # Who signed each native library the bundle unpacked on its first run, in the smoke test above: the reading that
      # decides whether those libraries need a signature of Reply's as well. A reading, so it never fails the job, and it
      # names each library by its file name alone, never by a path under the runner's profile.
      - name: Read who signed each native library the bundle unpacked
        shell: pwsh
        run: |
          try {
            $unpacked = Join-Path $env:TEMP '.net\jason'
            $libraries = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter '*.dll' -ErrorAction Stop)
            Write-Host "$($libraries.Count) native libraries unpacked under .net\jason"
            foreach ($library in $libraries) {
              $signature = Get-AuthenticodeSignature -LiteralPath $library.FullName
              $signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { 'nobody' }
              Write-Host "$($library.Name): $($signature.Status), signed by $signer"
            }
          } catch {
            Write-Host "::warning title=Native libraries::The unpacked native libraries could not be read ($($_.Exception.GetType().Name))."
          }

          # A reading: whatever it found, the step succeeded.
          exit 0

  plugin:
    name: The plugins' packages
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Once per release, not once per platform: a package is JavaScript, the same on every machine. Each is archived
    # from the tag's own checkout, whose line endings .gitattributes fixes, so the archive unpacks to the content digest
    # of the package at the tag; the release's pull request ran the test that holds the script to that digest for each
    # package the release publishes, on this tree, on every platform. A step per package, and an upload per package
    # under a name of its own.
    steps:
      - uses: actions/checkout@v7

      - name: Archive plugins/reply
        shell: pwsh
        run: ./.github/scripts/Write-PluginArchive.ps1 -Package plugins/reply -Archive artifacts/release/jason-plugin-reply.zip

      - name: Archive plugins/journal-forwarder
        shell: pwsh
        run: ./.github/scripts/Write-PluginArchive.ps1 -Package plugins/journal-forwarder -Archive artifacts/release/jason-plugin-journal-forwarder.zip

      - name: Archive plugins/ntfy
        shell: pwsh
        run: ./.github/scripts/Write-PluginArchive.ps1 -Package plugins/ntfy -Archive artifacts/release/jason-plugin-ntfy.zip

      - name: Archive plugins/slack
        shell: pwsh
        run: ./.github/scripts/Write-PluginArchive.ps1 -Package plugins/slack -Archive artifacts/release/jason-plugin-slack.zip

      - name: Archive plugins/telegram
        shell: pwsh
        run: ./.github/scripts/Write-PluginArchive.ps1 -Package plugins/telegram -Archive artifacts/release/jason-plugin-telegram.zip

      # Named so that the publishing job's download of jason-* brings each beside the archives, where the checksums are
      # written.
      - uses: actions/upload-artifact@v7
        with:
          name: jason-plugin-reply
          path: artifacts/release/jason-plugin-reply.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: jason-plugin-journal-forwarder
          path: artifacts/release/jason-plugin-journal-forwarder.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: jason-plugin-ntfy
          path: artifacts/release/jason-plugin-ntfy.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: jason-plugin-slack
          path: artifacts/release/jason-plugin-slack.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: jason-plugin-telegram
          path: artifacts/release/jason-plugin-telegram.zip
          if-no-files-found: error

  ui:
    name: The UI's package
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Once per release, like the plugins' packages, and built here rather than taken from CI: CI's zip carries the -dev
    # version and is kept fourteen days, and `jason status` compares the default UI's version with the runtime's. The
    # page's checks and tests run on the tag's tree before it is packaged, as the runtime's do before it is archived.
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Check (types, lint, format)
        run: npm run check

      - name: Unit and screen tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package with the release's version
        env:
          JASON_VERSION: ${{ needs.version.outputs.version }}
        run: npm run package

      # Named so that the publishing job's download of jason-* brings it beside the archives, where the checksums are
      # written.
      - uses: actions/upload-artifact@v7
        with:
          name: jason-ui
          path: ui/artifacts/jason-ui.zip
          if-no-files-found: error


  skills:
    name: The skills' package
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Once per release, like the plugins' packages: skills/ of the tag's own checkout, with a source.json naming the
    # public repository, the tag and the commit, which is what `jason skills install` records for a deployment from it.
    # The repository is written as a constant, as the notes address is: a run elsewhere names the repository the
    # release is published from, not the one it ran in.
    steps:
      - uses: actions/checkout@v7

      - name: Archive skills
        shell: pwsh
        run: ./.github/scripts/Write-SkillsArchive.ps1 -Tree . -Archive artifacts/release/jason-skills.zip -Repository https://github.com/reply-team/jason-ai -Ref "v${{ needs.version.outputs.version }}" -Commit "${{ github.sha }}"

      # Named so that the publishing job's download of jason-* brings it beside the archives, where the checksums are
      # written.
      - uses: actions/upload-artifact@v7
        with:
          name: jason-skills
          path: artifacts/release/jason-skills.zip
          if-no-files-found: error

  # Jason as one installation, proven on what this release publishes before the release job may publish it, as ci.yml's
  # union jobs prove it on a test build: the signed packages the platform's job uploaded, installed by the install scripts
  # as this release publishes them, unchanged; uninstalled by each door, every leg compared with a listing taken before
  # anything was installed; the previous release's Jason Desktop updated by this release's setup as its updater runs it;
  # and the previous release's command-line Jason updated by its own update apply. The three proof jobs hold no secret
  # and no environment, and their token reads the repository for the checkout alone: the previous release is read from
  # its public downloads. What they keep is named outside jason-*, which the release job's download takes, and the
  # release job needs all three. The scripts are .github/scripts/Test-InstallationWindows.ps1 and
  # test-installation-macos.sh, the ones ci.yml's jobs run.
  # They take the shape of those jobs step for step, with the differences ReleaseWorkflowTests names: the same framing
  # and every leg between a begin and an end, so a leg's failure stops no leg after it and the held step fails the job
  # with the list.
  #
  # TWO PINS, two worlds a person updates from, each named in the job's own fetch step and held by ReleaseWorkflowTests.
  # The previous release, v0.48.7, is a release of the world before one installation: its legs begin with a command-line
  # Jason and Jason Desktop installed apart and reach this release through that release's own update and the move. The
  # one-installation release, v0.49.0, is a release of the world after, Jason Desktop installed alone with the jason it
  # carries: its leg begins with no window open, and its carried jason update apply hands this release to its own Jason
  # Desktop's updater, which installs it, and the rest to this release's carried jason update apply --finish. That leg runs
  # here alone, where the release is signed: its updater installs only an update signed as the release is, which ci.yml's
  # test builds never are. Neither pin is ever read as the latest published release.
  #
  # THE UPDATER, END TO END, is a named place in both platform jobs, for the unit that has jason update apply hand an
  # update to Jason Desktop: a next build at this version and one, signed as this one is, served on the loopback feed and
  # applied by jason update apply with no window, and again with a window open, which refuses. Until it lands, each job's
  # summary says what of this is not proven here: this release's own handing, with no window and with one open; the
  # one-installation release's handing this release to its Jason Desktop, with no window, is.
  proof-windows:
    name: The proof on win-x64
    needs: [version, windows, skills]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OUT: ${{ github.workspace }}\installation
      FEED: ${{ github.workspace }}\feed
      PREVIOUS: ${{ github.workspace }}\previous
      ONE_INSTALLATION: ${{ github.workspace }}\one-installation
    steps:
      - uses: actions/checkout@v7

      # One temporary folder for the whole job: the one a new shell of this account has, where a terminal the legs open,
      # and every program it starts, unpacks and renames aside. A step otherwise reads the runner's own TEMP, which can be
      # another (a per-session folder), and its listings would look where no leg's program wrote. Every listing fails
      # where its step's and a new shell's differ.
      - name: Give the job's steps the temporary folder a new shell of this account has
        timeout-minutes: 5
        shell: pwsh
        run: ./.github/scripts/Test-InstallationWindows.ps1 -Step OneTemporary -Out $env:OUT

      # The archive, the desktop's installer, its block map and update feed, and the skills' package, as the win-x64 job
      # and the skills' job uploaded them, with the manifest and the checksums written over them for win-x64 alone.
      - uses: actions/download-artifact@v7
        with:
          name: jason-win-x64
          path: feed

      - uses: actions/download-artifact@v7
        with:
          name: jason-desktop-win-x64
          path: feed

      - uses: actions/download-artifact@v7
        with:
          name: jason-skills
          path: feed

      # The id of the folder this release's jason extracts its native libraries to under %TEMP%\.net\jason, read from the
      # archive with the host's base pointed elsewhere, so that the compares tell it from the previous release's.
      - name: Read the folder this release's jason extracts its native libraries to
        timeout-minutes: 20
        shell: pwsh
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'extract-probe-archive'
          Expand-Archive -LiteralPath (Join-Path $env:FEED 'jason-win-x64.zip') -DestinationPath $unpacked -Force
          $executable = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter 'jason.exe')
          if ($executable.Count -ne 1) { throw "jason-win-x64.zip holds $($executable.Count) jason.exe, not one" }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Extracted -Out $env:OUT -Executable $executable[0].FullName

      - name: Assemble the feed the way a release is assembled
        id: feed
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/scripts/Write-ProofFeed.ps1 -Rid win-x64 -Version $env:VERSION -Directory $env:FEED

      # The account's Path as an ordinary account has it: ExpandString, with an entry spelled through a variable. Every
      # install after it holds both by name: the kind after is the kind before, and the entry is still unexpanded.
      - name: Give the account's Path the shape an ordinary account has, ExpandString with an entry spelled through a variable
        id: path-shape
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/scripts/Test-InstallationWindows.ps1 -Step PathShape -Out $env:OUT

      # A person's machine as an agent finds it: both agent hosts present, and a skill of the person's own under a name
      # Jason ships. Then the listing everything after is compared with, and every leg starts from.
      - name: The machine before anything is installed
        id: before
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE '.claude'), (Join-Path $env:USERPROFILE '.codex'), (Join-Path $env:USERPROFILE '.agents\skills\quick-start') | Out-Null
          [IO.File]::WriteAllText((Join-Path $env:USERPROFILE '.agents\skills\quick-start\SKILL.md'), "a person's own skill`n")
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name before

      # From here on no leg's failure stops the legs after it: each runs unless the job was cancelled, begins from the
      # machine before (one an earlier failed leg left is taken off by the product's own uninstalls, and said so) or says
      # it was not run and which step it needed, and the job fails at its end, in the last step, with the list.
      # install.ps1 as this release publishes it, unchanged: it holds the setup to the release's signer.
      - name: Install as an agent does, with the released install.ps1
        id: install
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Install as an agent does, with the released install.ps1"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Install -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Script (Join-Path $env:GITHUB_WORKSPACE 'install\install.ps1')
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      - name: Uninstall from a new terminal
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Uninstall from a new terminal"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Needs 'Install as an agent does, with the released install.ps1=${{ steps.install.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromTerminal -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-terminal-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-terminal-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The previous release, named: these legs begin in the world before one installation, and v0.48.7, a release of that
      # world, is the 0.48 release these legs were last read against: its install puts a command-line Jason of its own where
      # every leg that starts from a previous release expects one. Never the latest published release: once 0.49.0 is
      # published that is a release that installs Jason Desktop alone, and every such leg would fail on it. Its files come
      # from its public downloads. No token: the repository's releases are public.
      - name: Fetch the previous release
        id: previous
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          PREVIOUS_RELEASE: v0.48.7
        run: |
          $release = "v$($env:VERSION -replace '-.*$', '')"
          $tag = $env:PREVIOUS_RELEASE
          if ($tag -ceq $release) { throw "the previous release named, $tag, is the one this tree builds: there is no previous release to update from here" }
          New-Item -ItemType Directory -Force -Path $env:PREVIOUS | Out-Null
          # Every file fetched is in one of two lists, by name. The verified ones are held to checksums.txt: a file with no
          # line there, or a digest that differs, fails. checksums.txt names the release's archives and packages alone, so
          # the others are used as downloaded, each said unverified; one checksums.txt comes to list fails until it is moved.
          $verified = @('jason-win-x64.zip', 'jason-desktop-windows-x64-setup.exe')
          $unverifiable = @('install.ps1', 'manifest.json')
          foreach ($name in @('checksums.txt') + $verified + $unverifiable) {
            Invoke-WebRequest -Uri "https://github.com/reply-team/jason-ai/releases/download/$tag/$name" -OutFile (Join-Path $env:PREVIOUS $name) -UseBasicParsing -TimeoutSec 600
          }
          $listed = @{}
          foreach ($line in Get-Content (Join-Path $env:PREVIOUS 'checksums.txt')) {
            $hash, $name = $line -split '  ', 2
            if ($name) { $listed[$name] = $hash }
          }
          foreach ($name in $verified) {
            if (-not $listed.ContainsKey($name)) { throw "$name has no line in $tag's checksums.txt" }
            if ((Get-FileHash -LiteralPath (Join-Path $env:PREVIOUS $name) -Algorithm SHA256).Hash -ne $listed[$name]) { throw "$name does not match $tag's checksums.txt" }
            Write-Host "$name matches $tag's checksums.txt"
          }
          foreach ($name in $unverifiable) {
            if ($listed.ContainsKey($name)) { throw "$name is now listed in $tag's checksums.txt: it belongs with the verified files" }
            $said = "$name is not listed in $tag's checksums.txt, which names the release's archives and packages alone, so it is used as downloaded, unverified."
            Write-Host $said
            "- $said" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          Write-Host "the previous release is $tag"
          "- the previous release is $tag" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Install this release over the previous release's Jason Desktop, as its updater runs an installer
        id: over-previous
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Install this release over the previous release's Jason Desktop, as its updater runs an installer"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step InstallOverPrevious -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Previous $env:PREVIOUS
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      - name: Uninstall from Installed apps
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Uninstall from Installed apps"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Needs 'Install this release over the previous release''s Jason Desktop, as its updater runs an installer=${{ steps.over-previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromInstalledApps -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-installed-apps-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-installed-apps-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The path every command-line user takes, on the release's signed packages: the move asserted in full, and a
      # released start that says nothing of a test build.
      - name: Update the previous release's command-line Jason with its own update apply, and move it into Jason Desktop
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: pwsh
        env:
          LEG: "Update the previous release's command-line Jason with its own update apply, and move it into Jason Desktop"
          JASON_Update__CheckEnabled: 'false'
          JASON_PROOF_BUILD: release
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the previous release=${{ steps.previous.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step FromPrevious -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -Previous $env:PREVIOUS
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromTerminal -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-previous-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-previous-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # The one-installation release, named, the second pin (TWO PINS above): v0.49.0, a release of the world after, which
      # installs Jason Desktop alone, is the one this release updates from as a person's Jason of one installation does.
      # Never read as the latest published release: that moves under a proof that ran, and once this release is
      # published it is this release, with nothing to update from. Its files come from its public downloads. No token:
      # the repository's releases are public.
      - name: Fetch the one-installation release this one updates from
        id: one-installation
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          ONE_INSTALLATION_RELEASE: v0.49.0
        run: |
          $release = "v$($env:VERSION -replace '-.*$', '')"
          $tag = $env:ONE_INSTALLATION_RELEASE
          if ($tag -ceq $release) { throw "the one-installation release named, $tag, is the one this tree builds: there is no earlier release of one installation to update from here" }
          New-Item -ItemType Directory -Force -Path $env:ONE_INSTALLATION | Out-Null
          # Every file fetched is in one of two lists, by name. The verified ones are held to checksums.txt: a file with no
          # line there, or a digest that differs, fails. checksums.txt names the release's archives and packages alone, so
          # the others are used as downloaded, each said unverified; one checksums.txt comes to list fails until it is moved.
          # The setup is what that release's install.ps1 installs, checking it against the same checksums.txt itself.
          $verified = @('jason-desktop-windows-x64-setup.exe')
          $unverifiable = @('install.ps1', 'manifest.json')
          foreach ($name in @('checksums.txt') + $verified + $unverifiable) {
            Invoke-WebRequest -Uri "https://github.com/reply-team/jason-ai/releases/download/$tag/$name" -OutFile (Join-Path $env:ONE_INSTALLATION $name) -UseBasicParsing -TimeoutSec 600
          }
          $listed = @{}
          foreach ($line in Get-Content (Join-Path $env:ONE_INSTALLATION 'checksums.txt')) {
            $hash, $name = $line -split '  ', 2
            if ($name) { $listed[$name] = $hash }
          }
          foreach ($name in $verified) {
            if (-not $listed.ContainsKey($name)) { throw "$name has no line in $tag's checksums.txt" }
            if ((Get-FileHash -LiteralPath (Join-Path $env:ONE_INSTALLATION $name) -Algorithm SHA256).Hash -ne $listed[$name]) { throw "$name does not match $tag's checksums.txt" }
            Write-Host "$name matches $tag's checksums.txt"
          }
          foreach ($name in $unverifiable) {
            if ($listed.ContainsKey($name)) { throw "$name is now listed in $tag's checksums.txt: it belongs with the verified files" }
            $said = "$name is not listed in $tag's checksums.txt, which names the release's archives and packages alone, so it is used as downloaded, unverified."
            Write-Host $said
            "- $said" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          Write-Host "the one-installation release this one updates from is $tag"
          "- the one-installation release this one updates from is $tag" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      # The path a person with Jason Desktop of one installation takes, on the release's signed packages: that release
      # installed by its own install.ps1, no window open, its carried jason update apply pinned to this release, from the
      # feed served on this machine. It hands the update to its own Jason Desktop, whose updater checks this release's
      # setup is the release publisher's and runs it, then runs this release's carried jason update apply --finish; the
      # leg holds that it said so, and ended complete. Then the uninstall from a new terminal, compared with the machine
      # before.
      - name: Update the one-installation release's Jason Desktop with its own jason update apply, finished by this release's jason
        id: from-one-installation
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: pwsh
        env:
          LEG: "Update the one-installation release's Jason Desktop with its own jason update apply, finished by this release's jason"
          JASON_Update__CheckEnabled: 'false'
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Clean -Needs 'Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}', 'The machine before anything is installed=${{ steps.before.outcome }}', 'Fetch the one-installation release this one updates from=${{ steps.one-installation.outcome }}'
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step FromOneInstallation -Out $env:OUT -Feed $env:FEED -Version $env:VERSION -OneInstallation $env:ONE_INSTALLATION
          ./.github/scripts/Test-InstallationWindows.ps1 -Step UninstallFromTerminal -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Listing -Out $env:OUT -Name after-one-installation-uninstall
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Compare -Out $env:OUT -Name after-one-installation-uninstall -Against before
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      - name: Read the module path Windows PowerShell rebuilds from an empty one
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        env:
          LEG: "Read the module path Windows PowerShell rebuilds from an empty one"
        run: |
          ./.github/scripts/Test-InstallationWindows.ps1 -Step Begin -Out $env:OUT -Leg $env:LEG -Reading
          if (Test-Path -LiteralPath (Join-Path $env:OUT 'skip')) { exit 0 }
          ./.github/scripts/Test-InstallationWindows.ps1 -Step ModulePath -Out $env:OUT
          ./.github/scripts/Test-InstallationWindows.ps1 -Step End -Out $env:OUT -Leg $env:LEG

      # Each leg's listing is compared with the machine before as it ends, and a divergence is recorded there; each leg that
      # failed or was not run is recorded by its name. All of it is read here, last, and fails the job with the list.
      - name: The machine after every uninstall is the machine before
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/scripts/Test-InstallationWindows.ps1 -Step Held -Out $env:OUT

      - name: Say what this job does not prove
        timeout-minutes: 20
        if: always()
        shell: pwsh
        env:
          ONE_INSTALLATION_LEG: ${{ steps.from-one-installation.outcome }}
          ONE_INSTALLATION_LEG_NAME: "Update the one-installation release's Jason Desktop with its own jason update apply, finished by this release's jason"
        run: |
          # The one-installation release's handing is said proven only where its leg's step succeeded having run to its end:
          # a leg its begin does not run ends its step green too, and never reaches its end. A step the run's cancelling
          # stopped says so.
          $ended = Join-Path $env:OUT 'legs-ended.txt'
          $handed = if ($env:ONE_INSTALLATION_LEG -ceq 'success' -and (Test-Path -LiteralPath $ended) -and @(Get-Content -LiteralPath $ended) -ccontains $env:ONE_INSTALLATION_LEG_NAME) { 'is proven here, by its leg' } elseif ($env:ONE_INSTALLATION_LEG -ceq 'failure') { 'is not proven here: its leg failed' } elseif ($env:ONE_INSTALLATION_LEG -ceq 'cancelled') { 'is not proven here: its leg was cancelled' } else { 'is not proven here: its leg was not run' }
          @(
            '### What this job does not prove',
            "- This release's own updater, end to end: no next build is made, so this release's command line handing an update to its Jason Desktop, with no window and with one open, is not proven here; the one-installation release's command line handing this release to its Jason Desktop, with no window, $handed.",
            '- SmartScreen and the mark of the web on a setup a browser downloaded, and a standard account: the runner''s user is an administrator whose downloads carry no mark.',
            '- The previous release''s own Desktop updater reaching this release: it reads only the published releases; this job runs this release''s installer as that updater would.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Keep the listings
        timeout-minutes: 20
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-windows-listings
          path: installation
          if-no-files-found: ignore

  proof-macos:
    name: The proof on osx-arm64
    needs: [version, macos, skills]
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OUT: ${{ github.workspace }}/installation
      FEED: ${{ github.workspace }}/feed
      PREVIOUS: ${{ github.workspace }}/previous
      ONE_INSTALLATION: ${{ github.workspace }}/one-installation
    steps:
      - uses: actions/checkout@v7

      # The archive, the desktop's Mac packages and update feed, and the skills' package, as the osx-arm64 job and the
      # skills' job uploaded them, with the manifest and the checksums written over them for osx-arm64 alone.
      - uses: actions/download-artifact@v7
        with:
          name: jason-osx-arm64
          path: feed

      - uses: actions/download-artifact@v7
        with:
          name: jason-desktop-osx-x64
          path: feed

      - uses: actions/download-artifact@v7
        with:
          name: jason-skills
          path: feed

      # The id of the folder this release's jason extracts its native libraries to under ~/.net/jason, read from the archive
      # with the host's base pointed elsewhere, so that the compares tell it from the previous release's.
      - name: Read the folder this release's jason extracts its native libraries to
        timeout-minutes: 20
        shell: bash
        run: |
          unpacked="$RUNNER_TEMP/extract-probe-archive"
          mkdir -p "$unpacked"
          tar -xzf "$FEED/jason-osx-arm64.tar.gz" -C "$unpacked"
          executable="$(find "$unpacked" -type f -name jason)"
          [ "$(printf '%s\n' "$executable" | grep -c .)" = 1 ] || { echo "::error::jason-osx-arm64.tar.gz holds no single jason: $executable"; exit 1; }
          bash .github/scripts/test-installation-macos.sh extracted "$executable"

      - name: Assemble the feed the way a release is assembled
        id: feed
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/scripts/Write-ProofFeed.ps1 -Rid osx-arm64 -Version $env:VERSION -Directory $env:FEED

      - name: The machine before anything is installed
        id: before
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: |
          mkdir -p "$HOME/.claude" "$HOME/.codex" "$HOME/.agents/skills/quick-start"
          printf "a person's own skill" > "$HOME/.agents/skills/quick-start/SKILL.md"
          bash .github/scripts/test-installation-macos.sh listing before

      # From here on no leg's failure stops the legs after it: each runs unless the job was cancelled, begins from the
      # machine before (one an earlier failed leg left is taken off by the product's own uninstalls, and said so) or says
      # it was not run and which step it needed, and the job fails at its end, in the last step, with the list.
      # install.sh as this release publishes it, unchanged: it holds the application to the release's requirement. Then
      # Gatekeeper's own assessment of the application where it was put.
      - name: Install as an agent does, with the released install.sh, and assess it where it was put
        id: install
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "Install as an agent does, with the released install.sh, and assess it where it was put"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh install "$FEED" "$VERSION" "$GITHUB_WORKSPACE/install/install.sh"
          bash .github/scripts/test-installation-macos.sh assess
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      - name: Uninstall from a new terminal, refused first while the application runs
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "Uninstall from a new terminal, refused first while the application runs"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" "Install as an agent does, with the released install.sh, and assess it where it was put=${{ steps.install.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh refuse-while-open
          bash .github/scripts/test-installation-macos.sh uninstall-terminal
          bash .github/scripts/test-installation-macos.sh listing after-terminal-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-terminal-uninstall before
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # The application's archive as a browser leaves what it downloads, quarantined, installed by the same script, assessed
      # and started; then the uninstall the application's Uninstall Jason item starts.
      - name: Install from a quarantined download, and uninstall from the application's Uninstall Jason item
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "Install from a quarantined download, and uninstall from the application's Uninstall Jason item"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh quarantine "$FEED" "$RUNNER_TEMP/feed-quarantined"
          bash .github/scripts/test-installation-macos.sh install "$RUNNER_TEMP/feed-quarantined" "$VERSION" "$GITHUB_WORKSPACE/install/install.sh"
          bash .github/scripts/test-installation-macos.sh assess
          bash .github/scripts/test-installation-macos.sh uninstall-menu
          bash .github/scripts/test-installation-macos.sh listing after-menu-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-menu-uninstall before
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # The previous release, named: these legs begin in the world before one installation, and v0.48.7, a release of that
      # world, is the 0.48 release these legs were last read against: its install puts a command-line Jason of its own where
      # every leg that starts from a previous release expects one. Never the latest published release: once 0.49.0 is
      # published that is a release that installs Jason Desktop alone, and every such leg would fail on it. Its files come
      # from its public downloads. No token: the repository's releases are public.
      - name: Fetch the previous release
        id: previous
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          PREVIOUS_RELEASE: v0.48.7
        run: |
          release="v${VERSION%%-*}"
          tag="$PREVIOUS_RELEASE"
          [ "$tag" != "$release" ] || { echo "::error::the previous release named, $tag, is the one this tree builds: there is no previous release to update from here"; exit 1; }
          mkdir -p "$PREVIOUS"
          # Every file fetched is in one of two lists, by name. The verified ones are held to checksums.txt: a file with no
          # line there, or a digest that differs, fails. checksums.txt names the release's archives and packages alone, so
          # the others are used as downloaded, each said unverified; one checksums.txt comes to list fails until it is moved.
          verified="jason-osx-arm64.tar.gz jason-desktop-macos-arm64.zip"
          unverifiable="install.sh manifest.json"
          for name in checksums.txt $verified $unverifiable; do
            curl -fsSL --max-time 600 -o "$PREVIOUS/$name" "https://github.com/reply-team/jason-ai/releases/download/$tag/$name"
          done
          listed() { awk -v n="$1" 'index($0, "  ") > 0 && substr($0, index($0, "  ") + 2) == n' "$PREVIOUS/checksums.txt"; }
          for name in $verified; do
            line="$(listed "$name")"
            [ -n "$line" ] || { echo "::error::$name has no line in $tag's checksums.txt"; exit 1; }
            (cd "$PREVIOUS" && printf '%s\n' "$line" | shasum -a 256 -c - > /dev/null) || { echo "::error::$name does not match $tag's checksums.txt"; exit 1; }
            echo "$name matches $tag's checksums.txt"
          done
          for name in $unverifiable; do
            [ -z "$(listed "$name")" ] || { echo "::error::$name is now listed in $tag's checksums.txt: it belongs with the verified files"; exit 1; }
            said="$name is not listed in $tag's checksums.txt, which names the release's archives and packages alone, so it is used as downloaded, unverified."
            echo "$said"
            echo "- $said" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "the previous release is $tag"
          echo "- the previous release is $tag" >> "$GITHUB_STEP_SUMMARY"

      # The path every command-line user takes, on the release's signed packages: the move asserted in full, and a
      # released start that says nothing of a test build. Its begin names the previous release among what it needs, so the
      # held step excuses what that release's own install leaves, the launchd record and the profiles, only as this leg's.
      - name: Update the previous release's command-line Jason with its own update apply, and move it into Jason Desktop
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        env:
          LEG: "Update the previous release's command-line Jason with its own update apply, and move it into Jason Desktop"
          JASON_PROOF_BUILD: release
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}" "Fetch the previous release=${{ steps.previous.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh from-previous "$PREVIOUS" "$FEED" "$VERSION"
          bash .github/scripts/test-installation-macos.sh uninstall-terminal
          bash .github/scripts/test-installation-macos.sh listing after-previous-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-previous-uninstall before previous-profiles
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      # The one-installation release, named, the second pin (TWO PINS above): v0.49.0, a release of the world after, which
      # installs Jason Desktop alone, is the one this release updates from as a person's Jason of one installation does.
      # Never read as the latest published release: that moves under a proof that ran, and once this release is
      # published it is this release, with nothing to update from. Its files come from its public downloads. No token:
      # the repository's releases are public.
      - name: Fetch the one-installation release this one updates from
        id: one-installation
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          ONE_INSTALLATION_RELEASE: v0.49.0
        run: |
          release="v${VERSION%%-*}"
          tag="$ONE_INSTALLATION_RELEASE"
          [ "$tag" != "$release" ] || { echo "::error::the one-installation release named, $tag, is the one this tree builds: there is no earlier release of one installation to update from here"; exit 1; }
          mkdir -p "$ONE_INSTALLATION"
          # Every file fetched is in one of two lists, by name. The verified ones are held to checksums.txt: a file with no
          # line there, or a digest that differs, fails. checksums.txt names the release's archives and packages alone, so
          # the others are used as downloaded, each said unverified; one checksums.txt comes to list fails until it is moved.
          # The application's archive is what that release's install.sh installs, checking it against the same
          # checksums.txt itself.
          verified="jason-desktop-macos-arm64.zip"
          unverifiable="install.sh manifest.json"
          for name in checksums.txt $verified $unverifiable; do
            curl -fsSL --max-time 600 -o "$ONE_INSTALLATION/$name" "https://github.com/reply-team/jason-ai/releases/download/$tag/$name"
          done
          listed() { awk -v n="$1" 'index($0, "  ") > 0 && substr($0, index($0, "  ") + 2) == n' "$ONE_INSTALLATION/checksums.txt"; }
          for name in $verified; do
            line="$(listed "$name")"
            [ -n "$line" ] || { echo "::error::$name has no line in $tag's checksums.txt"; exit 1; }
            (cd "$ONE_INSTALLATION" && printf '%s\n' "$line" | shasum -a 256 -c - > /dev/null) || { echo "::error::$name does not match $tag's checksums.txt"; exit 1; }
            echo "$name matches $tag's checksums.txt"
          done
          for name in $unverifiable; do
            [ -z "$(listed "$name")" ] || { echo "::error::$name is now listed in $tag's checksums.txt: it belongs with the verified files"; exit 1; }
            said="$name is not listed in $tag's checksums.txt, which names the release's archives and packages alone, so it is used as downloaded, unverified."
            echo "$said"
            echo "- $said" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "the one-installation release this one updates from is $tag"
          echo "- the one-installation release this one updates from is $tag" >> "$GITHUB_STEP_SUMMARY"

      # The path a person with Jason Desktop of one installation takes, on the release's signed and notarized packages:
      # that release installed by its own install.sh, no window open, its carried jason update apply pinned to this
      # release, from the feed served on this machine. It hands the update to its own Jason Desktop, whose updater installs
      # it (Squirrel, which takes only an update signed by the application's own team, then ShipIt), then runs this
      # release's carried jason update apply --finish; the leg holds that it said so, and ended complete. Then Gatekeeper's
      # word on the application where the update left it, and the uninstall from a new terminal, compared with the machine
      # before.
      - name: Update the one-installation release's Jason Desktop with its own jason update apply, finished by this release's jason
        id: from-one-installation
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        env:
          LEG: "Update the one-installation release's Jason Desktop with its own jason update apply, finished by this release's jason"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Assemble the feed the way a release is assembled=${{ steps.feed.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}" "Fetch the one-installation release this one updates from=${{ steps.one-installation.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh from-one-installation "$ONE_INSTALLATION" "$FEED" "$VERSION"
          bash .github/scripts/test-installation-macos.sh assess
          bash .github/scripts/test-installation-macos.sh uninstall-terminal
          bash .github/scripts/test-installation-macos.sh listing after-one-installation-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-one-installation-uninstall before
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      - name: The machine after every uninstall is the machine before
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: bash .github/scripts/test-installation-macos.sh held

      - name: Say what this job does not prove
        timeout-minutes: 20
        if: always()
        shell: bash
        env:
          ONE_INSTALLATION_LEG: ${{ steps.from-one-installation.outcome }}
          ONE_INSTALLATION_LEG_NAME: "Update the one-installation release's Jason Desktop with its own jason update apply, finished by this release's jason"
        run: |
          # The one-installation release's handing is said proven only where its leg's step succeeded having run to its end:
          # a leg its begin does not run ends its step green too, and never reaches its end. A step the run's cancelling
          # stopped says so.
          if [ "$ONE_INSTALLATION_LEG" = success ] && grep -qxF -- "$ONE_INSTALLATION_LEG_NAME" "$OUT/legs-ended.txt" 2>/dev/null; then handed="is proven here, by its leg"
          elif [ "$ONE_INSTALLATION_LEG" = failure ]; then handed="is not proven here: its leg failed"
          elif [ "$ONE_INSTALLATION_LEG" = cancelled ]; then handed="is not proven here: its leg was cancelled"
          else handed="is not proven here: its leg was not run"; fi
          {
            echo '### What this job does not prove'
            echo "- This release's own updater, end to end: no next build is made, so this release's command line handing an update to its Jason Desktop, with no window and with one open, is not proven here; the one-installation release's command line handing this release to its Jason Desktop, with no window, $handed."
            echo "- The 0.48 Jason Desktop's own updater on a Mac reaching this release: it reads only the published releases, and this release ships without that proof."
            echo "- App Management and a person's Terminal: this runner's System Integrity Protection is off and its shell is granted, so a rename or delete of Jason.app passing here says nothing about a person's Mac."
            echo "- Each account of a shared Mac: the runner has one account."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the listings
        timeout-minutes: 20
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-macos-listings
          path: installation
          if-no-files-found: ignore

  # The x64 application on an Intel Mac: put in place by the plain steps a person takes with the archive, since install.sh
  # refuses an Intel Mac, then its signature, Gatekeeper's assessment, its jason and runtime, its window and its
  # uninstall, compared with the machine before. Nothing here announces Intel Macs. One leg, framed as every leg is.
  proof-macos-intel:
    name: The proof on an Intel Mac
    needs: [version, macos]
    runs-on: macos-26-intel
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OUT: ${{ github.workspace }}/installation
    steps:
      - uses: actions/checkout@v7

      - name: Download the x64 application
        uses: actions/download-artifact@v7
        id: download
        with:
          name: jason-desktop-osx-x64
          path: feed

      # The id of the folder the x64 application's jason extracts its native libraries to under ~/.net/jason, read with the
      # host's base pointed elsewhere, so that the compare tells it from another build's.
      - name: Read the folder the x64 application's jason extracts its native libraries to
        timeout-minutes: 20
        shell: bash
        run: |
          unpacked="$RUNNER_TEMP/extract-probe-archive"
          mkdir -p "$unpacked"
          ditto -x -k "$GITHUB_WORKSPACE/feed/jason-desktop-macos-x64.zip" "$unpacked"
          bash .github/scripts/test-installation-macos.sh extracted "$unpacked/Jason.app/Contents/Resources/bundle/jason"

      - name: The machine before anything is installed
        id: before
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: bash .github/scripts/test-installation-macos.sh listing before

      - name: Put the x64 application in place, run it and uninstall it
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          LEG: "Put the x64 application in place, run it and uninstall it"
        run: |
          bash .github/scripts/test-installation-macos.sh begin "$LEG" clean "Download the x64 application=${{ steps.download.outcome }}" "The machine before anything is installed=${{ steps.before.outcome }}"
          [ ! -e "$OUT/skip" ] || exit 0
          bash .github/scripts/test-installation-macos.sh intel "$GITHUB_WORKSPACE/feed/jason-desktop-macos-x64.zip" "$VERSION"
          bash .github/scripts/test-installation-macos.sh listing after-intel-uninstall
          bash .github/scripts/test-installation-macos.sh compare after-intel-uninstall before
          bash .github/scripts/test-installation-macos.sh end "$LEG"

      - name: The machine after every uninstall is the machine before
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: bash .github/scripts/test-installation-macos.sh held

      - name: Keep the listings
        timeout-minutes: 20
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-macos-intel-listings
          path: installation
          if-no-files-found: ignore

  release:
    name: Assemble and publish
    needs: [version, build, macos, windows, plugin, ui, skills, proof-windows, proof-macos, proof-macos-intel]
    runs-on: ubuntu-latest
    # The only job that may write to this repository, and what it writes is the release. It builds and runs nothing
    # that was built, so a test on a matrix runner cannot publish anything, and nothing is published when a platform's
    # job or a package's job failed: the macOS and Windows jobs verified their archived signatures, and the three
    # proof jobs installed, updated and uninstalled the packages, before this job starts. It writes with this run's own
    # token, handed to the one step that publishes, and only outside a dry run in reply-team/jason-ai; anywhere else it assembles the release and says that it publishes nothing there. No action
    # runs here but the checkout and the artifacts' download and upload: an action is handed the token whatever it is
    # for, so any other would publish as surely as that step does, and would hold to the same two conditions. It runs in
    # the signing environment, which only release tags and release branches may run in.
    environment: signing
    permissions:
      contents: write
    # One release job publishes at a time, across every run of this workflow: it reads which release is the latest and
    # then publishes, and two doing that at once would read the same latest and both claim it. A run waiting here never
    # cancels the one publishing. GitHub keeps one run waiting in a group, so a third that arrives meanwhile cancels the
    # waiting one, and that run is re-run once the others have published.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      # The checkout leaves no token in git's config: a step after it could push with this job's write. Nothing here
      # needs git's credentials; gh takes its token from GH_TOKEN, on the one step that is handed it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: jason-*
          merge-multiple: true
          path: artifacts/release

      - name: Write the manifest and the checksums
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The three fragments become manifest.json — what a running Jason reads to learn this release exists —
          # and checksums.txt, which lists the plugins', the UI's, the skills' and the desktop's files after the archives;
          # the manifest names the plugins' under its plugins and none of the desktop's, which update themselves from
          # their own feeds, latest.yml, latest-mac.yml and latest-linux.yml. A platform or a package missing from the
          # download, or an archive that no longer hashes to what its fragment says, stops the release here. The notes are
          # read at the product's address, which leads to the release's page in reply-team/jason-ai. Every release from
          # 0.20.0 names 0.19.0 as the oldest version that updates to it in one apply: 0.19.0 is the first applier that loads what it
          # needs and hands over to the new executable, so an older build goes through it first. The floor moves only
          # when an applier change raises it. Each plugin's entry is the tag's digest list of that package, whose last
          # line is the package this release publishes, so nothing is built or hashed here to say which package that is.
          ./.github/scripts/Write-Manifest.ps1 -Version $env:VERSION -Directory artifacts/release -Require win-x64,linux-x64,osx-arm64 -Plugins jason-plugin-reply.zip,jason-plugin-journal-forwarder.zip,jason-plugin-ntfy.zip,jason-plugin-slack.zip,jason-plugin-telegram.zip,jason-ui.zip,jason-skills.zip,jason-desktop-windows-x64-setup.exe,jason-desktop-windows-x64-setup.exe.blockmap,latest.yml,jason-desktop-macos-arm64.dmg,jason-desktop-macos-arm64.zip,jason-desktop-macos-arm64.zip.blockmap,jason-desktop-macos-x64.dmg,jason-desktop-macos-x64.zip,jason-desktop-macos-x64.zip.blockmap,latest-mac.yml,jason-desktop-linux-x64.deb,jason-desktop-linux-x64.AppImage,latest-linux.yml -ReleaseNotesUrl "https://get.jasonharness.ai/releases/tag/v$env:VERSION" -MinUpgradeFrom 0.19.0 -PluginDigests plugins/reply.digests,plugins/journal-forwarder.digests,plugins/ntfy.digests,plugins/slack.digests,plugins/telegram.digests
          Get-Content artifacts/release/manifest.json
          Get-Content artifacts/release/checksums.txt

      - name: Write the notes
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          # The template opens with a comment addressed to whoever edits the template. Markdown hides an HTML
          # comment when a page is rendered, but a release body is read raw as well - by the API, by
          # `gh release view`, in the notification mail - so what ships carries none of them.
          $notes = (Get-Content .github/release-notes-template.md -Raw).ReplaceLineEndings("`n").Replace('{{version}}', $env:VERSION)
          $notes = [regex]::Replace($notes, '(?s)<!--.*?-->', '').TrimStart()

          # The release's own notes stand where the template says {{notes}}, after its opening paragraph, without their
          # comments and without their first line, `# Jason <version>`, which the release's title says already, and
          # with {{version}} filled in as the template's is. The version job decided whether they are this version's;
          # when they are not, the template stands alone.
          $own = ''
          if ($env:NOTES -eq 'true') {
            $own = [regex]::Replace(((Get-Content -LiteralPath RELEASE-NOTES.md -Raw) ?? '').ReplaceLineEndings("`n"), '(?s)<!--.*?-->', '').TrimStart()
            $own = ($own -replace '^[^\n]*\n?', '').Trim().Replace('{{version}}', $env:VERSION)
          }
          $notes = if ($own) { $notes.Replace('{{notes}}', $own) } else { [regex]::Replace($notes, '\{\{notes\}\}\n+', '') }
          Set-Content artifacts/release/notes.md -Value $notes -NoNewline

      # What a dry run hands back to read: the archives, the packages, the manifest, the checksums and the notes as the
      # release would have carried them. Kept for a week: the archives and packages are this run's other artifacts as
      # well.
      - name: Keep what a dry run assembled
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-v${{ needs.version.outputs.version }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

      - name: Say that nothing is published here
        if: ${{ github.repository != 'reply-team/jason-ai' }}
        shell: pwsh
        run: |
          # A run in any other repository that holds this workflow and the signing secrets gets this far and assembles
          # the release; the step that publishes and the tap's job hold to reply-team/jason-ai, so this line is all such a
          # run says of it.
          Write-Host "::notice title=Not published::This run is in $env:GITHUB_REPOSITORY, and a release is published from reply-team/jason-ai alone: nothing is published here and the tap is not asked."

      - name: Publish the release
        if: ${{ !inputs.dry_run && github.repository == 'reply-team/jason-ai' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A tag publishes its release at once, on the tag that was pushed: --verify-tag stops the step rather than let
          # gh make a tag of its own. gh uploads the assets to a draft and publishes it once every asset is there, so a
          # failed upload leaves no published release behind. The button makes a draft and nothing else: no tag exists,
          # so the draft names the commit this run built. The draft is for reading and is deleted afterwards; a release
          # is published only by its tag, never by publishing a draft.
          #
          # [string[]] and not a bare assignment: PowerShell unrolls a one-element array assigned from an `if`
          # into a scalar string, and `+=` on a string concatenates rather than appends.
          $repository = $env:GITHUB_REPOSITORY
          [string[]] $how = if ($env:EVENT -eq 'push') { '--verify-tag' } else { '--draft', '--target', $env:GITHUB_SHA }

          # What gh answers about one release, or $null when there is no such release. gh says "release not found" for
          # that, and only that is taken as none: any other failure - a refused token, a server that did not answer -
          # stops the step before anything is deleted or created, so that the run is re-run. Taken as none, a failed
          # read of the latest would let a fix to an older line take latest from a newer release.
          function Read-Release([string[]] $asked) {
            $said = @(gh release view @asked 2>&1)
            $code = $LASTEXITCODE
            $errors = (@($said | Where-Object { $_ -is [System.Management.Automation.ErrorRecord] } | ForEach-Object { "$_" }) -join ' ').Trim()
            $answer = (@($said | Where-Object { $_ -isnot [System.Management.Automation.ErrorRecord] } | ForEach-Object { "$_" }) -join "`n").Trim()
            if ($code -eq 0) { return $answer }
            if ($errors -ceq 'release not found') { return $null }
            throw "gh release view $($asked -join ' ') exited with ${code}: $errors"
          }

          # A version carrying a pre-release part is a pre-release, so that it never becomes the latest release: `latest`
          # is what the default update feed advertises and what both install one-liners download. The rule is the
          # version's, not the event's: a candidate is a candidate however it arrived. A tag's release otherwise becomes
          # the latest unless a newer one already is - a fix to an older line published after a newer release must not
          # take latest from it. A draft is never made the latest; that is decided when a release is published.
          if ($env:VERSION -clike '*-*') { $how += '--prerelease' } elseif ($env:EVENT -eq 'push') {
            $latest = Read-Release '-R', $repository, '--json', 'tagName', '--jq', '.tagName'
            if ($latest -and [semver]$latest.Substring(1) -gt [semver]$env:VERSION) {
              Write-Host "$latest is newer and stays the latest release; v$env:VERSION is published beside it."
              $how += '--latest=false'
            } else {
              $how += '--latest'
            }
          }

          # A draft this version left behind - an earlier button's draft of the same number, inspected and pressed
          # again, or kept until the tag - holds the name that is about to be created, so it is deleted first, and only
          # if it really is a draft. A published release of this version is somebody's installed software: the job stops
          # before it creates anything. No --cleanup-tag; a draft has no tag to clean up.
          $existing = Read-Release "v$env:VERSION", '-R', $repository, '--json', 'isDraft', '--jq', '.isDraft'
          if ($null -ne $existing -and $existing -ne 'true') {
            throw "v$env:VERSION is already published in $repository. A published release is somebody's installed software, and this job replaces only a draft."
          }
          if ($existing -eq 'true') {
            Write-Host "Deleting the draft of v$env:VERSION that an earlier run left behind."
            gh release delete "v$env:VERSION" -R $repository --yes
            if ($LASTEXITCODE -ne 0) { throw "gh release delete exited with $LASTEXITCODE" }
          }

          # gh names an asset by its file name. The archives, the feed, the packages of reply, journal-forwarder, ntfy,
          # slack and telegram, the UI's and the skills', and the desktop's installer, Mac and Linux packages, blockmaps and
          # update feeds were assembled under artifacts/release; the install scripts are the tag's own, so a one-liner pinned to
          # this release runs the script it was published with.
          $assets = @('artifacts/release/jason-win-x64.zip', 'artifacts/release/jason-linux-x64.tar.gz', 'artifacts/release/jason-osx-arm64.tar.gz', 'artifacts/release/manifest.json', 'artifacts/release/checksums.txt') + @('install/install.sh', 'install/install.ps1') + @('artifacts/release/jason-plugin-reply.zip', 'artifacts/release/jason-plugin-journal-forwarder.zip', 'artifacts/release/jason-plugin-ntfy.zip', 'artifacts/release/jason-plugin-slack.zip', 'artifacts/release/jason-plugin-telegram.zip', 'artifacts/release/jason-ui.zip', 'artifacts/release/jason-skills.zip') + @('artifacts/release/jason-desktop-windows-x64-setup.exe', 'artifacts/release/jason-desktop-windows-x64-setup.exe.blockmap', 'artifacts/release/latest.yml', 'artifacts/release/jason-desktop-macos-arm64.dmg', 'artifacts/release/jason-desktop-macos-arm64.zip', 'artifacts/release/jason-desktop-macos-arm64.zip.blockmap', 'artifacts/release/jason-desktop-macos-x64.dmg', 'artifacts/release/jason-desktop-macos-x64.zip', 'artifacts/release/jason-desktop-macos-x64.zip.blockmap', 'artifacts/release/latest-mac.yml', 'artifacts/release/jason-desktop-linux-x64.deb', 'artifacts/release/jason-desktop-linux-x64.AppImage', 'artifacts/release/latest-linux.yml')
          gh release create "v$env:VERSION" -R $repository @how --title "Jason $env:VERSION" --notes-file artifacts/release/notes.md @assets
          if ($LASTEXITCODE -ne 0) { throw "gh release create exited with $LASTEXITCODE" }
          if ($env:EVENT -eq 'push') { Write-Host "v$env:VERSION is published." } else { Write-Host "The draft of v$env:VERSION is made." }

  # Switched off: the formula installs the command line alone, and from 0.49.0 Jason on a Mac is Jason Desktop, so the
  # formula stays at the last 0.48 release it carries; this job comes back, bumping a cask, with the release that
  # carries one. The last clause of its condition is what switches it off.
  #
  # Asks the tap to bump its formula once a tag's release is published: after the release job succeeded, never after it
  # failed or was skipped. A 2xx proves only that a bump run was queued; the bump checks, tests and pushes in the tap, and
  # changes nothing when the address still answers the previous release or when this one is a candidate or an older
  # line's fix, since it reads the latest release. The tap's six-hour schedule catches whatever this misses. A job of its
  # own, so that "Re-run failed jobs" after a refusal runs this job alone, with the secret as it is then, and never the
  # publication again, which refuses a release that is already published. Once a run can no longer be re-run, the tap's
  # own six-hour schedule and its bump button are what move it. Its token is a fine-grained one with Actions read and
  # write on reply-team/homebrew-tap alone, kept in the signing environment, which only release tags and release
  # branches may run in.
  tap:
    name: Tell the tap
    needs: release
    if: ${{ github.event_name == 'push' && github.repository == 'reply-team/jason-ai' && false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: signing
    # Nothing of this repository's: the job checks nothing out, and its one token is the tap's.
    permissions: {}
    steps:
      - name: Dispatch the tap's bump
        shell: pwsh
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        run: |
          if (-not $env:TOKEN) {
            Write-Host '::error::HOMEBREW_TAP_DISPATCH_TOKEN is not set: the tap moves at its six-hour schedule instead. Store a fine-grained token with Actions read and write on reply-team/homebrew-tap in the signing environment, then re-run this job.'
            exit 1
          }
          $tail = 'The release is published; the tap moves at its six-hour schedule until this job runs green.'

          # The bump takes no input: it reads the latest release's manifest itself, so the ref is all there is to send.
          # -SkipHttpErrorCheck hands a refusal back as a response, so its status is read below rather than thrown; a
          # request that gets no answer at all still throws.
          try {
            $response = Invoke-WebRequest -Method Post -Uri https://api.github.com/repos/reply-team/homebrew-tap/actions/workflows/bump.yml/dispatches -Headers @{ Authorization = "Bearer $env:TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType application/json -Body '{"ref":"main"}' -SkipHttpErrorCheck
          } catch {
            Write-Host "::error::GitHub could not be reached: $("$($_.Exception.Message)".TrimEnd('.')). $tail"
            exit 1
          }
          $status = [int] $response.StatusCode

          # A token that expires says when in a header of the response, as GitHub sent it when this was written, for
          # example "2026-11-25 13:50:00 UTC"; one without an expiry sends no such header. A warning never turns the job
          # red.
          $expiration = @($response.Headers['github-authentication-token-expiration'])[0]
          if ($expiration) {
            $at = [DateTimeOffset]::MinValue
            $text = $expiration.Trim() -replace ' UTC$', ' +00:00'
            if ([DateTimeOffset]::TryParseExact($text, 'yyyy-MM-dd HH:mm:ss zzz', [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::None, [ref] $at)) {
              $left = $at - [DateTimeOffset]::UtcNow
              $date = "$($at.UtcDateTime.ToString('yyyy-MM-dd HH:mm')) UTC"
              if ($left -le [TimeSpan]::Zero) {
                Write-Host "::warning title=Tap token::HOMEBREW_TAP_DISPATCH_TOKEN expired ${date}: make a new one and store it in the signing environment."
              } elseif ($left -lt [TimeSpan]::FromDays(14)) {
                $days = [int] [math]::Ceiling($left.TotalDays)
                $unit = if ($days -eq 1) { 'day' } else { 'days' }
                Write-Host "::warning title=Tap token::HOMEBREW_TAP_DISPATCH_TOKEN expires $date, in $days ${unit}: make a new one and store it in the signing environment before then."
              }
            } else {
              Write-Host "::warning title=Tap token::GitHub says HOMEBREW_TAP_DISPATCH_TOKEN expires '$expiration', which is not a date this job reads: look at the token's expiry yourself."
            }
          }

          # GitHub documents the answer as 200 with the run it queued, whose address is printed; an answer without one is
          # a bump queued all the same.
          if ($status -ge 200 -and $status -lt 300) {
            $queued = $null
            try { $queued = "$(($response.Content | ConvertFrom-Json).html_url)" } catch { $queued = $null }
            if ($queued) {
              Write-Host "The tap's bump is queued at $queued; it reads the latest release itself."
            } else {
              Write-Host "The tap's bump is queued; it reads the latest release itself."
            }
            exit 0
          }

          switch ($status) {
            401 { $why = 'HOMEBREW_TAP_DISPATCH_TOKEN was refused (expired or revoked): make a new one, store it in the signing environment, re-run this job.' }
            403 { $why = 'HOMEBREW_TAP_DISPATCH_TOKEN may not dispatch there: it needs Actions read and write on reply-team/homebrew-tap, and the organisation may still have to approve it.' }
            404 { $why = "HOMEBREW_TAP_DISPATCH_TOKEN does not reach reply-team/homebrew-tap's bump.yml: the repository is not selected for it, or the workflow moved." }
            default {
              $message = $null
              try { $message = "$(($response.Content | ConvertFrom-Json).message)".TrimEnd('.') } catch { $message = $null }
              $why = if ($message) { "GitHub answered ${status}: $message." } else { "GitHub answered $status." }
            }
          }
          Write-Host "::error::$why $tail"
          exit 1
