# A tag named v<version> builds the release: three native runners, each running the tests at the tag and
# packaging one platform through the same action ci.yml runs on every pull request, then one job — the only
# one that may write to the repository — assembles the manifest and the checksums and creates the release.
#
# The button (workflow_dispatch) builds the same thing as a draft, for a dry run. A draft's tag does not exist
# until the draft is published, so a dry run leaves nothing behind once its draft is deleted.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to build, without the v (0.2.0, 1.0.0-rc.1). The result is a draft; publishing it is what creates the tag.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: The version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          # The one place the version is decided; every job below is told it. A tag is `v` and a version, the
          # button gives the version itself, and anything else — v1.2, v01.2.3, a tag carrying build metadata —
          # stops the workflow here, before a runner has built anything. The build stamps its own metadata.
          $given = if ($env:EVENT -eq 'workflow_dispatch') { $env:REQUESTED } else { $env:TAG }
          $version = if ($env:EVENT -eq 'workflow_dispatch') { $given } elseif ($given -clike 'v*') { $given.Substring(1) } else { '' }

          $identifier = '(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)'
          if ($version -cnotmatch "^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-$identifier(?:\.$identifier)*)?$") {
            throw "'$given' is not a version this workflow builds: v0.2.0 or v1.0.0-rc.1 as a tag, 0.2.0 from the button."
          }

          Write-Host "version -> $version"
          "version=$version" >> $env:GITHUB_OUTPUT

  build:
    name: ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore runtime/Jason.slnx

      # One version through build, test and publish, so that what the tests ran is what the archive holds.
      - name: Build (warnings are errors)
        run: dotnet build runtime/Jason.slnx --configuration Release --no-restore -p:Version=${{ needs.version.outputs.version }}

      # The tests run at the tag, on the platform, before anything is packaged: a release is a build the tests passed.
      - name: Test (offline)
        run: dotnet test --solution runtime/Jason.slnx --configuration Release --no-build -p:Version=${{ needs.version.outputs.version }}

      - name: Package
        id: package
        uses: ./.github/actions/package
        with:
          rid: ${{ matrix.rid }}
          version: ${{ needs.version.outputs.version }}

      - name: Smoke-test the published executable
        shell: pwsh
        env:
          EXECUTABLE: ${{ steps.package.outputs.executable }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $exe = $env:EXECUTABLE
          $env:JASON_DATA_DIR = Join-Path ([IO.Path]::GetTempPath()) "jason-release-smoke"

          $elapsed = Measure-Command { & $exe --version | Tee-Object -Variable version }
          if ($LASTEXITCODE -ne 0) { throw "jason --version exited with $LASTEXITCODE" }
          Write-Host "jason --version -> $version ($([int]$elapsed.TotalMilliseconds) ms cold start)"

          # What it prints is the tag's version plus build metadata (+<commit>), which SemVer says to ignore.
          if (($version -split '\+')[0] -ne $env:VERSION) { throw "jason --version says '$version', and the tag says $env:VERSION" }

          $elapsed = Measure-Command { & $exe runtime status | Tee-Object -Variable status }
          $statusExit = $LASTEXITCODE
          Write-Host "jason runtime status -> exit $statusExit in $([int]$elapsed.TotalMilliseconds) ms: $status"
          if ($statusExit -ne 3) { throw "expected exit code 3 without a running runtime, got $statusExit" }
          if ($status -notmatch '"code":"no_descriptor"') { throw "expected a no_descriptor error envelope" }

          # The last command of this step is expected to exit 3, and pwsh would hand that on as the step's
          # own exit code. Everything asserted above passed, so the step succeeded.
          exit 0

  release:
    name: Assemble and publish
    needs: [version, build]
    runs-on: ubuntu-latest
    # The only job holding a token that can write. It creates the release and runs nothing that was built, so a
    # test on a matrix runner cannot publish anything, and nothing is created here when a matrix leg failed.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: jason-*
          merge-multiple: true
          path: artifacts/release

      - name: Write the manifest and the checksums
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The three fragments become manifest.json — what a running Jason reads to learn this release exists —
          # and checksums.txt. A platform missing from the download, or an archive that no longer hashes to what
          # its fragment says, stops the release here.
          ./.github/scripts/Write-Manifest.ps1 -Version $env:VERSION -Directory artifacts/release -Require win-x64,linux-x64,osx-arm64 -ReleaseNotesUrl "https://github.com/$env:REPOSITORY/releases/tag/v$env:VERSION"
          Get-Content artifacts/release/manifest.json
          Get-Content artifacts/release/checksums.txt

      - name: Write the notes
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (Get-Content .github/release-notes-template.md -Raw).Replace('{{version}}', $env:VERSION) | Set-Content artifacts/release/notes.md -NoNewline

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A tag push is the release, and the tag must already exist. The button makes a draft pointed at the
          # commit it built, so a dry run can be inspected and deleted; publishing the draft is what creates its tag.
          $how = if ($env:EVENT -eq 'workflow_dispatch') { @('--draft', '--target', $env:SHA) } else { @('--verify-tag') }

          # A version carrying a pre-release part is published as one. `latest` is what the default update feed
          # advertises and what both install one-liners download, so a candidate released without this would be
          # offered to every runtime that checks and installed by anybody who typed the one-liner that day. The
          # rule is the version's, not the event's: a candidate is a candidate however it arrived.
          if ($env:VERSION -clike '*-*') { $how += '--prerelease' } else { $how += '--latest' }
          $assets = 'jason-win-x64.zip', 'jason-linux-x64.tar.gz', 'jason-osx-arm64.tar.gz', 'manifest.json', 'checksums.txt' | ForEach-Object { "artifacts/release/$_" }
          gh release create "v$env:VERSION" @how --title "Jason $env:VERSION" --notes-file artifacts/release/notes.md @assets
          if ($LASTEXITCODE -ne 0) { throw "gh release create exited with $LASTEXITCODE" }
