# One packaging step for every place that packages: ci.yml runs it on each pull request, release.yml on a tag.
# It publishes one platform as a self-contained single-file executable, puts LICENSE and THIRD-PARTY-NOTICES
# beside it, archives the three under the platform's stable asset name, and writes the checksum and the manifest
# fragment a release is assembled from. The version is an input. The caller decides it — ci.yml asks the tree,
# release.yml asks the tag — and this action never reads a ref, so both call it the same way.
name: Package
description: Publish one platform of Jason and archive it under its release name, with a checksum and a manifest fragment.

inputs:
  rid:
    description: 'The platform to publish for: one of win-x64, linux-x64, osx-arm64, and osx-x64, which a release builds for the desktop alone and never publishes.'
    required: true
  version:
    description: 'The version to stamp, without a leading v (0.2.0, 1.0.0-rc.1). It reaches the build as -p:Version=.'
    required: true

  artifact:
    description: >
      What to call the uploaded artifact. The default is this platform's own name, which is what a release and
      every pull request want. A job that packages a second version in the same run says so here, because two
      uploads cannot share a name.
    required: false
    default: ''

  runtime-version:
    description: >
      The .NET runtime to publish on, as an exact version (10.0.13); it reaches the build as -p:RuntimeFrameworkVersion=.
      Empty, the default, is the SDK's own runtime, which is what a release and every platform job want. The update job
      names another, so that the version it updates to is built on a different runtime than the version it installed.
    required: false
    default: ''

  retention-days:
    description: >
      How many days the uploaded artifact is kept. 0, the default, is upload-artifact's own word for the repository's
      retention, which is what a release keeps; a pull request's run says fewer, because what it uploads is for the
      jobs of that run and for a person looking at a failure.
    required: false
    default: '0'

  sign-macos:
    description: >
      'true' signs a macOS executable, osx-arm64's or osx-x64's, with the Developer ID the apple-* inputs carry, has Apple notarize it and
      Gatekeeper assess it, between the publish and the staging, so that the archive and the caller's smoke test carry
      the signed file. Any other platform ignores it. The default, 'false', keeps the ad hoc signature the SDK writes at
      publish, which is what a pull request's build wants: ci.yml never signs, and never holds the identity.
    required: false
    default: 'false'

  # The six Apple secrets. A composite action is handed a secret only as an input, so the caller passes each one under
  # the input of its name; inside, they reach the steps that use them through env alone, and none is ever printed.
  apple-developer-id-p12-base64:
    description: The Developer ID Application certificate and its private key, as a base64 .p12. Read only when signing.
    required: false
    default: ''
  apple-developer-id-p12-password:
    description: The .p12's password. Read only when signing.
    required: false
    default: ''
  apple-notary-key-p8:
    description: The text of the App Store Connect API key (.p8) the notary is asked with. Read only when signing.
    required: false
    default: ''
  apple-notary-key-id:
    description: That key's id. Read only when signing.
    required: false
    default: ''
  apple-notary-issuer-id:
    description: That key's issuer. Read only when signing.
    required: false
    default: ''
  apple-team-id:
    description: The team the identity must belong to. The identity is found by it, never by a name written here.
    required: false
    default: ''

  sign-windows:
    description: >
      'true' signs the win-x64 executable through Artifact Signing with the account and the certificate profile the
      azure-* inputs name, timestamps it and verifies it, between the publish and the staging, so that the archive and
      the caller's smoke test carry the signed file. Any other platform ignores it. The default, 'false', leaves the
      executable unsigned, which is what a pull request's build wants: ci.yml never signs, and never signs in to Azure.
    required: false
    default: 'false'

  # The five Azure secrets. None is a credential: the sign-in is the job's own OIDC token, exchanged through the federated
  # credential of the application the client id names, so no client secret exists. They still reach only the two steps
  # that take them, as their inputs, and none is ever printed.
  azure-tenant-id:
    description: The tenant the signing application belongs to. Read only when signing.
    required: false
    default: ''
  azure-client-id:
    description: The application whose federated credential accepts this job's OIDC token. Read only when signing.
    required: false
    default: ''
  azure-signing-account:
    description: The Artifact Signing account's name. Read only when signing.
    required: false
    default: ''
  azure-signing-endpoint:
    description: The account's regional endpoint, as a URL. Read only when signing.
    required: false
    default: ''
  azure-signing-profile:
    description: The certificate profile the executable is signed with. Read only when signing.
    required: false
    default: ''

  desktop:
    description: >
      'true' also builds the desktop's packages with electron-builder from desktop/ of the same tree, carrying the
      executables the release signed, and signs them as those are signed, while the identity is held: on win-x64 the nsis
      installer, whose Jason.exe, uninstaller and installer are signed through Artifact Signing; on osx-x64, after the
      osx-arm64 call of the same job, a dmg and a zip for each Mac architecture, signed with the Developer ID and
      notarized. Each is read back and uploaded as jason-desktop-<rid>, which the release publishes. It needs the
      platform's signing inputs; without them, and on any other platform, it is ignored. The default, 'false', builds no
      desktop, which is what a pull request's build wants: ci.yml never builds one.
    required: false
    default: 'false'

outputs:
  executable:
    description: The published executable, for the caller's smoke test.
    value: ${{ steps.publish.outputs.executable }}
  archive:
    description: The archive, under its stable asset name.
    value: ${{ steps.name.outputs.archive }}
  asset:
    description: The archive's file name, which is the name the manifest and the feed use.
    value: ${{ steps.name.outputs.asset }}

runs:
  using: composite
  steps:
    - name: Name the asset
      id: name
      shell: pwsh
      env:
        RID: ${{ inputs.rid }}
      run: |
        # The names carry no version, which is what makes the latest-download URL resolve for every release
        # there will ever be. The same table is ReleaseAssets.cs, and a test reads it from there to hold this
        # file to it; a platform that is not in the table is refused rather than given a made-up name.
        $asset = switch ($env:RID) {
          'win-x64'   { 'jason-win-x64.zip' }
          'linux-x64' { 'jason-linux-x64.tar.gz' }
          'osx-arm64' { 'jason-osx-arm64.tar.gz' }
          'osx-x64'   { 'jason-osx-x64.tar.gz' }
          default     { throw "No release is built for '$env:RID'." }
        }
        $executable = if ($env:RID -like 'win-*') { 'jason.exe' } else { 'jason' }

        "asset=$asset" >> $env:GITHUB_OUTPUT
        "archive=artifacts/release/$asset" >> $env:GITHUB_OUTPUT
        "executable=$executable" >> $env:GITHUB_OUTPUT

    - name: Publish self-contained single-file executable
      id: publish
      shell: pwsh
      env:
        RID: ${{ inputs.rid }}
        VERSION: ${{ inputs.version }}
        RUNTIME_VERSION: ${{ inputs.runtime-version }}
        EXECUTABLE: ${{ steps.name.outputs.executable }}
        SIGN_MACOS: ${{ startsWith(inputs.rid, 'osx-') && inputs.sign-macos == 'true' }}
      run: |
        $publish = "artifacts/publish/$env:RID"
        $runtime = @(if ($env:RUNTIME_VERSION) { "-p:RuntimeFrameworkVersion=$env:RUNTIME_VERSION" })

        # A signed macOS executable loads only the native libraries its own team signed, so the ones the bundle
        # carries are copied out for the signing steps below, which bundle them again once they are signed. The
        # project reads the directory as an absolute path.
        $natives = Join-Path $PWD "artifacts/natives/$env:RID"
        $copied = @(if ($env:SIGN_MACOS -eq 'true') { "-p:CopyBundledNativeLibrariesTo=$natives" })
        dotnet publish dotnet/src/Jason.App --configuration Release --runtime $env:RID --self-contained -p:PublishSingleFile=true "-p:Version=$env:VERSION" @runtime @copied --output $publish
        if ($LASTEXITCODE -ne 0) { throw "dotnet publish exited with $LASTEXITCODE" }
        if ($copied) { "natives=$natives" >> $env:GITHUB_OUTPUT }

        # One executable and its symbols, and nothing else. A native library left beside the executable —
        # SQLite's, should the project ever stop bundling it — is a file the archive would not carry and the
        # installed program could not run without, so it stops the packaging here rather than somebody's first
        # `jason campaign create`.
        $stray = Get-ChildItem $publish -File | Where-Object { $_.Name -ne $env:EXECUTABLE -and $_.Extension -ne '.pdb' }
        if ($stray) { throw "The publish directory holds more than the executable: $($stray.Name -join ', ')" }

        "executable=$publish/$env:EXECUTABLE" >> $env:GITHUB_OUTPUT

    # The Windows executable is signed between the publish and the staging, so that the staged copy, the archive and the
    # caller's smoke test all carry the one signed file. Only a release asks for it. The sign-in is the job's own OIDC
    # token, which the caller's job alone may ask for, traded through the application's federated credential; it is
    # signed in right before the signature, since the Azure CLI cannot renew a token it was handed, and forgotten after
    # it whatever happened in between. No step here traces its commands or prints an input.
    - name: Name the Windows executable to sign, once every Azure input is given
      id: signable
      if: inputs.rid == 'win-x64' && inputs.sign-windows == 'true'
      shell: pwsh
      env:
        EXECUTABLE: ${{ steps.publish.outputs.executable }}
        # The names of the inputs that are empty, never their values: this step holds none of them.
        MISSING: >-
          ${{ format('{0} {1} {2} {3} {4}',
            inputs.azure-tenant-id == '' && 'azure-tenant-id' || '',
            inputs.azure-client-id == '' && 'azure-client-id' || '',
            inputs.azure-signing-account == '' && 'azure-signing-account' || '',
            inputs.azure-signing-endpoint == '' && 'azure-signing-endpoint' || '',
            inputs.azure-signing-profile == '' && 'azure-signing-profile' || '') }}
      run: |
        $missing = @($env:MISSING -split '\s+' | Where-Object { $_ })
        if ($missing.Count -gt 0) {
          Write-Host "::error title=Signing::Signing was asked for without every Azure input; empty: $($missing -join ', ')."
          exit 1
        }

        # The signing action takes absolute paths only.
        "file=$((Resolve-Path -LiteralPath $env:EXECUTABLE).Path)" >> $env:GITHUB_OUTPUT

    # The desktop's build tooling runs on a Node set up before the sign-in, so the action that installs it never runs
    # beside the identity.
    - uses: actions/setup-node@v5
      if: inputs.rid == 'win-x64' && inputs.sign-windows == 'true' && inputs.desktop == 'true'
      with:
        node-version: 24

    # No subscription: the signing service needs a token of the tenant alone, and the application's role is on the
    # signing account, never on a subscription a sign-in would select. The two actions that hold the identity are pinned
    # to the commit of a release, with its tag beside it, where every other action keeps its major tag: a tag can move.
    - name: Sign in to Azure with this job's OIDC token
      if: inputs.rid == 'win-x64' && inputs.sign-windows == 'true'
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        allow-no-subscriptions: true

    # The sign-in traded a GitHub assertion that lives for minutes, and fetched a token for Azure Resource Manager alone.
    # The signing service's token is fetched now, while that assertion is fresh, rather than after the signing action has
    # spent those minutes installing what it needs; the Azure CLI then hands it out for its hour. The token proves no role:
    # a role missing on the signing account fails the signing step, and with it the job. Nothing is printed, so the token
    # never reaches the log.
    - name: Fetch the signing service's token while the sign-in is fresh
      if: inputs.rid == 'win-x64' && inputs.sign-windows == 'true'
      shell: pwsh
      run: az account get-access-token --resource https://codesigning.azure.net --output none

    # The Azure CLI's sign-in, above, and no other: every other source the signing action would try is excluded by name,
    # so a credential the runner happens to hold is never the one that signs. The timestamp makes the signature outlive
    # the certificate, which Artifact Signing keeps short-lived. Nothing a previous run cached is restored into the job
    # that holds the sign-in.
    - name: Sign the Windows executable with Artifact Signing
      if: inputs.rid == 'win-x64' && inputs.sign-windows == 'true'
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
      with:
        endpoint: ${{ inputs.azure-signing-endpoint }}
        signing-account-name: ${{ inputs.azure-signing-account }}
        certificate-profile-name: ${{ inputs.azure-signing-profile }}
        files: ${{ steps.signable.outputs.file }}
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        exclude-azure-cli-credential: false
        exclude-environment-credential: true
        exclude-workload-identity-credential: true
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true
        cache-dependencies: false
        trace: false

    # Exactly this, and nothing after it: the script refuses with exit 1, which fails a pwsh step only as its last command.
    - name: Verify the signature of the Windows executable
      if: inputs.rid == 'win-x64' && inputs.sign-windows == 'true'
      shell: pwsh
      env:
        EXECUTABLE: ${{ steps.publish.outputs.executable }}
      run: ./.github/scripts/Assert-WindowsSignature.ps1 -Executable $env:EXECUTABLE -Publisher 'ReplyApp Inc.'

    # The desktop's Windows installer, built on a release's Windows call once its executable is signed and verified, while
    # the sign-in still holds: the installer carries that very jason.exe, and electron-builder's sign hook
    # (desktop/scripts/sign-windows.mjs) signs Jason.exe, the uninstaller and the installer as each is made, with signtool
    # and the Trusted Signing client, whose one credential is the Azure CLI's sign-in above. The client is a pinned
    # version, refused unless its package hashes to the pinned digest; the runner's own newest x64 signtool runs it. The
    # build tooling is desktop/package-lock.json's, installed by npm ci without a package's scripts; none of it is a test.
    - name: Fetch the Trusted Signing client and name the account it signs with
      id: desktop-signing
      if: inputs.rid == 'win-x64' && inputs.sign-windows == 'true' && inputs.desktop == 'true'
      shell: pwsh
      env:
        SIGNING_ENDPOINT: ${{ inputs.azure-signing-endpoint }}
        SIGNING_ACCOUNT: ${{ inputs.azure-signing-account }}
        SIGNING_PROFILE: ${{ inputs.azure-signing-profile }}
      run: |
        $version = '1.0.128'
        $pinned = '74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b'
        $package = Join-Path $env:RUNNER_TEMP 'jason-signing-client.zip'
        Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$version/microsoft.artifactsigning.client.$version.nupkg" -OutFile $package
        $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($digest -ne $pinned) { throw "The Trusted Signing client $version hashes to $digest, not the pinned $pinned." }

        $client = Join-Path $env:RUNNER_TEMP 'jason-signing-client'
        if (Test-Path -LiteralPath $client) { Remove-Item -LiteralPath $client -Recurse -Force }
        Expand-Archive -LiteralPath $package -DestinationPath $client
        $dlib = Join-Path $client 'bin/x64/Azure.CodeSigning.Dlib.dll'
        if (-not (Test-Path -LiteralPath $dlib -PathType Leaf)) { throw "The Trusted Signing client $version holds no bin/x64/Azure.CodeSigning.Dlib.dll." }

        # The account and the profile, and the Azure CLI's sign-in as the one credential the client tries.
        $metadata = Join-Path $env:RUNNER_TEMP 'jason-signing-metadata.json'
        $excluded = @('EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
        $named = [ordered]@{ Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE; ExcludeCredentials = $excluded }
        Set-Content -LiteralPath $metadata -Value ($named | ConvertTo-Json) -NoNewline

        $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
        $signtool = Get-ChildItem -LiteralPath $kits -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){3}$' } |
            Sort-Object { [version] $_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/signtool.exe' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
        if (-not $signtool) { throw "No Windows SDK signtool is on this runner." }

        "signtool=$signtool" >> $env:GITHUB_OUTPUT
        "dlib=$dlib" >> $env:GITHUB_OUTPUT
        "metadata=$metadata" >> $env:GITHUB_OUTPUT

    - name: Build the desktop's Windows installer, each file signed as it is made
      if: inputs.rid == 'win-x64' && inputs.sign-windows == 'true' && inputs.desktop == 'true'
      shell: pwsh
      working-directory: desktop
      env:
        VERSION: ${{ inputs.version }}
        EXECUTABLE: ${{ steps.publish.outputs.executable }}
        JASON_SIGNTOOL: ${{ steps.desktop-signing.outputs.signtool }}
        JASON_SIGNING_DLIB: ${{ steps.desktop-signing.outputs.dlib }}
        JASON_SIGNING_METADATA: ${{ steps.desktop-signing.outputs.metadata }}
      run: |
        npm ci --ignore-scripts
        if ($LASTEXITCODE -ne 0) { throw "npm ci exited with $LASTEXITCODE" }
        node scripts/prepare.mjs --rid win-x64 --output bundles/x64 --version $env:VERSION --executable (Join-Path $env:GITHUB_WORKSPACE $env:EXECUTABLE)
        if ($LASTEXITCODE -ne 0) { throw "prepare.mjs exited with $LASTEXITCODE" }
        $env:JASON_VERSION = $env:VERSION
        $env:JASON_WINDOWS_SIGN = '1'
        npm run package -- --win --x64
        if ($LASTEXITCODE -ne 0) { throw "electron-builder exited with $LASTEXITCODE" }

    # Each of the four files read back out of the installer, as a person's machine unpacks it: the installer itself, the
    # uninstaller it writes (electron-builder removes its own copy once the installer holds it), and, from the application
    # archive it carries, Jason.exe and the bundled jason.exe, which is the executable this call signed byte for byte and
    # declares, as the archived one does, what the runtime's logon start needs. Then every program and library the
    # application carries, each with its signer: the release's, or, for a library that came signed by Microsoft, which
    # the sign hook leaves as it came, Microsoft's, verified as strictly. The libraries the installer loads from its own
    # archive, the nsis plugins electron-builder brings, are listed with their signers. The feed's digest and size of
    # each file it names are computed again from the files as they will be published, and the feed and Jason.exe name
    # the release's version. 7-Zip, which the runner carries, opens the installer; nothing of it runs.
    - name: Verify the desktop's Windows installer and what it carries
      if: inputs.rid == 'win-x64' && inputs.sign-windows == 'true' && inputs.desktop == 'true'
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
        EXECUTABLE: ${{ steps.publish.outputs.executable }}
      run: |
        $dist = 'desktop/dist'
        $installer = "$dist/jason-desktop-windows-x64-setup.exe"
        $opened = Join-Path $env:RUNNER_TEMP 'jason-desktop-installer'
        $app = Join-Path $env:RUNNER_TEMP 'jason-desktop-app'
        foreach ($folder in @($opened, $app)) { if (Test-Path -LiteralPath $folder) { Remove-Item -LiteralPath $folder -Recurse -Force } }
        $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
        if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw "This runner has no 7-Zip at $sevenZip." }
        & $sevenZip x $installer "-o$opened" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "7-Zip could not open the installer: exit $LASTEXITCODE" }
        & $sevenZip x (Join-Path $opened '$PLUGINSDIR/app-64.7z') "-o$app" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "7-Zip could not open the application archive the installer carries: exit $LASTEXITCODE" }

        $signed = @($installer, (Join-Path $opened '$R0/Uninstall Jason.exe'), (Join-Path $app 'Jason.exe'), (Join-Path $app 'resources/bundle/jason.exe'))
        foreach ($file in $signed) {
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "The installer carries no $file." }
          ./.github/scripts/Assert-WindowsSignature.ps1 -Executable $file -Publisher 'ReplyApp Inc.'
          if ($LASTEXITCODE -ne 0) { throw "$file is not signed by ReplyApp Inc." }
        }

        $bundled = (Get-FileHash -LiteralPath (Join-Path $app 'resources/bundle/jason.exe') -Algorithm SHA256).Hash
        if ($bundled -ne (Get-FileHash -LiteralPath $env:EXECUTABLE -Algorithm SHA256).Hash) { throw "The bundled jason.exe is not the executable this call signed." }
        ./.github/scripts/Assert-ApplicationManifest.ps1 -Executable (Join-Path $app 'resources/bundle/jason.exe')
        if ($LASTEXITCODE -ne 0) { throw "The bundled jason.exe does not declare what the runtime's logon start needs." }

        $carried = @(Get-ChildItem -LiteralPath $app -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' } | Sort-Object FullName)
        if ($carried.Count -lt 3) { throw "The application the installer carries holds $($carried.Count) programs and libraries, fewer than Jason.exe, jason.exe and Electron's libraries." }
        foreach ($file in $carried) {
          $came = Get-AuthenticodeSignature -LiteralPath $file.FullName
          $by = if ($came.SignerCertificate) { $came.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { 'nobody' }
          $publisher = if ($by -ceq 'Microsoft Corporation') { 'Microsoft Corporation' } else { 'ReplyApp Inc.' }
          ./.github/scripts/Assert-WindowsSignature.ps1 -Executable $file.FullName -Publisher $publisher
          if ($LASTEXITCODE -ne 0) { throw "$($file.Name) is signed by neither ReplyApp Inc. nor, as it came, Microsoft Corporation." }
        }
        Write-Host "$($carried.Count) programs and libraries the application carries, each signed"

        foreach ($plugin in @(Get-ChildItem -LiteralPath (Join-Path $opened '$PLUGINSDIR') -File -Filter '*.dll' | Sort-Object Name)) {
          $signature = Get-AuthenticodeSignature -LiteralPath $plugin.FullName
          $signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { 'nobody' }
          Write-Host "nsis plugin $($plugin.Name): $($signature.Status), signed by $signer"
        }

        # The file version is the package's version as it is; the product version is Windows' four numbers.
        $said = (Get-Item -LiteralPath (Join-Path $app 'Jason.exe')).VersionInfo.FileVersion
        if ($said -ne $env:VERSION) { throw "Jason.exe says it is $said, and the release is $env:VERSION." }

        Write-Host (Get-Content -LiteralPath "$dist/latest.yml" -Raw)
        ./.github/scripts/Assert-UpdateFeed.ps1 -Feed "$dist/latest.yml" -Version $env:VERSION -Expect 'jason-desktop-windows-x64-setup.exe'
        if ($LASTEXITCODE -ne 0) { throw "latest.yml does not describe the files beside it as they will be published." }

    - name: Forget the Azure sign-in
      if: always() && inputs.rid == 'win-x64' && inputs.sign-windows == 'true'
      shell: pwsh
      run: |
        # Whatever happened above. A command that fails is warned of rather than failing the step, so that nothing
        # after it is skipped.
        az account clear
        if ($LASTEXITCODE -ne 0) { Write-Host "::warning title=Signing::The Azure CLI's sign-in could not be cleared." }
        exit 0

    # The desktop's files, uploaded once the sign-in is forgotten: an upload needs no identity, and a check that failed
    # above has already failed the job.
    - uses: actions/upload-artifact@v7
      if: inputs.rid == 'win-x64' && inputs.sign-windows == 'true' && inputs.desktop == 'true'
      with:
        name: jason-desktop-win-x64
        path: |
          desktop/dist/jason-desktop-windows-x64-setup.exe
          desktop/dist/jason-desktop-windows-x64-setup.exe.blockmap
          desktop/dist/latest.yml
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    # The runtime a logon task starts has no console window only because the executable declares so. So the file
    # about to be archived is read for that declaration, rather than the project that asked for it.
    # It is read after the signature, which rewrites the file.
    - name: Read the application manifest out of the packaged executable
      if: startsWith(inputs.rid, 'win-')
      shell: pwsh
      env:
        EXECUTABLE: ${{ steps.publish.outputs.executable }}
      run: ./.github/scripts/Assert-ApplicationManifest.ps1 -Executable $env:EXECUTABLE

    # The desktop's build tooling runs on a Node set up before the identity is imported, so the action that installs it
    # never runs beside the identity.
    - uses: actions/setup-node@v5
      if: inputs.rid == 'osx-x64' && inputs.sign-macos == 'true' && inputs.desktop == 'true'
      with:
        node-version: 24

    # The macOS executable is signed between the publish and the staging, so that the staged copy, the archive and the
    # caller's smoke test all carry the one signed file, and the native libraries it bundles are signed and bundled again
    # before it is. Only a release asks for it. The identity lives in a keychain of this job's own, from the first of
    # these steps to the last, which forgets it whatever happened in between. No step here traces its commands or prints
    # a secret: each reaches its step through env, never written into the script.
    - name: Import the Developer ID identity into a keychain of this job's own
      id: identity
      if: startsWith(inputs.rid, 'osx-') && inputs.sign-macos == 'true'
      shell: bash
      env:
        P12_BASE64: ${{ inputs.apple-developer-id-p12-base64 }}
        P12_PASSWORD: ${{ inputs.apple-developer-id-p12-password }}
        TEAM_ID: ${{ inputs.apple-team-id }}
      run: |
        # Every file this step writes, the decoded .p12 among them, is for the runner's own user alone.
        umask 077

        # Names, never values: which of the secrets this step needs was not given.
        for name in P12_BASE64 P12_PASSWORD TEAM_ID; do
          if [ -z "${!name}" ]; then echo "::error title=Signing::$name is empty: signing was asked for without every Apple secret."; exit 1; fi
        done

        keychain="$RUNNER_TEMP/jason-signing.keychain-db"
        p12="$RUNNER_TEMP/jason-signing.p12"
        searchlist="$RUNNER_TEMP/jason-signing.search-list"

        # GitHub's pattern for an Apple certificate on a macOS runner: a keychain with a password made here and kept
        # nowhere, the .p12 imported with -A and a key partition list so that codesign reads the key without a prompt,
        # and the keychain put first on the user's search list, before the ones already there, which stay.
        password="$(openssl rand -base64 32)"
        echo "::add-mask::$password"
        printf '%s' "$P12_BASE64" | base64 --decode > "$p12"

        # Before the keychain sees it, the .p12 is opened with the password secret, so that a refusal says what is wrong;
        # security import says only that a passphrase was not correct. macOS's own openssl, LibreSSL, reads the legacy
        # encodings a keychain imports, which OpenSSL 3 refuses without -legacy. The password goes by its environment
        # variable, never on a command line. LibreSSL's -info goes to stderr, kept in a file: the MAC's iteration count,
        # whether the MAC verified, and each bag's PBE with its iteration count, of which only those lines are kept;
        # stdout, where the bags' attributes would go, is dropped. LibreSSL does not name the MAC's algorithm, so it is
        # read from the file's structure: the last object a PKCS#12 file holds is its MAC's digest.
        size="$(wc -c < "$p12" | tr -d ' ')"
        opened="$RUNNER_TEMP/jason-signing.opened"
        info=0
        /usr/bin/openssl pkcs12 -in "$p12" -info -noout -passin env:P12_PASSWORD > /dev/null 2> "$opened" || info=$?
        reported="$(grep -E '^(MAC |MAC:|PKCS7 Encrypted data:|Shrouded Keybag:)' "$opened" || true)"
        mac="$({ /usr/bin/openssl asn1parse -inform DER -in "$p12" 2> /dev/null || true; } | sed -n 's/.*prim: *OBJECT *://p' | tail -n 1)"

        advice="rebuild it with -legacy -macalg sha1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES"
        refused=""
        described=""
        if grep -q 'Mac verify error' "$opened"; then
          case "$P12_PASSWORD" in
            *[[:space:]]) echo "::notice title=Signing::The password secret ends with whitespace, which a value pasted or piped into a secret often carries." ;;
          esac
          refused="The password secret does not open the .p12."
        elif [ "$info" -ne 0 ] && ! grep -q 'MAC verified OK' "$opened"; then
          refused="The decoded secret is not a PKCS#12 file."
        else
          # Opened. Its encoding is said and refused by nobody but the keychain: how LibreSSL words its lines differs
          # between releases, and a check by name could refuse a file macOS imports. macOS imports a MAC of sha1 with
          # bags under pbeWithSHA1And3-KeyTripleDES-CBC, and reads a certificate bag under pbeWithSHA1And40BitRC2-CBC,
          # as Keychain Access itself exports one; anything else carries the rebuild line. A PBES2 (AES) encoding
          # LibreSSL cannot read shows as the MAC verifying and reading the bags then failing.
          bags=""
          legacy=yes
          rc2=""
          if [ "$info" -ne 0 ] || [ "$mac" != sha1 ]; then legacy=no; fi
          while IFS='|' read -r bag pbe; do
            bags="${bags:+$bags, }$bag under $pbe"
            if [ "$pbe" = pbeWithSHA1And3-KeyTripleDES-CBC ]; then
              :
            elif [ "$bag" = "PKCS7 Encrypted data" ] && [ "$pbe" = pbeWithSHA1And40BitRC2-CBC ]; then
              rc2=yes
            else
              legacy=no
            fi
          done < <(sed -n -E 's/^(PKCS7 Encrypted data|Shrouded Keybag): *([^,]*).*/\1|\2/p' "$opened")
          described="The .p12 opens with the password secret. Its MAC's digest: ${mac:-(none)}. Its bags: ${bags:-none read}."
          if [ "$info" -ne 0 ]; then described="$described LibreSSL could not read every bag."; fi
          if [ -n "$rc2" ]; then described="$described A certificate bag under pbeWithSHA1And40BitRC2-CBC is one macOS reads."; fi
          if [ "$legacy" != yes ]; then described="$described If the keychain refuses it, $advice."; fi
        fi
        rm -f "$opened"

        # What the .p12 is - its size, the lines of openssl's report, the MAC's digest and, for one that opens, a notice
        # naming its encoding - said only when it is refused, here or by the keychain, just before the refusal: a
        # release's log is public, and a run that signs has nothing to rebuild.
        describe() {
          echo "The decoded .p12 is $size bytes."
          if [ -n "$reported" ]; then printf '%s\n' "$reported"; fi
          echo "The MAC's digest, by the file's structure: ${mac:-(none)}."
          if [ -n "$described" ]; then echo "::notice title=Signing::$described"; fi
        }
        if [ -n "$refused" ]; then
          rm -f "$p12"
          describe
          echo "::error title=Signing::$refused"
          exit 1
        fi

        security list-keychains -d user | sed -e 's/^ *"//' -e 's/" *$//' > "$searchlist"
        security create-keychain -p "$password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$password" "$keychain"
        if ! security import "$p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"; then
          rm -f "$p12"
          describe
          echo "::error title=Signing::The keychain refused to import the .p12, which the password secret opens: what security said is above. If the notice above names an encoding other than sha1 and 3DES, $advice."
          exit 1
        fi
        rm -f "$p12"
        security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
        set -- "$keychain"
        while IFS= read -r listed; do set -- "$@" "$listed"; done < "$searchlist"
        security list-keychains -d user -s "$@"

        # The identity of the team the secret names, by its SHA-1, as find-identity lists the valid ones. The .p12 holds
        # the certificate and its key alone; the runner's own keychains carry Apple's Developer ID intermediate, which
        # builds the chain to Apple's root, so nothing is fetched here.
        identity() {
          { security find-identity -v -p codesigning "$keychain" || true; } \
            | awk -v team="($TEAM_ID)\"" 'index($0, "\"Developer ID Application: ") && index($0, team) && !found { print $2; found = 1 }'
        }
        security find-identity -v -p codesigning "$keychain" || true
        sha="$(identity)"
        if [ -z "$sha" ]; then
          case "$TEAM_ID" in
            *[[:space:]]) echo "::notice title=Signing::The team id secret ends with whitespace, which a value pasted or piped into a secret often carries." ;;
          esac
          echo "::error title=Signing::The keychain holds no valid Developer ID Application identity of the team the secret names: what find-identity listed is above."
          exit 1
        fi

        echo "identity=$sha" >> "$GITHUB_OUTPUT"
        echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

    # The native libraries the publish copied out of the bundle, signed in place before the executable is: what the
    # bundle unpacks is then what our team signed, and library validation loads it.
    - name: Sign the native libraries the bundle carries
      if: startsWith(inputs.rid, 'osx-') && inputs.sign-macos == 'true'
      shell: pwsh
      env:
        NATIVES: ${{ steps.publish.outputs.natives }}
        IDENTITY: ${{ steps.identity.outputs.identity }}
        KEYCHAIN: ${{ steps.identity.outputs.keychain }}
      run: ./.github/scripts/Sign-NativeLibraries.ps1 -Directory $env:NATIVES -Identity $env:IDENTITY -Keychain $env:KEYCHAIN

    # The publish above, again, building and restoring nothing: it bundles the very build the first one made, with each
    # native library taken from the signed copies instead of from where the first publish found it.
    - name: Bundle the signed native libraries into the executable
      if: startsWith(inputs.rid, 'osx-') && inputs.sign-macos == 'true'
      shell: pwsh
      env:
        RID: ${{ inputs.rid }}
        VERSION: ${{ inputs.version }}
        RUNTIME_VERSION: ${{ inputs.runtime-version }}
        NATIVES: ${{ steps.publish.outputs.natives }}
      run: |
        $publish = "artifacts/publish/$env:RID"
        $runtime = @(if ($env:RUNTIME_VERSION) { "-p:RuntimeFrameworkVersion=$env:RUNTIME_VERSION" })
        dotnet publish dotnet/src/Jason.App --configuration Release --runtime $env:RID --self-contained -p:PublishSingleFile=true "-p:Version=$env:VERSION" @runtime --no-restore --no-build "-p:BundleNativeLibrariesFrom=$env:NATIVES" --output $publish
        if ($LASTEXITCODE -ne 0) { throw "dotnet publish exited with $LASTEXITCODE" }

    - name: Sign the macOS executable with the hardened runtime
      if: startsWith(inputs.rid, 'osx-') && inputs.sign-macos == 'true'
      shell: bash
      env:
        EXECUTABLE: ${{ steps.publish.outputs.executable }}
        IDENTITY: ${{ steps.identity.outputs.identity }}
        KEYCHAIN: ${{ steps.identity.outputs.keychain }}
      run: |
        # --force replaces the ad hoc signature the SDK wrote at publish, and the new one covers the whole file, the
        # bundle's payload with it. The hardened runtime is what notarization requires, and the entitlements say what
        # it must still let .NET do; the timestamp, from Apple's service, keeps the signature valid after the
        # certificate expires.
        entitlements=dotnet/src/Jason.App/jason.entitlements
        plutil -lint "$entitlements"
        codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --options runtime --timestamp --entitlements "$entitlements" "$EXECUTABLE"

        codesign --verify --strict --verbose=2 "$EXECUTABLE"
        codesign --display --verbose=2 "$EXECUTABLE"

        # What the system will hold the program to, read back out of the signed file and held to the file it was signed
        # with. plutil writes both in one form, without the file's comments, so only a key or a value tells them apart.
        signed="$RUNNER_TEMP/jason-signed.entitlements"
        carried="$RUNNER_TEMP/jason-carried.entitlements"
        expected="$RUNNER_TEMP/jason-expected.entitlements"
        codesign --display --entitlements - --xml "$EXECUTABLE" > "$signed"
        plutil -convert xml1 -o "$carried" "$signed"
        plutil -convert xml1 -o "$expected" "$entitlements"
        plutil -p "$carried"
        if ! diff "$expected" "$carried"; then
          echo "::error title=Signing::The signed executable carries entitlements other than $entitlements: the difference is above."
          exit 1
        fi

    - name: Notarize the macOS executable
      if: startsWith(inputs.rid, 'osx-') && inputs.sign-macos == 'true'
      shell: bash
      env:
        EXECUTABLE: ${{ steps.publish.outputs.executable }}
        NOTARY_KEY: ${{ inputs.apple-notary-key-p8 }}
        NOTARY_KEY_ID: ${{ inputs.apple-notary-key-id }}
        NOTARY_ISSUER: ${{ inputs.apple-notary-issuer-id }}
        KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        DESKTOP: ${{ inputs.rid == 'osx-x64' && inputs.desktop == 'true' }}
      run: |
        # The key is written to a file for the runner's own user alone.
        umask 077

        for name in NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER; do
          if [ -z "${!name}" ]; then echo "::error title=Notarization::$name is empty: signing was asked for without every Apple secret."; exit 1; fi
        done

        key="$RUNNER_TEMP/jason-notary.p8"
        zip="$RUNNER_TEMP/jason-notarize.zip"
        answer="$RUNNER_TEMP/jason-notary.json"
        # The key's file is needed by this step alone: it is removed when the step ends, however it ends, so nothing
        # after it in the job, the desktop's build tooling among it, finds the key on disk.
        trap 'rm -f "$key"' EXIT

        # The notary takes a zip, not a bare executable, and ditto writes the one Apple documents. --wait holds the
        # step until the service answers, for thirty minutes at most; anything but Accepted fails it, with the
        # service's own log of the submission. Nothing is stapled: a bare executable has no place for the ticket,
        # which Apple documents Gatekeeper finding online instead.
        printf '%s\n' "$NOTARY_KEY" > "$key"
        ditto -c -k --keepParent "$EXECUTABLE" "$zip"
        submitted=0
        xcrun notarytool submit "$zip" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait --timeout 30m --output-format json > "$answer" || submitted=$?

        # A release's log is public: an accepted submission is said without its id. Anything else prints the notary's
        # answer and the submission's id, which reading Apple's log of it needs, and the log itself.
        id="$(sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' "$answer")"
        status="$(sed -n 's/.*"status" *: *"\([^"]*\)".*/\1/p' "$answer")"
        if [ "$status" = "Accepted" ]; then
          echo "The notary accepted the executable."
          # The desktop's packages are notarized later in this call with the same key, kept for them in this job's
          # keychain under a profile name rather than in a file; the keychain is deleted with the identity.
          if [ "$DESKTOP" = "true" ]; then
            xcrun notarytool store-credentials jason-notary --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$KEYCHAIN"
          fi
        else
          cat "$answer"
          echo "notarytool exited $submitted: submission ${id:-(none)}, status ${status:-(none)}"
          if [ -n "$id" ]; then
            xcrun notarytool log "$id" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
          fi
          echo "::error title=Notarization::The notary did not accept the executable: ${status:-no answer}."
          exit 1
        fi

    - name: Assess the macOS executable as Gatekeeper does
      if: startsWith(inputs.rid, 'osx-') && inputs.sign-macos == 'true'
      shell: bash
      env:
        EXECUTABLE: ${{ steps.publish.outputs.executable }}
      run: |
        # Gatekeeper's own question, asked now that the notary holds the ticket: accepted, from the source "Notarized
        # Developer ID". A command-line tool is not an app, and the execute assessment may refuse it as one ("does not
        # seem to be an app"); the assessment of a tool's own signature is asked then, and wants the same source.
        # Apple's service may not yet answer for a ticket it has just issued, so the question is asked three times at
        # most, twenty seconds apart.
        said="$RUNNER_TEMP/jason-assessment.txt"
        accepted() {
          assessed=0
          spctl --assess --type execute --verbose=2 "$EXECUTABLE" > "$said" 2>&1 || assessed=$?
          cat "$said"
          if [ "$assessed" -eq 0 ] && grep -q 'source=Notarized Developer ID' "$said"; then return 0; fi

          if grep -q 'does not seem to be an app' "$said"; then
            assessed=0
            spctl --assess --type open --context context:primary-signature --verbose=2 "$EXECUTABLE" > "$said" 2>&1 || assessed=$?
            cat "$said"
            if [ "$assessed" -eq 0 ] && grep -q 'source=Notarized Developer ID' "$said"; then return 0; fi
          fi
          return 1
        }

        for try in 1 2 3; do
          if accepted; then exit 0; fi
          if [ "$try" -lt 3 ]; then
            echo "Not accepted as Notarized Developer ID at try $try of 3; asking again in twenty seconds."
            sleep 20
          fi
        done

        echo "::error title=Gatekeeper::The executable was not accepted as Notarized Developer ID, asked three times twenty seconds apart."
        exit 1

    # The desktop's Mac packages, built on a release's osx-x64 call once the osx-arm64 call of the same job signed that
    # architecture's executable and this call signed, notarized and assessed its own, while the identity is still held:
    # each architecture's application carries its own signed jason, the very bytes, which keeps that signature and its
    # entitlements, and electron-builder signs the application around it with the same Developer ID, hardened, and has the
    # notary accept it with the key the notarization above kept in this job's keychain. The build tooling is
    # desktop/package-lock.json's, installed by npm ci without a package's scripts; none of it is a test.
    - name: Build the desktop's Mac packages, signed and notarized
      if: inputs.rid == 'osx-x64' && inputs.sign-macos == 'true' && inputs.desktop == 'true'
      shell: bash
      working-directory: desktop
      env:
        VERSION: ${{ inputs.version }}
        EXECUTABLE: ${{ steps.publish.outputs.executable }}
        IDENTITY: ${{ steps.identity.outputs.identity }}
        KEYCHAIN: ${{ steps.identity.outputs.keychain }}
      run: |
        arm64="$GITHUB_WORKSPACE/artifacts/publish/osx-arm64/jason"
        if [ ! -f "$arm64" ]; then
          echo "::error title=Desktop::$arm64 is not here: the osx-arm64 call of this job signs it before this one."
          exit 1
        fi
        npm ci --ignore-scripts
        node scripts/prepare.mjs --rid osx-arm64 --output bundles/arm64 --version "$VERSION" --executable "$arm64"
        node scripts/prepare.mjs --rid osx-x64 --output bundles/x64 --version "$VERSION" --executable "$GITHUB_WORKSPACE/$EXECUTABLE"
        JASON_VERSION="$VERSION" CSC_NAME="$IDENTITY" CSC_KEYCHAIN="$KEYCHAIN" CSC_IDENTITY_AUTO_DISCOVERY=false \
          APPLE_KEYCHAIN_PROFILE=jason-notary APPLE_KEYCHAIN="$KEYCHAIN" npm run package -- --mac --arm64 --x64

    # Each architecture read back: the application signed, accepted by Gatekeeper as notarized and stapled; its bundled
    # jason the executable that architecture's call signed, byte for byte, with its own entitlements and of that
    # architecture alone; the application inside the zip the same; the dmg notarized and stapled in turn, since a person
    # opens it before the application. The feed's digest and size of each file it names are computed again from the files
    # as they will be published, and the feed and each application name the release's version.
    - name: Verify the desktop's Mac packages and what they carry
      if: inputs.rid == 'osx-x64' && inputs.sign-macos == 'true' && inputs.desktop == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        KEYCHAIN: ${{ steps.identity.outputs.keychain }}
      run: |
        dist=desktop/dist
        entitlements=dotnet/src/Jason.App/jason.entitlements
        expected="$RUNNER_TEMP/jason-desktop-expected.entitlements"
        plutil -convert xml1 -o "$expected" "$entitlements"
        feed="$dist/latest-mac.yml"
        cat "$feed"
        grep -qx "version: $VERSION" "$feed" || { echo "::error title=Desktop::latest-mac.yml does not name $VERSION."; exit 1; }

        notarized() {
          said="$RUNNER_TEMP/jason-desktop-assessment.txt"
          spctl --assess --verbose=2 "$@" > "$said" 2>&1 || { cat "$said"; return 1; }
          cat "$said"
          grep -q 'source=Notarized Developer ID' "$said"
        }

        for arch in arm64 x64; do
          case "$arch" in
            arm64) app="$dist/mac-arm64/Jason.app"; lipo=arm64; rid=osx-arm64 ;;
            x64) app="$dist/mac/Jason.app"; lipo=x86_64; rid=osx-x64 ;;
          esac
          zip="$dist/jason-desktop-macos-$arch.zip"
          dmg="$dist/jason-desktop-macos-$arch.dmg"
          nested="$app/Contents/Resources/bundle/jason"

          codesign --verify --deep --strict --verbose=2 "$app"
          notarized --type execute "$app" || { echo "::error title=Desktop::The $arch application is not accepted as Notarized Developer ID."; exit 1; }
          xcrun stapler validate "$app"
          shipped="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [ "$shipped" = "$VERSION" ] || { echo "::error title=Desktop::The $arch application says it is $shipped, and the release is $VERSION."; exit 1; }

          cmp "$nested" "$GITHUB_WORKSPACE/artifacts/publish/$rid/jason" || { echo "::error title=Desktop::The $arch application's jason is not the executable its call signed."; exit 1; }
          codesign --verify --strict --verbose=2 "$nested"
          [ "$(lipo -archs "$nested")" = "$lipo" ] || { echo "::error title=Desktop::The $arch application's jason is not $lipo alone."; exit 1; }
          carried="$RUNNER_TEMP/jason-desktop-$arch.entitlements"
          codesign --display --entitlements - --xml "$nested" > "$carried.raw"
          plutil -convert xml1 -o "$carried" "$carried.raw"
          diff "$expected" "$carried" || { echo "::error title=Desktop::The $arch application's jason carries entitlements other than $entitlements."; exit 1; }

          unzipped="$RUNNER_TEMP/jason-desktop-$arch-zip"
          rm -rf "$unzipped"
          ditto -x -k "$zip" "$unzipped"
          codesign --verify --deep --strict --verbose=2 "$unzipped/Jason.app"
          xcrun stapler validate "$unzipped/Jason.app"
          cmp "$unzipped/Jason.app/Contents/Resources/bundle/jason" "$nested"

          codesign --verify --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" --keychain-profile jason-notary --keychain "$KEYCHAIN" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          notarized --type open --context context:primary-signature "$dmg" || { echo "::error title=Desktop::The $arch dmg is not accepted as Notarized Developer ID."; exit 1; }
        done

        pwsh -NoProfile -File .github/scripts/Assert-UpdateFeed.ps1 -Feed "$feed" -Version "$VERSION" -Expect jason-desktop-macos-arm64.zip,jason-desktop-macos-x64.zip || { echo "::error title=Desktop::latest-mac.yml does not describe the files beside it as they will be published."; exit 1; }

    - name: Forget the Developer ID identity
      if: always() && startsWith(inputs.rid, 'osx-') && inputs.sign-macos == 'true'
      shell: bash
      run: |
        # Whatever happened above: every file a secret was written to removed first, then the search list as it was
        # and the keychain off the disk. A keychain command that fails is warned of rather than failing the step, so
        # that nothing after it is skipped.
        rm -f "$RUNNER_TEMP/jason-signing.p12" "$RUNNER_TEMP/jason-signing.opened" "$RUNNER_TEMP/jason-notary.p8" "$RUNNER_TEMP/jason-notarize.zip"
        searchlist="$RUNNER_TEMP/jason-signing.search-list"
        if [ -s "$searchlist" ]; then
          set --
          while IFS= read -r listed; do set -- "$@" "$listed"; done < "$searchlist"
          security list-keychains -d user -s "$@" || echo "::warning title=Signing::The user's keychain search list could not be put back as it was."
        fi
        if [ -e "$RUNNER_TEMP/jason-signing.keychain-db" ]; then
          security delete-keychain "$RUNNER_TEMP/jason-signing.keychain-db" || echo "::warning title=Signing::This job's keychain could not be deleted."
        fi
        rm -f "$searchlist"

    # The desktop's files, uploaded once the identity is forgotten: an upload needs no identity, and a check that failed
    # above has already failed the job.
    - uses: actions/upload-artifact@v7
      if: inputs.rid == 'osx-x64' && inputs.sign-macos == 'true' && inputs.desktop == 'true'
      with:
        name: jason-desktop-osx-x64
        path: |
          desktop/dist/jason-desktop-macos-arm64.dmg
          desktop/dist/jason-desktop-macos-arm64.zip
          desktop/dist/jason-desktop-macos-arm64.zip.blockmap
          desktop/dist/jason-desktop-macos-x64.dmg
          desktop/dist/jason-desktop-macos-x64.zip
          desktop/dist/jason-desktop-macos-x64.zip.blockmap
          desktop/dist/latest-mac.yml
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    - name: Put LICENSE and THIRD-PARTY-NOTICES beside the executable
      shell: pwsh
      env:
        RID: ${{ inputs.rid }}
        EXECUTABLE: ${{ steps.publish.outputs.executable }}
      run: |
        # The archive carries the repository's LICENSE, the MIT licence, which covers the whole repository and so the
        # runtime the executable is built from. THIRD-PARTY-NOTICES travels with it: the runtimes and packages the
        # executable carries, and their licences.
        $staging = "artifacts/package/$env:RID"
        New-Item -ItemType Directory -Force $staging | Out-Null
        New-Item -ItemType Directory -Force artifacts/release | Out-Null
        Copy-Item $env:EXECUTABLE $staging
        Copy-Item LICENSE (Join-Path $staging LICENSE)
        Copy-Item THIRD-PARTY-NOTICES (Join-Path $staging THIRD-PARTY-NOTICES)

    - name: Archive as zip
      if: startsWith(inputs.rid, 'win-')
      shell: pwsh
      env:
        RID: ${{ inputs.rid }}
        ARCHIVE: ${{ steps.name.outputs.archive }}
      run: |
        # -Force because a re-run on a warm runner finds the archive from the last attempt still there, and
        # Compress-Archive refuses to write over one. The tar step below has never needed saying: tar truncates.
        Compress-Archive -Path "artifacts/package/$env:RID/*" -DestinationPath $env:ARCHIVE -Force

    - name: Archive as tar.gz
      if: ${{ !startsWith(inputs.rid, 'win-') }}
      shell: bash
      env:
        RID: ${{ inputs.rid }}
        ARCHIVE: ${{ steps.name.outputs.archive }}
      run: |
        # tar keeps the mode, which is what makes the unpacked file runnable without a chmod from whoever
        # unpacks it; the bit is set here rather than trusted from the publish. COPYFILE_DISABLE keeps macOS's
        # tar from adding the ._ resource-fork entries nobody else can use.
        chmod 755 "artifacts/package/$RID/jason"
        COPYFILE_DISABLE=1 tar -czf "$ARCHIVE" -C "artifacts/package/$RID" jason LICENSE THIRD-PARTY-NOTICES

    - name: Write the checksum and the manifest fragment
      shell: pwsh
      env:
        RID: ${{ inputs.rid }}
        ASSET: ${{ steps.name.outputs.asset }}
        ARCHIVE: ${{ steps.name.outputs.archive }}
      run: |
        $hash = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
        $size = (Get-Item $env:ARCHIVE).Length

        # sha256sum's own line — the digest, two spaces, the name — with a Unix newline whatever the runner, so
        # that `sha256sum -c` reads it on a machine that is not this one.
        Set-Content -Path "$env:ARCHIVE.sha256" -Value "$hash  $env:ASSET`n" -NoNewline

        # This platform's entry of the release manifest. Write-Manifest.ps1 merges the three into manifest.json.
        $fragment = [ordered]@{ $env:RID = [ordered]@{ asset = $env:ASSET; sha256 = $hash; size = $size } }
        Set-Content -Path "artifacts/release/jason-$env:RID.fragment.json" -Value (($fragment | ConvertTo-Json -Compress) + "`n") -NoNewline

        Get-ChildItem artifacts/release | Format-Table Name, Length

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact != '' && inputs.artifact || format('jason-{0}', inputs.rid) }}
        path: |
          ${{ steps.name.outputs.archive }}
          ${{ steps.name.outputs.archive }}.sha256
          artifacts/release/jason-${{ inputs.rid }}.fragment.json
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
