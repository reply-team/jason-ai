# One .NET install for every job that builds: ci.yml and release.yml call it where they need the SDK.
# It installs one exact SDK, the sdk-version input, from Microsoft's CDN, builds.dotnet.microsoft.com, through Microsoft's
# own install scripts: given a version and a feed, the scripts ask nothing else. Given the word latest it installs the
# newest SDK the 10.0 channel has released, the latest-sdk of the release metadata on the same CDN. Either way it says
# which SDK it installed, as its sdk-version output. Given nothing it installs nothing: an empty sdk-version stops the
# job before anything is fetched. The scripts are fetched when the job runs, from the addresses Microsoft publishes for
# them, rather than kept in this repository.
#
# No SDK is pinned here. Each workflow's version job calls this action with latest, so the channel's newest SDK is
# resolved once per run, and hands the exact SDK it installed to every other job that builds, which passes it back in:
# the jobs of one run build on one SDK, even when the channel releases another while the run is going. An empty
# sdk-version is refused rather than read as latest, so a job handed no SDK fails where it is, instead of resolving one
# of its own at its own start. The update job in ci.yml builds its two sides on two runtime patches on purpose, the
# version it installs on the runtime of that SDK and the version it updates to on the patch beside it.
#
# A pin once held every build to one runtime patch, because an update between two builds on two runtime patches failed
# on Linux: the applier ran from the file it was replacing and read a library it had not yet needed out of the new build
# after the swap. Since 0.19.0 the applier loads what it needs before its first rename and hands the rest of the update
# to the new build, so an update performed by 0.19.0 or a later build survives a change of runtime patch, which the
# update job proves on every run that builds a platform, the version pull request aside; an update performed by an
# older build can stop at started, and applying it again finishes it. The channel's newest SDK is at or past the one
# global.json names, which its latestFeature roll forward accepts. A newer SDK of the channel can turn a run red with no
# change in the tree, since dotnet/Directory.Build.props treats warnings as errors under AnalysisLevel latest; the step
# "Show the SDK the tree resolves" is where to read which SDK it was.
name: Set up .NET
description: Install one exact .NET SDK from Microsoft's CDN, say which SDK it installed and which SDK the tree resolves.

inputs:
  sdk-version:
    description: >
      The exact .NET SDK to install: in every job but a workflow's version job, the SDK the version job installed, its
      sdk output. The word latest is the newest SDK the 10.0 channel has released, the latest-sdk of its release metadata,
      which is what the version job asks for. Empty, the default, is refused before anything is fetched, so a job that
      passes no SDK stops rather than resolving one of its own.
    required: false
    default: ''

outputs:
  sdk-version:
    description: The exact .NET SDK installed, as given or as the release metadata named it.
    value: ${{ steps.unix.outputs.sdk-version || steps.windows.outputs.sdk-version }}

runs:
  using: composite
  steps:
    - name: Install the .NET SDK
      id: unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        SDK_VERSION: ${{ inputs.sdk-version }}
      run: |
        set -euo pipefail
        [[ -n "${SDK_VERSION:-}" ]] || { echo "The sdk-version input is empty: a workflow's version job resolves the SDK with latest, and every other job passes that job's sdk output." >&2; exit 1; }
        feed=https://builds.dotnet.microsoft.com/dotnet
        if [[ "$SDK_VERSION" == latest ]]; then
          SDK_VERSION=$(curl --fail --silent --show-error --location --retry 3 "$feed/release-metadata/10.0/releases.json" | jq --raw-output '."latest-sdk"')
        fi
        [[ "$SDK_VERSION" =~ ^10\.0\.[0-9]+$ ]] || { echo "The SDK to install reads '$SDK_VERSION', not a 10.0 release." >&2; exit 1; }
        install="$RUNNER_TEMP/dotnet"
        script="$RUNNER_TEMP/dotnet-install.sh"
        curl --fail --silent --show-error --location --retry 3 --output "$script" https://dot.net/v1/dotnet-install.sh
        bash "$script" --version "$SDK_VERSION" --azure-feed "$feed" --install-dir "$install"
        echo "DOTNET_ROOT=$install" >> "$GITHUB_ENV"
        echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
        echo "$install" >> "$GITHUB_PATH"
        echo "sdk-version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

    - name: Install the .NET SDK
      id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        SDK_VERSION: ${{ inputs.sdk-version }}
      run: |
        $ErrorActionPreference = 'Stop'
        if (-not $env:SDK_VERSION) { throw "The sdk-version input is empty: a workflow's version job resolves the SDK with latest, and every other job passes that job's sdk output." }
        $feed = 'https://builds.dotnet.microsoft.com/dotnet'
        if ($env:SDK_VERSION -ceq 'latest') {
          $env:SDK_VERSION = (Invoke-RestMethod -Uri "$feed/release-metadata/10.0/releases.json" -MaximumRetryCount 3).'latest-sdk'
        }
        if ($env:SDK_VERSION -cnotmatch '^10\.0\.[0-9]+\z') { throw "The SDK to install reads '$env:SDK_VERSION', not a 10.0 release." }
        $install = Join-Path $env:RUNNER_TEMP dotnet
        $script = Join-Path $env:RUNNER_TEMP dotnet-install.ps1
        Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile $script -MaximumRetryCount 3
        & $script -Version $env:SDK_VERSION -AzureFeed $feed -InstallDir $install
        if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "dotnet-install.ps1 exited with $LASTEXITCODE" }
        if (-not (Test-Path (Join-Path $install dotnet.exe))) { throw "dotnet-install.ps1 left no dotnet.exe in $install" }
        "DOTNET_ROOT=$install" >> $env:GITHUB_ENV
        "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $env:GITHUB_ENV
        $install >> $env:GITHUB_PATH
        "sdk-version=$env:SDK_VERSION" >> $env:GITHUB_OUTPUT

    # Read through the PATH the steps after this one see, from the repository root, so the version printed is the
    # one global.json resolves for the build.
    - name: Show the SDK the tree resolves
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        (Get-Command dotnet).Source
        dotnet --version
        if ($LASTEXITCODE -ne 0) { throw "dotnet --version exited with $LASTEXITCODE" }
        dotnet --list-sdks
        if ($LASTEXITCODE -ne 0) { throw "dotnet --list-sdks exited with $LASTEXITCODE" }
