# Publishes the release this tree describes. A merge into main that changes VERSION — which only the release
# process's pull request does — tags that merge and publishes the draft release the release process left for that
# version. From the button it finishes a publication that stopped part-way; it takes no input and acts only on the
# version VERSION names.
#
# Once the release is published, it asks the Homebrew tap to bump its formula, with the one secret it holds,
# HOMEBREW_TAP_DISPATCH_TOKEN: a fine-grained token with Actions read and write on reply-team/homebrew-tap alone. A
# missing, refused or misplaced token turns that job red and leaves the release published; the tap then moves at its
# own six-hour schedule until the job is run again.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Tag and publish
    runs-on: ubuntu-latest
    steps:
      # The whole history, to find the commit that last changed VERSION: the merge of the release's pull request,
      # whichever way this run was started.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the merge and publish its draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $given = (Get-Content VERSION -Raw).Trim()
          $identifier = '(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)'
          if ($given -cnotmatch "^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-$identifier(?:\.$identifier)*)?$") {
            throw "VERSION says '$given', which is not a version a release carries: 0.2.0 or 1.0.0-rc.1."
          }
          $version = $given
          $tag = "v$version"

          $commit = git log -1 --format=%H -- VERSION
          if ($LASTEXITCODE -ne 0 -or -not $commit) { throw "No commit on main changed VERSION." }

          # What there is: the release's state (a draft, published, or none), and whether the tag exists.
          $state = 'none'
          try {
            $draft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
            if ($LASTEXITCODE -eq 0) { $state = if ($draft -eq 'true') { 'draft' } else { 'published' } }
          } catch {
            $state = 'none'
          }
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          $tagged = $LASTEXITCODE -eq 0

          if ($state -eq 'none') {
            throw "There is no draft of ${tag}: the release process creates it before it opens the pull request. Run that release again."
          }
          if ($state -eq 'published' -and $tagged) {
            Write-Host "$tag is already published."
            exit 0
          }
          if ($state -eq 'published') {
            throw "$tag is published but not tagged here, which is not something this workflow does. Look at it before anything is changed."
          }

          if (-not $tagged) {
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag --annotate $tag $commit -m "Jason $version"
            if ($LASTEXITCODE -ne 0) { throw "git tag exited with $LASTEXITCODE" }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "git push exited with $LASTEXITCODE" }
          }

          # A candidate is published as a pre-release and never as latest. A release becomes latest unless a newer one
          # already is - a fix to an older line published after a newer release must not take latest from it.
          [string[]] $how = '--draft=false'
          if ($version -clike '*-*') {
            $how += '--prerelease'
          } else {
            $latest = $null
            try {
              $latest = gh release view --json tagName --jq '.tagName' 2>$null
              if ($LASTEXITCODE -ne 0) { $latest = $null }
            } catch {
              $latest = $null
            }
            if ($latest -and [semver]$latest.Substring(1) -gt [semver]$version) {
              Write-Host "$latest is newer and stays the latest release; $tag is published beside it."
              $how += '--latest=false'
            } else {
              $how += '--latest'
            }
          }

          gh release edit $tag @how
          if ($LASTEXITCODE -ne 0) { throw "gh release edit exited with $LASTEXITCODE" }
          Write-Host "$tag is published."

  # Asks the tap to bump its formula once the release is published: after publish ended 0, its "already published"
  # answer included, and never after it failed. A 2xx proves only that a bump run was queued; the bump checks, tests
  # and pushes in the tap, and changes nothing when the address still answers the previous release or when this one
  # is a candidate or an older line's fix, since it reads the latest release. The tap's six-hour schedule catches
  # whatever this misses. A red job leaves the release as it is: "Re-run failed jobs" runs this job alone, with the
  # secret as it is then.
  tap:
    name: Tell the tap
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Nothing of this repository's: the job checks nothing out, and its one token is the tap's.
    permissions: {}
    steps:
      - name: Dispatch the tap's bump
        shell: pwsh
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        run: |
          if (-not $env:TOKEN) {
            Write-Host '::error::HOMEBREW_TAP_DISPATCH_TOKEN is not set: the tap moves at its six-hour schedule instead. Store a fine-grained token with Actions read and write on reply-team/homebrew-tap, then re-run this job.'
            exit 1
          }
          $tail = 'The release is published; the tap moves at its six-hour schedule until this job runs green.'

          # The bump takes no input: it reads the latest release's manifest itself, so the ref is all there is to send.
          # -SkipHttpErrorCheck hands a refusal back as a response, so its status is read below rather than thrown; a
          # request that gets no answer at all still throws.
          try {
            $response = Invoke-WebRequest -Method Post -Uri https://api.github.com/repos/reply-team/homebrew-tap/actions/workflows/bump.yml/dispatches -Headers @{ Authorization = "Bearer $env:TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType application/json -Body '{"ref":"main"}' -SkipHttpErrorCheck
          } catch {
            Write-Host "::error::GitHub could not be reached: $("$($_.Exception.Message)".TrimEnd('.')). $tail"
            exit 1
          }
          $status = [int] $response.StatusCode

          # A token that expires says when in a header of the response, as GitHub sent it when this was written, for
          # example "2026-11-25 13:50:00 UTC"; one without an expiry sends no such header. A warning never turns the job
          # red.
          $expiration = @($response.Headers['github-authentication-token-expiration'])[0]
          if ($expiration) {
            $at = [DateTimeOffset]::MinValue
            $text = $expiration.Trim() -replace ' UTC$', ' +00:00'
            if ([DateTimeOffset]::TryParseExact($text, 'yyyy-MM-dd HH:mm:ss zzz', [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::None, [ref] $at)) {
              $left = $at - [DateTimeOffset]::UtcNow
              $date = "$($at.UtcDateTime.ToString('yyyy-MM-dd HH:mm')) UTC"
              if ($left -le [TimeSpan]::Zero) {
                Write-Host "::warning title=Tap token::HOMEBREW_TAP_DISPATCH_TOKEN expired ${date}: make a new one and store it."
              } elseif ($left -lt [TimeSpan]::FromDays(14)) {
                $days = [int] [math]::Ceiling($left.TotalDays)
                $unit = if ($days -eq 1) { 'day' } else { 'days' }
                Write-Host "::warning title=Tap token::HOMEBREW_TAP_DISPATCH_TOKEN expires $date, in $days ${unit}: make a new one and store it before then."
              }
            } else {
              Write-Host "::warning title=Tap token::GitHub says HOMEBREW_TAP_DISPATCH_TOKEN expires '$expiration', which is not a date this job reads: look at the token's expiry yourself."
            }
          }

          # GitHub documents the answer as 200 with the run it queued, whose address is printed; an answer without one is
          # a bump queued all the same.
          if ($status -ge 200 -and $status -lt 300) {
            $queued = $null
            try { $queued = "$(($response.Content | ConvertFrom-Json).html_url)" } catch { $queued = $null }
            if ($queued) {
              Write-Host "The tap's bump is queued at $queued; it reads the latest release itself."
            } else {
              Write-Host "The tap's bump is queued; it reads the latest release itself."
            }
            exit 0
          }

          switch ($status) {
            401 { $why = 'HOMEBREW_TAP_DISPATCH_TOKEN was refused (expired or revoked): make a new one, store it, re-run this job.' }
            403 { $why = 'HOMEBREW_TAP_DISPATCH_TOKEN may not dispatch there: it needs Actions read and write on reply-team/homebrew-tap, and the organisation may still have to approve it.' }
            404 { $why = "HOMEBREW_TAP_DISPATCH_TOKEN does not reach reply-team/homebrew-tap's bump.yml: the repository is not selected for it, or the workflow moved." }
            default {
              $message = $null
              try { $message = "$(($response.Content | ConvertFrom-Json).message)".TrimEnd('.') } catch { $message = $null }
              $why = if ($message) { "GitHub answered ${status}: $message." } else { "GitHub answered $status." }
            }
          }
          Write-Host "::error::$why $tail"
          exit 1
