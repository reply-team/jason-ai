<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sealed probe</title>
        <!--
A hostile stand-in for a page under sealed/: the browser smoke places it where the demo page stands, with the address of
a witness, a server of the smoke's own on the loopback, in place of __WITNESS_ORIGIN__. Every way out of the page aims at
the witness, so what decides a try is whether the witness heard it, never the page's own word: the policy is the only
thing between the page and an address that answers. Two tries aim at the runtime's own address, at a file the UI serves,
which answers as well. The page also writes what each try came back with, one item per try, which the smoke reads for the
tries that stay inside the page: its origin, its storage and the page above it. The tries that would move the page away
wait for the smoke to start them (probeLeave), after it has read the rest.
-->
        <style>
            body {
                font:
                    12px/1.4 system-ui,
                    sans-serif;
                margin: 48px 16px 16px;
            }
            li[data-outcome='reached'] {
                color: #b00;
            }
        </style>
    </head>
    <body>
        <ol id="outcomes"></ol>
        <script>
            (function () {
                'use strict';
                var witness = '__WITNESS_ORIGIN__';
                var list = document.getElementById('outcomes');
                function say(name, outcome, detail) {
                    var item = document.createElement('li');
                    item.setAttribute('data-try', name);
                    item.setAttribute('data-outcome', outcome);
                    item.textContent = name + ': ' + outcome + (detail ? ' (' + detail + ')' : '');
                    list.appendChild(item);
                }
                function nameOf(error) {
                    return error && error.name ? error.name : String(error);
                }
                /** A try that must throw or return nothing: what it returns, if anything, is what it reached. */
                function syncTry(name, act) {
                    try {
                        var got = act();
                        if (got === undefined || got === null || got === '') say(name, 'refused', 'nothing');
                        else say(name, 'reached', String(got).slice(0, 80));
                    } catch (error) {
                        say(name, 'refused', nameOf(error));
                    }
                }
                /** A try that must reject or throw: an answer of any kind, an opaque one included, is what it reached. */
                function asyncTry(name, act) {
                    var settled;
                    try {
                        settled = Promise.resolve(act());
                    } catch (error) {
                        say(name, 'refused', nameOf(error));
                        return Promise.resolve();
                    }
                    return settled.then(
                        function (got) {
                            say(
                                name,
                                'reached',
                                got && typeof got === 'object' && 'type' in got
                                    ? 'a ' + got.type + ' answer'
                                    : String(got),
                            );
                        },
                        function (error) {
                            say(name, 'refused', nameOf(error));
                        },
                    );
                }
                /** A try that is refused unless its element fires the event that says it got through. */
                function eventTry(name, start, reached, refused, ms) {
                    return new Promise(function (resolve) {
                        var done = false;
                        function end(outcome, detail) {
                            if (done) return;
                            done = true;
                            say(name, outcome, detail);
                            resolve();
                        }
                        try {
                            var target = start();
                            target.addEventListener(reached, function () {
                                end('reached', reached);
                            });
                            target.addEventListener(refused, function () {
                                end('refused', refused);
                            });
                        } catch (error) {
                            end('refused', nameOf(error));
                            return;
                        }
                        setTimeout(function () {
                            end('refused', 'no ' + reached + ' within ' + ms + ' ms');
                        }, ms);
                    });
                }
                /** A try whose outcome the witness and the smoke's own listeners decide: the page only says it was made. */
                function tried(name, act) {
                    try {
                        act();
                        say(name, 'tried');
                    } catch (error) {
                        say(name, 'tried', nameOf(error));
                    }
                }

                // Opened by itself the page is its own parent and top: the tries of a page above it are no tries, and moving the top
                // would move the probe itself away before it is read.
                var framed = self !== top;
                function framedTry(name, act) {
                    if (framed) syncTry(name, act);
                    else say(name, 'not-framed');
                }

                // Inside the page: its origin and what it may read.
                syncTry('origin', function () {
                    return self.origin === 'null' ? null : self.origin;
                });
                syncTry('localStorage', function () {
                    return window.localStorage.getItem('jason.ui.session') || window.localStorage.length || null;
                });
                syncTry('sessionStorage', function () {
                    return window.sessionStorage.length || null;
                });
                syncTry('cookie', function () {
                    return document.cookie;
                });
                framedTry('parent.document', function () {
                    return parent.document.title;
                });
                framedTry('parent.localStorage', function () {
                    return parent.localStorage.getItem('jason.ui.session');
                });
                framedTry('parent.location', function () {
                    return parent.location.href;
                });

                // Out of the page, at the witness: the witness hearing any of these is the seal broken.
                tried('witness window.open', function () {
                    window.open(witness + '/popup', '_blank');
                });
                // Decided outside the page, by the smoke's own listener: a dialog shown.
                tried('alert', function () {
                    window.alert('probe');
                });

                // The ways that would move a page away: a form, a download, the top's address and the page's own move.
                // A browser may begin to move the page for one before it refuses it, and a page that is moving cannot be
                // read, so they wait until the smoke has read what the page wrote, and the smoke starts them; the
                // witness and the smoke's own listeners decide them, and the page writes nothing of them.
                window.probeLeave = function () {
                    var tries = [
                        function () {
                            var form = document.createElement('form');
                            form.method = 'post';
                            form.action = witness + '/form';
                            document.body.appendChild(form);
                            form.submit();
                        },
                        function () {
                            var link = document.createElement('a');
                            link.href = 'data:text/plain,probe';
                            link.download = 'probe.txt';
                            document.body.appendChild(link);
                            link.click();
                        },
                        function () {
                            if (framed) top.location.href = witness + '/top';
                        },
                        // Opened by itself the page may move its own tab, a residual docs/ui.md states: only in a frame
                        // is its own move a way out to try.
                        function () {
                            if (framed) location.assign(witness + '/move');
                        },
                    ];
                    tries.forEach(function (each, index) {
                        setTimeout(function () {
                            try {
                                each();
                            } catch (error) {
                                // Refused at once; the witness decides all the same.
                            }
                        }, index * 300);
                    });
                };

                Promise.all([
                    asyncTry('indexedDB', function () {
                        return new Promise(function (resolve, reject) {
                            var request = indexedDB.open('probe');
                            request.onsuccess = function () {
                                resolve('opened');
                            };
                            request.onerror = function () {
                                reject(request.error);
                            };
                        });
                    }),
                    asyncTry('witness fetch', function () {
                        return fetch(witness + '/fetch');
                    }),
                    asyncTry('witness fetch no-cors', function () {
                        return fetch(witness + '/no-cors', { mode: 'no-cors' });
                    }),
                    eventTry(
                        'witness image',
                        function () {
                            var image = new Image();
                            image.src = witness + '/image.png';
                            return image;
                        },
                        'load',
                        'error',
                        3000,
                    ),
                    eventTry(
                        'witness websocket',
                        function () {
                            return new WebSocket(witness.replace(/^http/, 'ws') + '/socket');
                        },
                        'open',
                        'error',
                        3000,
                    ),
                    // At the runtime's own address, a file the UI serves to anyone: only the policy stands between the page and it.
                    asyncTry('own fetch no-cors', function () {
                        return fetch('/ui/favicon.svg', { mode: 'no-cors' });
                    }),
                    eventTry(
                        'own image',
                        function () {
                            var image = new Image();
                            image.src = '/ui/favicon.svg';
                            return image;
                        },
                        'load',
                        'error',
                        3000,
                    ),
                ]).then(function () {
                    document.body.setAttribute('data-done', '1');
                });
            })();
        </script>
    </body>
</html>
