<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo | Live</title>
<!--
The desktop's own Demo | Live switch, drawn over the demo page's top strip, right of its 284-pixel sidebar and 38 high,
in a view of its own (src/demo-page.ts, demoLayout). The page draws the strip's dot and words itself and leaves the
strip's right end free for a switch; this page is transparent, its view too, so the page's strip shows through, and it
draws the switch alone at the right end, on the strip's own colour. It is the window's drag region, but for the switch
itself. It holds no script: Live is a link the view refuses to follow and reads as the person's choice
(src/demo-page.ts, switchChoice); Demo is the mode in force. It is served alone, under the same content policy as the
page. Its look is the console's Demo switch: a segmented control, padded 12 from the right. On Windows the system's
caption buttons stand over the strip's right end; the view is told the free title bar area in its own coordinates, and
the right padding leaves the buttons their width, so the switch stands left of them. Without an overlay the area is all
of it, and the padding is 12.
-->
<style>
:root { color-scheme: light; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; -webkit-app-region: drag; }
body { display: flex; align-items: center; justify-content: flex-end; box-sizing: border-box; padding: 0 12px 0 16px; padding-right: calc(12px + 100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw)); color: #6b4e00; font: 500 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
.switch { -webkit-app-region: no-drag; flex: none; display: flex; padding: 2px; border-radius: 7px; background: linear-gradient(rgba(20, 33, 43, .08), rgba(20, 33, 43, .08)), #fff4d6; box-shadow: 0 0 0 5px #fff4d6; }
.switch a, .switch span { display: block; padding: 2px 12px; border-radius: 5px; font: 500 12px/18px system-ui, -apple-system, "Segoe UI", sans-serif; color: inherit; text-decoration: none; user-select: none; -webkit-user-drag: none; }
.switch span[aria-current] { background: #fff; color: #14212b; font-weight: 600; box-shadow: 0 1px 2px rgba(20, 33, 43, .18); }
.switch a:focus-visible { outline: 2px solid #005aff; outline-offset: 1px; }
</style>
</head>
<body>
<nav class="switch" aria-label="Demo or Live">
<span aria-current="page">Demo</span>
<a href="jason-switch://switch/live" draggable="false">Live</a>
</nav>
</body>
</html>
