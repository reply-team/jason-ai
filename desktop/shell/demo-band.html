<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jason</title>
<!--
The band of the Demo window on macOS, where the traffic lights stand once the title bar is hidden: the window's own
contents, under the page's view and our switch's, which both start at the window's top edge (src/demo-page.ts,
demoLayout). The page covers it whole, so nothing it paints is seen once the page is shown; until then it is the page's
own ground, the sidebar's colour over the page's 284-pixel sidebar and the page's ground beyond, never the yellow of the
Demo's strip. The page has no dark theme, so neither has the band. It holds no script and nothing to click.

It is the window's drag region over the window's top 26 pixels (demoGeometry.macBand), over the sidebar, where the
page leaves those pixels empty for the traffic lights (demoMacSheet). Electron asks the window's own contents first
whether a point is in a drag region, whichever view is drawn there, so the body alone drags, exactly as high as the
band, and the document as a whole carries no drag region: one would take every click meant for the page and the
switch. Our switch's view, from the sidebar's right edge (demoGeometry.sidebar) to the window's, is cut out of it
(demoLayout's cut): the band never drags over that view, and inside it the switch's own page decides what drags and
what takes a click.
-->
<style>
:root { color-scheme: light; }
html { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(to right, #f3f5f9 0 284px, #fff 284px); }
body { margin: 0; height: 26px; position: relative; -webkit-app-region: drag; }
.cut { position: absolute; top: 0; left: 284px; right: 0; height: 26px; -webkit-app-region: no-drag; }
</style>
</head>
<body><div class="cut"></div></body>
</html>
