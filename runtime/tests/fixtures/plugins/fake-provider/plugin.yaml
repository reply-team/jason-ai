manifest_version: 1
id: fake-provider
version: 1.0.0
kind: provider
name: Fake provider
description: The test double every plugin-host test drives; copy its shape.
contracts:
  protocol: [1]
  operations: [1]
operations: [echo.run, context.echo, exec.run, http.get, env.read, log.emit, fail.transient, fail.permanent, fail.validation, fail.ambiguous, hang, spew, throw.plain, return.bare, escape.clr, escape.eval, escape.function, escape.constructor, module.import]
entry:
  module: main.js
  function: invoke
capabilities:
  exec:
    executables:
      - name: dotnet
  http:
    hosts: ["localhost:5555", "127.0.0.1:5555"]
  env:
    variables: [FAKE_TOKEN, FAKE_OTHER]
limits:
  timeout_ms: 20000
  memory_mb: 64
