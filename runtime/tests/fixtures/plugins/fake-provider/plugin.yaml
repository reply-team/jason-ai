manifest_version: 1
id: fake-provider
version: 1.0.0
kind: provider
name: Fake provider
description: The test double every plugin-host test drives; copy its shape.
contracts:
  protocol: [1]
  operations: [1]
operations: [echo.run, context.echo, exec.run, http.get, env.read, log.emit, fail.transient, fail.permanent, fail.validation, fail.ambiguous, hang.forever, spew.bytes, throw.plain, return.bare, escape.clr, escape.eval, escape.function, escape.constructor, module.import, campaign.get, list_membership.add, campaign.enroll]
entry:
  module: main.js
  function: invoke
capabilities:
  exec:
    # The vendor program this plugin drives, named as itself. Naming a language runtime instead — and passing the
    # real program to it as an argument — would be a grant that reaches every program that runtime can start.
    executables:
      - name: Jason.FakeProviderCli
  http:
    hosts: ["localhost:5555", "127.0.0.1:5555"]
  env:
    variables: [FAKE_TOKEN, FAKE_OTHER]
limits:
  timeout_ms: 20000
  memory_mb: 64
binding:
  type: object
  additionalProperties: false
  required: [workspace]
  properties:
    workspace:
      type: string
      minLength: 1
      description: The directory holding the provider account this route acts in.
