manifest_version: 1
id: journal-forwarder
version: 1.0.1
kind: subscriber
name: Journal forwarder
description: Pushes each journal line of a kind it was granted, as JSON, to one URL the person names - the smallest complete subscriber.
homepage: https://github.com/reply-team/jason-ai/tree/main/plugins/journal-forwarder
contracts:
  protocol: [1]
capabilities:
  http:
    # The receiver. A loopback address by default; another host is named here instead, which is an owner's edit of this
    # file: the package's digest changes with it, and the grant must name the same host (see README.md).
    hosts: [localhost:8787]
  env:
    # Where to push, and an optional bearer token for a receiver that requires one, both read with host.env. Neither is
    # part of the manifest, and neither is ever logged or returned.
    variables: [JOURNAL_FORWARDER_URL, JOURNAL_FORWARDER_TOKEN]
# Every journal kind a plugin may subscribe to, as the catalog stands for this version of the package. A declaration has no
# wildcard; the person narrows these by the grant (Plugins:Grants:journal-forwarder:Subscriptions). A kind the catalog
# gains is added here with a new version of the package.
subscriptions:
  - approval_approved
  - approval_cancelled
  - approval_rejected
  - approval_requested
  - approval_standing_applied
  - approval_superseded
  - campaign_archived
  - campaign_created
  - campaign_paused
  - campaign_started
  - campaign_updated
  - contact_archived
  - contact_created
  - contact_updated
  - contacts_added
  - contacts_removed
  - context_updated
