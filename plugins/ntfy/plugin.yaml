manifest_version: 1
id: ntfy
version: 1.0.3
kind: notification
name: ntfy
description: Delivers Jason's notifications to an ntfy topic - the pointer the runtime composes, and nothing else.
homepage: https://github.com/reply-team/jason-ai/tree/main/plugins/ntfy
contracts:
  protocol: [1]
  # The delivery contract this package performs, notification.send version 1. A notification plugin implements no
  # canonical operation: the `operations` list names versions of the delivery contract.
  operations: [1]
capabilities:
  http:
    # The public server. A server of your own is yours to grant, which is why the manifest says any_granted_host: no edit
    # of this file is needed, and the binding's server names it (see README.md). The star in a grant still means ntfy.sh
    # alone.
    any_granted_host: true
    hosts: [ntfy.sh]
  env:
    # An access token for a server that requires one, read with host.env and sent as a bearer header. It is never
    # part of the binding.
    variables: [NTFY_TOKEN]
binding:
  type: object
  properties:
    server:
      type: string
      pattern: "^https?://[^/?#]+$"
    topic:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
  required: [topic]
  additionalProperties: false
