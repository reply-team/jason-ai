manifest_version: 1
id: reply
version: 0.14.1
kind: provider
name: Reply
description: >-
  Jason's canonical provider operations, performed against a Reply account through the Reply CLI, which owns the
  credential and keeps it out of this package entirely.
homepage: https://reply.io
contracts:
  protocol: [1]
  operations: [1]
  # The runtime's own reader asks the account's events of this package, from Reply's change feed (`reply inbox changes`).
  events: [1]
operations: [campaign.get, campaign.create, list_membership.add, campaign.enroll, enrollment.list, engagement.summarize, conversation.list, conversation.get, campaign.pause, campaign.activate, optout.record, enrollment.stop, conversation.reply, conversation.classify, conversation.close, conversation.reopen, contact.update, contact.delete, sender.list, schedule.list, social_invitation.send, message.send, message.status, message.cancel]
entry:
  module: main.js
  function: invoke
capabilities:
  exec:
    # The vendor CLI itself, by its own name. It holds the account's credential, so this package never sees one:
    # signing in is the operator's act, and the profile the route's binding names is how a call reaches the right
    # account. A language runtime is never declared here — granting one would reach every program it can start.
    executables:
      - name: reply
        # The oldest release that has the work commands every operation below runs — `reply contact find`,
        # `reply sequence create`, `reply sequence add-contact`, `reply inbox reply`, `reply account list`,
        # `reply contact linkedin-connect`, `reply contact send-email` and the rest — with the results and the error
        # codes this package reads, a LinkedIn URL matched by its lowercased slug, a start that says the state it left,
        # the Reply user whose each account is, and the contact options on the direct sends and on `reply contact
        # update`, which import a person Reply holds nobody for, `reply schedule list`, the account's sending schedules
        # with their windows, and `reply inbox changes`, Reply's change feed — and, on the direct sends, the moment a send
        # goes out after (`--send-after`), the key it is made under (`--idempotency-key`), the sending schedule an email is
        # timed by (`--schedule-id`) and the reference, the moment and the state Reply answers, with `reply direct-send
        # get`, which also reads a send by its reference, and `reply direct-send cancel`, which takes one back — and the
        # client a call came through, which the CLI reads from `REPLY_CLIENT` from 0.17.2. This package makes no raw
        # call. A reload runs the version command and refuses an older one.
        min_version: 0.17.2
        version_command: ["--version"]
  # No `http`: every provider call goes through the CLI, which is what holds the credential. A package that could
  # reach the API directly would need a credential of its own, and then there would be two places one can leak
  # from.
  #
  # No `env`: this package reads no variable at all. An operator's own REPLY_API_KEY, REPLY_PROFILE, REPLY_TEAM_ID
  # or REPLY_CONFIG_DIR deliberately does not reach the child, so an account is chosen by the binding below and by
  # the profile store the CLI already keeps, never by whatever happened to be exported in a shell.
#
# Memory, and nothing else. The budget counts what an invocation allocates, every answer it reads included, and an
# answer can be as large as the exec capture (`Plugins:Exec:OutputBytes`, 4 MiB by default). It was set for a thread
# read that held two answers at the cap — the thread with its whole history, then the page. The CLI's thread no
# longer carries its history, so that read now holds one; 256 MiB is kept, under the installation's default ceiling
# of 512.
#
# No `timeout_ms`: the installation's default timeout is the budget of the slowest operation this runtime
# publishes, and a package's own limit can only lower what an operation asks for. `campaign.enroll` is allowed
# 300 s, so a smaller ceiling here would kill an invocation that the contract says is still running — reported as
# ambiguous, because the provider may already have enrolled someone.
limits:
  memory_mb: 256
# The moment a send goes out after: Reply keeps a direct send for a later moment on email and on LinkedIn, and an
# invitation goes only on LinkedIn.
arguments:
  message.send:
    send_after: [email, linkedin]
  social_invitation.send:
    send_after: [linkedin]
# The channels a message goes on as a template Reply fills in for the person: an email, and on LinkedIn a message and an
# InMail. A voice message is spoken from a final script, and Reply's LinkedIn sending account carries no last name.
templates:
  message.send: [email, linkedin]
# A send that lost its answer is settled by the work item's key: the send carries it to Reply, and a repeat first asks
# Reply what it already holds under that key, so the runtime may repeat these two.
settles_by_key: [message.send, social_invitation.send]
binding:
  type: object
  additionalProperties: false
  properties:
    profile:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        The reply-cli profile this route acts as — one of the profiles `reply profile list` shows, each with its
        own stored credential. Absent means whichever profile the CLI itself is currently set to.
    team_id:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        The team whose data the account acts in, for a credential that spans more than one. Absent means whatever
        the profile itself resolves to.
    derive_first_name:
      type: boolean
      description: >-
        Whether a person with no first name, whom Reply holds nobody for under their address, is imported under a
        first name derived from their last name or, failing that, from their address's text before the @. Absent
        means true. False refuses such a person instead, and they are not created at Reply. An opt-out derives
        whatever this says: it greets nobody, and refusing it would leave the person unflagged.
