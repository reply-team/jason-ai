manifest_version: 1
id: reply
version: 0.15.0
kind: provider
name: Reply
description: >-
  Jason's canonical provider operations, performed against a Reply account through the Reply CLI, which owns the
  credential and keeps it out of this package entirely.
homepage: https://reply.io
contracts:
  protocol: [1]
  operations: [1]
  # The runtime's own reader asks the account's events of this package, from Reply's change feed (`reply inbox changes`).
  events: [1]
operations: [campaign.get, campaign.create, list_membership.add, campaign.enroll, enrollment.list, engagement.summarize, conversation.list, conversation.get, campaign.pause, campaign.activate, optout.record, enrollment.stop, conversation.reply, conversation.classify, conversation.close, conversation.reopen, contact.update, contact.delete, sender.list, schedule.list, social_invitation.send, message.send, message.status, message.cancel, audience.preview, audience.search, audience.search_status, audience.search_cancel, audience.filter_values, audience.availability]
entry:
  module: main.js
  function: invoke
capabilities:
  exec:
    # The vendor CLI itself, by its own name. It holds the account's credential, so this package never sees one:
    # signing in is the operator's act, and the profile the route's binding names is how a call reaches the right
    # account. A language runtime is never declared here — granting one would reach every program it can start.
    executables:
      - name: reply
        # The oldest release that has the work commands every operation below runs — `reply contact find`,
        # `reply sequence create`, `reply sequence add-contact`, `reply inbox reply`, `reply account list`,
        # `reply contact linkedin-connect`, `reply contact send-email` and the rest — with the results and the error
        # codes this package reads, a LinkedIn URL matched by its lowercased slug, a start that says the state it left,
        # the Reply user whose each account is, and the contact options on the direct sends and on `reply contact
        # update`, which import a person Reply holds nobody for, `reply schedule list`, the account's sending schedules
        # with their windows, and `reply inbox changes`, Reply's change feed — and, on the direct sends, the moment a send
        # goes out after (`--send-after`), the key it is made under (`--idempotency-key`), the sending schedule a send is
        # timed by (`--schedule-id`) and the reference, the moment and the state Reply answers, with `reply direct-send
        # get`, which also reads a send by its reference, and `reply direct-send cancel`, which takes one back — and the
        # client a call came through, which the CLI reads from `REPLY_CLIENT` from 0.17.2, and the reference a LinkedIn
        # send Reply holds for later is read and cancelled by, `linkedin-scheduled-<n>`, a code of its own for a cancel
        # of a send Reply is sending, a cancel Reply could not confirm and a sending schedule that cannot time a send,
        # and the moment Reply expects to send one waiting for its schedule, which it gives from 0.18.0 — and Live Data and
        # the contact lists a search fills, `reply live-data preview|start|get|list|delete|filter-values` and `reply
        # contact-list create|get|delete|contacts`, from 0.20.0. This package makes no raw call. A reload runs the version
        # command and refuses an older one.
        min_version: 0.20.0
        version_command: ["--version"]
  # No `http`: every provider call goes through the CLI, which is what holds the credential. A package that could
  # reach the API directly would need a credential of its own, and then there would be two places one can leak
  # from.
  #
  # No `env`: this package reads no variable at all. An operator's own REPLY_API_KEY, REPLY_PROFILE, REPLY_TEAM_ID
  # or REPLY_CONFIG_DIR deliberately does not reach the child, so an account is chosen by the binding below and by
  # the profile store the CLI already keeps, never by whatever happened to be exported in a shell.
#
# Memory, and nothing else. The budget counts what an invocation allocates, every answer it reads included, and an
# answer can be as large as the exec capture (`Plugins:Exec:OutputBytes`, 4 MiB by default). It was set for a thread
# read that held two answers at the cap — the thread with its whole history, then the page. The CLI's thread no
# longer carries its history, so that read now holds one; 256 MiB is kept, under the installation's default ceiling
# of 512.
#
# No `timeout_ms`: the installation's default timeout is the budget of the slowest operation this runtime
# publishes, and a package's own limit can only lower what an operation asks for. `campaign.enroll` is allowed
# 300 s, so a smaller ceiling here would kill an invocation that the contract says is still running — reported as
# ambiguous, because the provider may already have enrolled someone.
limits:
  memory_mb: 256
# The moment a send goes out after: Reply keeps a direct send for a later moment on email and on LinkedIn, and an
# invitation goes only on LinkedIn.
arguments:
  message.send:
    send_after: [email, linkedin]
  social_invitation.send:
    send_after: [linkedin]
# The channels a message goes on as a template Reply fills in for the person: an email, and on LinkedIn a message and an
# InMail. A voice message is spoken from a final script, and Reply's LinkedIn sending account carries no last name.
templates:
  message.send: [email, linkedin]
# A send that lost its answer is settled by the work item's key: the send carries it to Reply, and a repeat first asks
# Reply what it already holds under that key, so the runtime may repeat these two.
settles_by_key: [message.send, social_invitation.send]
binding:
  type: object
  additionalProperties: false
  properties:
    profile:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        The reply-cli profile this route acts as — one of the profiles `reply profile list` shows, each with its
        own stored credential. Absent means whichever profile the CLI itself is currently set to.
    team_id:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        The team whose data the account acts in, for a credential that spans more than one. Absent means whatever
        the profile itself resolves to.
    derive_first_name:
      type: boolean
      description: >-
        Whether a person with no first name, whom Reply holds nobody for under their address, is imported under a
        first name derived from their last name or, failing that, from their address's text before the @. Absent
        means true. False refuses such a person instead, and they are not created at Reply. An opt-out derives
        whatever this says: it greets nobody, and refusing it would leave the person unflagged.
# The definition of an audience, as Reply's Live Data search takes its filters: Reply's own names and shapes, passed to
# `reply live-data start` and `reply live-data preview` exactly as written, with Reply's own bounds — at most 25 values a
# filter, each at most 200 characters, and at least one filter that filters — so a definition Reply would refuse for them
# is refused at the claim, before Reply is asked. The rules of Reply's the dialect cannot say are Reply's to refuse,
# `definition_rejected`: account lists included beside a company filter, a minimum above its maximum — revenue, or a
# growth range — and a value of nothing but spaces. `keys`
# says which side of a person each filter is about and which of Reply's lists of values (`reply live-data filter-values`)
# it pairs with: those lists are suggestions, and Reply checks no value against them.
audience_definition:
  schema:
    type: object
    additionalProperties: false
    anyOf:
      - { required: [accountListIds] }
      - { required: [industries] }
      - { required: [companyLocations] }
      - { required: [companySizes] }
      - { required: [headcountGrowth] }
      - { required: [departmentHeadcountGrowth] }
      - { required: [minRevenue] }
      - { required: [maxRevenue] }
      - { required: [accountKeywords] }
      - { required: [isHiringOnLinkedIn] }
      - { required: [contactLocations] }
      - { required: [jobTitles] }
      - { required: [departments] }
      - { required: [seniorities] }
      - { required: [contactKeywords] }
    properties:
      accountListIds:
        description: >-
          Saved account lists at Reply, by their id, each to include or exclude. An included list is the set of
          companies searched, so it cannot stand beside a company filter: Reply refuses that combination. Contact
          filters still apply.
        type: array
        minItems: 1
        maxItems: 25
        items:
          type: object
          additionalProperties: false
          required: [value, type]
          properties:
            value: { type: integer, minimum: 1, maximum: 2147483647 }
            type: { enum: [include, exclude] }
      industries:
        description: >-
          The industries the company is in, as Reply names them, each to include or exclude. Reply's suggestions are the
          `industries` values; Reply also takes any other text.
        type: array
        minItems: 1
        maxItems: 25
        items: { $ref: "#/$defs/term" }
      companyLocations:
        description: >-
          Where the company is — a country, a region or a city — each to include or exclude. Reply's suggestions are the
          `locations` values, which mix countries, regions and cities.
        type: array
        minItems: 1
        maxItems: 25
        items: { $ref: "#/$defs/term" }
      companySizes:
        description: >-
          The company's headcount, as Reply's bands: selfEmployed, ten (2-10), fifty (11-50), twoHundred (51-200),
          fiveHundred (201-500), oneThousand (501-1000), fiveThousand (1001-5000), tenThousand (5001-10000),
          overTenThousand (more), or none (no headcount known). A company in any band listed is included.
        type: array
        minItems: 1
        maxItems: 25
        uniqueItems: true
        items: { enum: [none, selfEmployed, ten, fifty, twoHundred, fiveHundred, oneThousand, fiveThousand, tenThousand, overTenThousand] }
      headcountGrowth:
        description: >-
          How much the company's whole headcount grew, in percent: `min`, `max` or both, whole numbers from 0, the bounds
          included.
        type: object
        additionalProperties: false
        anyOf: [{ required: [min] }, { required: [max] }]
        properties:
          min: { type: integer, minimum: 0 }
          max: { type: integer, minimum: 0 }
      departmentHeadcountGrowth:
        description: >-
          How much one department's headcount grew, in percent: the `department` by name, and `min`, `max` or both,
          whole numbers from 0, the bounds included. Reply's suggestions for a department's name are the `departments`
          values.
        type: object
        additionalProperties: false
        required: [department]
        anyOf: [{ required: [min] }, { required: [max] }]
        properties:
          department: { type: string, minLength: 1, maxLength: 200 }
          min: { type: integer, minimum: 0 }
          max: { type: integer, minimum: 0 }
      minRevenue:
        description: >-
          The company's smallest annual revenue, as Reply's tiers in US dollars: zeroMillion, halfMillion, oneMillion,
          twoAndHalfMillion, fiveMillion, tenMillion, twentyMillion, fiftyMillion, oneHundredMillion, fiveHundredMillion,
          oneThousandMillion, overOneThousandMillion. Not above `maxRevenue`.
        $ref: "#/$defs/revenue"
      maxRevenue:
        description: >-
          The company's largest annual revenue, as Reply's tiers in US dollars, the same tiers as `minRevenue`. Not below
          `minRevenue`.
        $ref: "#/$defs/revenue"
      accountKeywords:
        description: >-
          Words the company is described by, each to include or exclude, and whether a company needs any of them (`or`)
          or all of them (`and`).
        $ref: "#/$defs/keywords"
      isHiringOnLinkedIn:
        description: >-
          Only companies hiring on LinkedIn now. Written true or left out: false filters nothing, and Reply reads it as
          left out.
        const: true
      contactLocations:
        description: >-
          Where the person is — a country, a region or a city — each to include or exclude. Reply's suggestions are the
          `locations` values, which mix countries, regions and cities.
        type: array
        minItems: 1
        maxItems: 25
        items: { $ref: "#/$defs/term" }
      jobTitles:
        description: >-
          The person's job title, each to include or exclude, matched as Reply matches titles. Reply's suggestions are the
          `job-titles` values; Reply also takes any other text.
        type: array
        minItems: 1
        maxItems: 25
        items: { $ref: "#/$defs/term" }
      departments:
        description: >-
          The department the person works in, each to include or exclude. Reply's suggestions are the `departments`
          values.
        type: array
        minItems: 1
        maxItems: 25
        items: { $ref: "#/$defs/term" }
      seniorities:
        description: >-
          The person's seniority, each written as Reply's own word for it, plain text with no include or exclude: every
          seniority listed is included. Reply's words are the `seniorities` values.
        type: array
        minItems: 1
        maxItems: 25
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 200 }
      contactKeywords:
        description: >-
          Words the person's profile is described by, each to include or exclude, and whether a person needs any of them
          (`or`) or all of them (`and`).
        $ref: "#/$defs/keywords"
    $defs:
      term:
        type: object
        additionalProperties: false
        required: [value, type]
        properties:
          value: { type: string, minLength: 1, maxLength: 200 }
          type: { enum: [include, exclude] }
      revenue:
        enum: [zeroMillion, halfMillion, oneMillion, twoAndHalfMillion, fiveMillion, tenMillion, twentyMillion, fiftyMillion, oneHundredMillion, fiveHundredMillion, oneThousandMillion, overOneThousandMillion]
      keywords:
        type: object
        additionalProperties: false
        required: [values, type]
        properties:
          values:
            type: array
            minItems: 1
            maxItems: 25
            items: { $ref: "#/$defs/term" }
          type: { enum: [or, and] }
  keys:
    accountListIds: { side: company }
    industries: { side: company, typeahead: industries }
    companyLocations: { side: company, typeahead: locations }
    companySizes: { side: company }
    headcountGrowth: { side: company }
    departmentHeadcountGrowth: { side: company, typeahead: departments }
    minRevenue: { side: company }
    maxRevenue: { side: company }
    accountKeywords: { side: company }
    isHiringOnLinkedIn: { side: company }
    contactLocations: { side: person, typeahead: locations }
    jobTitles: { side: person, typeahead: job-titles }
    departments: { side: person, typeahead: departments }
    seniorities: { side: person, typeahead: seniorities }
    contactKeywords: { side: person }
